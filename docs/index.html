dit-crunch severity, external-finance dependence, and working-capital intensity. Empirically, they first show that Reg Q-driven credit crunches (deposit outflows when Fed tightening pushes rates above the ceilings) track stagflation over time, then test the cross-sectional predictions across manufacturing industries by exposure. Bank-level regulatory data back to 1959 measure the deposit outflows and lending contractions; the industry-by-time comparison provides the identifying variation.", "categories": ["Monetary Economics", "Banking", "Macro-Finance"], "shock": {"name": "Regulation Q-induced credit crunches", "type": "Quasi-exogenous credit contraction", "what": "Episodes where Fed tightening pushed market rates above Regulation Q deposit-rate ceilings, triggering deposit outflows (disintermediation) that forced banks to cut lending, driven by the interaction of the ceilings with monetary policy rather than by loan demand."}, "missing_notes": null, "file_path": "", "datasets": ["U.S. Call Reports (via FOIA)", "NBER-CES — Manufacturing Industry Database", "FDIC — Historical Bank Data", "Federal Reserve — Senior Loan Officer Opinion Survey (SLOOS)"]}, {"std_name": "Working Paper - 2026 - Chen and Sacerdote - Capital in the Capitol Congressional Trades Resemble Uninformed Retail Trading", "journal": null, "year": 2026, "title": "Capital in the Capitol: Congressional Trades Resemble Uninformed Retail Trading", "authors": ["Chen", "Sacerdote"], "summary": "This paper asks whether members of Congress exploit informational advantages in their personal stock trading, using a new hand-collected dataset of all U.S. legislators' and their families' trades from 2012 to 2023. After the STOCK Act, legislators' portfolios on average underperform or merely match market benchmarks. To explain this mediocre performance, the authors show legislators' positions track financial professionals' recommendations and that their trade timing reflects prevailing market sentiment - estimated from retail investors' social-media posts - rather than anticipating price moves. Congressional trading thus looks like public-signal-following and resembles uninformed retail behavior. The paper pushes back on the view that legislators systematically trade on private information.", "logical_flow": "The paper revisits whether members of Congress exploit informational advantages in their personal trading, noting prior studies relied on limited samples and offered little on mechanisms. It first builds a comprehensive, hand-collected dataset of all legislators' and their families' trades from 2012-2023, then evaluates portfolio performance against multiple benchmarks, finding that after the STOCK Act legislators on average underperform or merely match the market. The interesting question becomes why performance is mediocre, and the paper tests two possibilities about how legislators actually trade. It shows their positions track the recommendations of financial professionals, suggesting they follow public expert signals rather than private information. It then shows their trade timing aligns with prevailing market sentiment, estimated from retail investors' social-media posts, rather than anticipating future price changes, indicating they buy and sell with the crowd. Together these results imply that legislators' observable trading behavior resembles uninformed retail trading, following public signals and sentiment, which reconciles the lack of outperformance with the popular perception of informational advantage and pushes back on the view that congressional trading systematically exploits inside information.", "research_design": "A performance-evaluation-plus-mechanism design on a hand-collected record of congressional and family trades (2012-2023), a period defined by the STOCK Act disclosure regime. Portfolio performance is measured with event-study and calendar-time methods against several benchmarks to test for out- or under-performance. Mechanism tests then relate legislators' trades to analyst recommendations and to a social-media sentiment measure, examining whether their timing follows public signals rather than anticipating price moves. The unit of analysis is the trade and legislator.", "categories": ["Political Economy", "Informed Trading", "Behavioral Finance"], "shock": {"name": "STOCK Act (2012)", "type": "Legislative / disclosure reform", "what": "The Stop Trading on Congressional Knowledge Act, which required members of Congress and their families to publicly disclose securities transactions, creating the disclosure regime whose trades the paper analyzes."}, "missing_notes": null, "file_path": "", "datasets": ["Chen & Sacerdote (this paper) — Congressional trading records", "Context Analytics — S-Score (Twitter/X sentiment)"]}, {"std_name": "Working Paper - 2026 - Pagel et al. - Bank Fees and Household Financial Well-Being", "journal": null, "year": 2026, "title": "Bank Fees and Household Financial Well-Being", "authors": ["Pagel", "Sridhar", "Williams"], "summary": "This paper studies 2017-2022 policy changes at large U.S. banks that eliminated non-sufficient-funds (NSF) fees and relaxed overdraft policies, using individual transaction-level data. Eliminating NSF fees immediately reduced NSF charges across the income distribution, as expected. Relaxing overdraft policies, however, reduced overdraft fees only for wealthier (higher-income, higher-liquidity) households, and only they saw subsequent declines in late fees, interest, maintenance fees, and use of alternatives like payday loans. The authors conclude the changes were not substantial enough to meaningfully relieve financial stress for the most vulnerable households. Methodologically, the multi-treatment, varying-intensity setting motivates a new stacked event-study estimator related to de Chaisemartin et al. (2024) to handle staggered-DiD biases.", "logical_flow": "The paper studies whether widely publicized reductions in bank fees actually improved household financial well-being, exploiting 2017-2022 policy changes at large U.S. banks that eliminated non-sufficient-funds fees and relaxed overdraft policies. Using individual transaction-level data, it first confirms the mechanical effect, since eliminating NSF fees immediately lowered NSF charges across the income distribution. The more subtle question is distributional, namely who benefited from the overdraft relaxation, and here the paper finds the gains were concentrated among wealthier households (higher income and liquidity), who alone experienced overdraft-fee reductions and, subsequently, declines in late fees, interest payments, maintenance fees, and use of alternatives like payday loans. Vulnerable households, by contrast, saw little relief, implying the policy changes were not substantial enough to reduce their financial stress. Methodologically, the setting features multiple treatments with varying intensities, which standard staggered difference-in-differences estimators handle poorly, so the paper motivates and implements a new stacked event-study estimator related to recent econometric work. The argument thus connects a seemingly consumer-friendly reform to a distributional outcome, benefits accruing to those least in need, while contributing an estimation approach suited to its complicated treatment structure.", "research_design": "A stacked event-study (staggered difference-in-differences) design exploiting a wave of policy changes at large banks between 2017 and 2022 that eliminated NSF fees and relaxed overdraft terms. Because these changes hit different banks at different times and with different intensity, which trips up conventional staggered-DiD estimators, the authors develop and apply a new stacked estimator (related to de Chaisemartin et al., 2024). They estimate effects separately across the income and liquidity distribution to recover who actually benefited, using individual transaction-level data. The unit of analysis is the household or account over time.", "categories": ["Household Finance", "Banking", "Consumer Protection"], "shock": {"name": "Large banks' NSF-fee eliminations and overdraft-policy changes (2017-2022)", "type": "Staggered policy changes", "what": "A wave of bank-initiated changes at major U.S. banks that eliminated non-sufficient-funds fees and relaxed overdraft terms, staggered across banks and treated as quasi-exogenous to individual households."}, "missing_notes": null, "file_path": "", "datasets": ["Consumer transaction-data provider", "FDIC — Summary of Deposits"]}, {"std_name": "Working Paper - 2026 - Matvos et al. - Private Credit, Balance Sheets and Financial Stability", "journal": null, "year": 2026, "title": "Private Credit, Balance Sheets and Financial Stability", "authors": ["Matvos", "Piskorski", "Seru"], "summary": "This paper uses new, comprehensive fund- and asset-level data covering most of the private-credit industry to assess its balance sheets and financial-stability implications. Private-credit funds are highly capitalized, with equity typically 65-80% of assets - more than six times the capitalization of U.S. banks - and use only moderate debt, largely bank credit lines for liquidity management. Fund lives of 10-12 years exceed the shorter maturities of underlying loans, implying little maturity mismatch, unlike banks that fund long-term assets with short-term callable deposits. Portfolios are diversified across industries, geographies, and strategies, and performance shows positive average net returns with losses borne mainly by equity. The authors conclude that, as currently structured, private-credit funds are conservatively built and unlikely to pose bank-like systemic risks.", "logical_flow": "Debate over whether the fast-growing private-credit industry poses bank-like systemic risk has been hampered by limited data, so the paper brings comprehensive fund- and asset-level data to bear on how these funds are actually financed. It documents that private-credit funds are highly capitalized, with equity typically 65-80% of assets, more than six times banks' roughly 10%, and that their debt use is moderate and mostly bank credit lines for liquidity management rather than leverage. It then examines maturity structure and finds fund lives of 10-12 years exceed the maturities of the underlying loans, implying little maturity mismatch, in sharp contrast to banks that fund long-term assets with short-term callable deposits. Turning to portfolio risk, it shows holdings are diversified across industries, geographies, and strategies, limiting exposure to correlated shocks. On performance, it finds positive average net returns with limited downside to creditors because equity investors absorb losses first. Assembling these facts, the paper argues that as currently structured, private-credit funds are conservatively built and unlikely to generate the runnable, mismatch-driven fragility that makes banks systemically risky, while noting that this conclusion is conditional on current balance-sheet configurations.", "research_design": "A descriptive, comparative design using new proprietary data on roughly 1,300 private-credit funds and their loans, benchmarked against U.S. banks' regulatory data. The authors characterize how these funds are capitalized and funded, their maturity structure, portfolio diversification, and loss-bearing, and contrast each dimension with the analogous bank figures. The financial-stability conclusions follow from the documented balance-sheet structure rather than from a causal estimate; the units of analysis are the fund and the underlying loan.", "categories": ["Private Credit", "Financial Stability", "Banking"], "shock": null, "missing_notes": null, "file_path": "", "datasets": ["Proprietary private-credit data provider", "Preqin"]}, {"std_name": "Working Paper - 2026 - Baslandze et al. - Artificial Intelligence, Productivity, and the Workforce Evidence from Corporate Executives", "journal": null, "year": 2026, "title": "Artificial Intelligence, Productivity, and the Workforce: Evidence from Corporate Executives", "authors": ["Baslandze", "Edwards", "Graham", "McClure", "Meyer", "Sparks", "Waddell", "Weitz"], "summary": "This paper uses a novel survey of nearly 750 corporate executives to study how artificial intelligence is affecting productivity and the workforce. Adoption is highly heterogeneous: more than half of firms have already invested, though many smaller firms are just starting. Labor-productivity gains are positive, vary by sector, are expected to strengthen in 2026, and are concentrated in high-skill services and finance; they reflect higher revenue-based total factor productivity through innovation and demand channels rather than capital deepening. The authors document a 'productivity paradox' in which perceived gains exceed measured gains, likely due to delayed revenue realization. In labor markets they find little near-term aggregate employment decline, though large firms anticipate AI-driven reductions while smaller firms expect modest gains, alongside compositional labor reallocation.", "logical_flow": "Firm-level effects of AI are hard to observe in standard datasets, so the paper gathers direct evidence through a novel survey of nearly 750 corporate executives about adoption, productivity, and workforce plans. It first documents wide heterogeneity in adoption, since over half of firms have already invested while many smaller firms are only beginning, establishing that AI diffusion is uneven. It then characterizes productivity effects, which are positive, vary across sectors, are expected to strengthen going forward, and are largest in high-skill services and finance. Digging into the source of these gains, the paper argues they are not primarily due to capital deepening but reflect higher revenue-based total factor productivity operating through innovation- and demand-oriented channels. It surfaces a 'productivity paradox' in which perceived gains exceed measured gains, interpreting the gap as a lag between AI adoption and the realization of revenue. Turning to labor, it finds little evidence of near-term aggregate employment decline, but a divergence in expectations, since large firms anticipate AI-driven workforce reductions while smaller firms expect modest gains, alongside compositional reallocation of labor within and across firms. The narrative thus links where AI is adopted to how and when its productivity shows up, and to who gains or loses in the labor market.", "research_design": "A survey-based, descriptive design. A new survey of nearly 750 corporate executives measures AI adoption, its perceived and measured productivity effects, and workforce expectations, with responses weighted to match the U.S. Census industry and size distribution. The analysis documents how adoption and productivity effects vary across sectors and firm sizes, separates productivity gains coming from capital deepening versus revenue-based TFP, and quantifies the gap between perceived and measured gains. Results are cross-sectional patterns rather than causal estimates; the unit of analysis is the firm or executive respondent.", "categories": ["Economics of AI", "Productivity", "Labor Economics"], "shock": null, "missing_notes": null, "file_path": "", "datasets": ["Federal Reserve Bank of Atlanta & Duke University — Survey of corporate executives"]}, {"std_name": "Working Paper - 2026 - Eisfeldt et al. - Intangible Intensity", "journal": null, "year": 2026, "title": "Intangible Intensity", "authors": ["Eisfeldt", "Hartman-Glaser", "Kim", "Lee"], "summary": "This paper builds a text-based measure of firms' intangible investment intensity from 10-K filings and introduces a general 'semantic theme scoring' (STS) methodology. The approach further decomposes disclosure text into knowledge, customer, and organization capital. High-intangible-intensity firms are smaller, younger, and invest heavily in R&D and human capital, and the three subcomponents map to distinct firm types - knowledge-intensive (R&D-driven, high valuation, skilled labor), customer-intensive (mature, profitable, commercial), and organization-intensive (large, asset-heavy incumbents). The authors show managerial expenditure descriptions carry informative signals about intangible capital that complement financial statements. The paper offers both a new measure and a reusable NLP methodology for capturing corporate intangibles.", "logical_flow": "Because accounting statements poorly capture intangible capital, the paper turns to the language firms use to describe their spending and builds a text-based measure of intangible investment intensity from 10-K filings, introducing a general 'semantic theme scoring' methodology along the way. It further decomposes the disclosure text into three components, knowledge, customer, and organization capital, arguing these correspond to economically distinct kinds of intangible investment. It then validates the measure by relating it to firm characteristics, showing high-intangible firms are smaller, younger, and invest heavily in R&D and human capital, consistent with what intangible intensity should proxy. The decomposition is shown to map cleanly onto distinct firm types, where knowledge-intensive firms are R&D-driven with high valuations and skilled labor, customer-intensive firms are mature, profitable, and commercially oriented, and organization-intensive firms are large, asset-heavy incumbents, demonstrating the subcomponents carry different information. The broader argument is that managerial expenditure descriptions contain informative signals about intangible capital stocks that complement, rather than duplicate, financial-statement data, opening a path to measuring where firms sit in the intangible lifecycle. The methodological contribution, semantic theme scoring, is offered as a reusable tool for extracting economic constructs from disclosure text.", "research_design": "A text-as-data measurement exercise. The authors apply a new 'semantic theme scoring' method to firms' 10-K filings to build a measure of intangible-investment intensity and to split it into knowledge, customer, and organization capital. They validate the measure cross-sectionally by relating it and its three components to firm size, age, R&D, valuation, profitability, and workforce skill, showing the constructs behave as expected and that the components pick out distinct firm types. The unit of analysis is the firm-year, with filings as the raw input.", "categories": ["Intangible Capital", "Text-as-Data / NLP", "Corporate Finance"], "shock": null, "missing_notes": null, "file_path": "", "datasets": ["SEC (WRDS SEC Analytics Suite) — 10-K filings", "S&P Capital IQ"]}, {"std_name": "Working Paper - 2026 - Amiti et al. - Why Do Firms Pay Different Interest Rates on Their Bank Loans", "journal": null, "year": 2026, "title": "Why Do Firms Pay Different Interest Rates on Their Bank Loans?", "authors": ["Amiti", "Kashyap", "Kovner", "Weinstein"], "summary": "This paper documents large dispersion in interest rates on similar commercial and industrial loans using confidential supervisory data on the largest U.S. banks, and argues the spread is not explained by risk. The authors rationalize the dispersion with a search-cost model in which borrowers pay to solicit competing quotes. Estimated search costs are highest for smaller and riskier borrowers and lowest for public firms, matching predictable differences in screening and monitoring costs. The search costs are economically large: over a third of firms behave as if they never comparison-shop, half appear to obtain only two quotes, and the rest search widely. The paper interprets loan-rate dispersion as evidence of substantial search frictions in credit markets rather than pure risk pricing.", "logical_flow": "The paper documents a puzzle in confidential supervisory data: observably similar commercial-and-industrial borrowers pay markedly different interest rates, and this dispersion does not appear attributable to differences in credit risk. It proposes that the residual dispersion reflects search frictions, since firms must expend costly effort to solicit competing quotes and those that search less pay more. To formalize this, the authors adopt a search-cost model in which each borrower trades off the cost of obtaining another quote against the expected rate savings, so equilibrium rates depend on borrower-specific search costs. The model predicts that search costs should be systematically higher for borrowers who are more expensive to screen and monitor, namely smaller and riskier firms, and lower for transparent public firms. Estimating the model on the loan data, they recover these search costs and find them large and patterned exactly as predicted. The estimates also imply striking behavior, since a substantial share of firms act as if they never comparison-shop, about half appear to obtain only two quotes, and the remainder search widely. The paper thus reinterprets loan-rate dispersion not as mispriced risk but as the footprint of costly search, with implications for competition and borrower welfare in bank lending.", "research_design": "A structural estimation of a borrower search-cost model on confidential loan-level supervisory data. After showing that risk cannot explain why similar borrowers pay different C&I loan rates, the authors specify a model in which each firm decides how many competing quotes to gather, trading the cost of searching against the rate savings. Estimating the model recovers the distribution of search costs across borrower types, by size, risk, and whether the firm is public. Identification comes from how rate dispersion varies with these observable borrower characteristics under the model's structure; the unit of observation is the loan and borrower.", "categories": ["Banking", "Credit Markets", "Search Frictions"], "shock": null, "missing_notes": null, "file_path": "", "datasets": ["Federal Reserve — FR Y-14 supervisory data"]}, {"std_name": "Working Paper - 2026 - Dyck et al. - Venture Fraud", "journal": null, "year": 2026, "title": "Venture Fraud", "authors": ["Dyck", "Fang", "Hebert", "Xu"], "summary": "This paper assembles the first comprehensive sample of venture fraud - 614 U.S. venture-capital-backed startups founded since 2000 that faced fraud allegations - and studies its governance roots. Within a high-detection subsample of newly public firms, VC-backed firms are 54% more likely to face fraud charges than comparable non-VC-backed firms. Fraud is more likely where founders hold stronger control rights, more convex cash-flow rights, more investors, and more non-traditional investors, with founder-controlled boards 88% more likely to commit fraud than VC- or shared-control boards. Governance features predict fraud far better than founder characteristics, and hot funding conditions at the first round - which weaken governance - forecast later fraud. The paper reframes venture fraud as substantially a product of governance structures rather than individual bad actors.", "logical_flow": "The paper begins from a measurement gap, since there has been no comprehensive record of fraud among venture-backed startups, and closes it by hand-collecting a large sample of venture-fraud cases. It then asks whether venture capital is associated with more fraud, and finds that within a high-detection subsample of newly public firms, VC-backed firms are substantially more likely to face fraud charges than comparable non-VC-backed firms, a design meant to hold detection roughly constant. The core question is why, and the paper focuses on governance rather than the personal traits of founders. It argues that two features that have grown over time, founder-friendly control structures and complex cap tables with many and non-traditional investors, weaken the monitoring that would otherwise deter fraud. Using a panel prediction model, it shows fraud is more likely when founders have stronger control rights, more convex cash-flow rights, and when there are more and less-traditional investors, with founder-controlled boards far more fraud-prone than VC- or shared-control boards even within the same firm. It further shows that hot funding conditions at the initial round, which erode investors' governance leverage, predict later fraud, and that governance variables dominate founder characteristics in predicting fraud, implying venture fraud is largely a governance phenomenon that ex-ante contract design and market conditions help produce.", "research_design": "Two complementary designs on a hand-collected fraud sample. To test whether VC backing raises fraud without conflating it with better detection, the authors compare VC- and non-VC-backed firms within a set of newly public firms where detection is high and roughly uniform. To study why, they estimate a panel (hazard-style) prediction model over all VC-backed firms founded since 2000, relating the probability of fraud to governance features (founder control and cash-flow rights, number and type of investors, board control) and to funding-market conditions at the first round. The unit of analysis is the startup, and within-firm comparisons of board types help separate governance from other firm traits.", "categories": ["Venture Capital", "Corporate Governance", "Financial Fraud"], "shock": null, "missing_notes": null, "file_path": "", "datasets": ["PitchBook", "Crunchbase", "Dyck, Fang, Hebert & Xu (this paper) — Venture-fraud case sample"]}, {"std_name": "Working Paper - 2026 - Diwan et al. - Competition and Fraud in Health Care", "journal": null, "year": 2026, "title": "Competition and Fraud in Health Care", "authors": ["Diwan", "Eliason", "League", "Leder-Luis", "McDevitt", "Roberts"], "summary": "This paper examines how competition affects fraud when governments procure goods and services from private firms, using Medicare's durable medical equipment (DME) market. The authors argue competition has an ambiguous effect on fraud: it dissipates the rents that attract fraudulent firms, but also squeezes margins so that legitimate firms may exit. Exploiting Medicare's switch from administratively regulated prices to competitive bidding for DME, they show that fraudulent suppliers' cost advantage let them gain market share while legitimate suppliers left the market. The result implies that price competition can perversely concentrate a market in fraudulent providers. The paper connects procurement design to the composition of firms and the prevalence of fraud.", "logical_flow": "Governments buy many goods and services from private firms, and competition is generally expected to lower prices, but the paper argues its effect on fraud is theoretically ambiguous. On one hand, competition dissipates the excess profits that attract fraudulent entrants; on the other, it compresses margins so far that honest firms, which bear real costs, can no longer break even, potentially leaving the market to low-cost fraudulent providers. The setting that makes this trade-off visible is Medicare's procurement of durable medical equipment, where a switch from administratively set prices to competitive bidding sharply cut reimbursement. The authors reason that because fraudulent suppliers enjoy an artificial cost advantage, since they need not actually deliver legitimate equipment, the price squeeze from competition should hit legitimate firms harder, causing them to exit while fraudulent firms gain share. They link supplier-level claims to fraud-enforcement records to classify firms and trace market shares and exit around the reform. The finding that fraudulent firms expanded as legitimate firms left implies that price competition, absent complementary screening or enforcement, can perversely concentrate a market in fraud rather than eliminate it, an important qualification to the standard case for competitive procurement.", "research_design": "An event-study / difference-in-differences design using Medicare's shift from administratively set prices to competitive bidding for durable medical equipment as the policy shock. Because the reform sharply cut reimbursement in affected product-areas and regions, the authors can compare how fraudulent and legitimate suppliers fared afterward. They classify suppliers by linking Medicare claims to fraud-enforcement records, then track market shares, entry, and exit for each group around the reform. The unit of analysis is the supplier (NPI); auction-bid data support the analysis of bidding.", "categories": ["Health Economics", "Industrial Organization & Procurement", "Fraud & Enforcement"], "shock": {"name": "Medicare competitive bidding for durable medical equipment", "type": "Policy reform", "what": "Medicare's staged replacement of administratively set DME reimbursement prices with competitive auctions, sharply lowering prices in affected product-areas and regions and acting as a shock to market competition."}, "missing_notes": null, "file_path": "", "datasets": ["Centers for Medicare & Medicaid Services (CMS) — Medicare DMEPOS claims", "DOJ / HHS-OIG — Fraud enforcement records", "Yunan Ji — Medicare DME auction bids"]}, {"std_name": "Working Paper - 2026 - Correia et al. - Bank Runs with and without Bank Failure", "journal": null, "year": 2026, "title": "Bank Runs with and without Bank Failure", "authors": ["Correia", "Luck", "Verner"], "summary": "This paper builds a comprehensive historical database of U.S. bank runs by applying large language models to historical newspapers, yielding information on 3,984 runs on individual banks from 1863 to 1934. The data show runs are far more likely at weak banks but also occur at strong banks, especially following negative news about the real economy or the broader banking system. Crucially, runs typically cause failure only when a bank's fundamentals are poor; strong banks survive through signaling, interbank cooperation, and temporary suspension. Locally, runs on weak banks produce much larger declines in deposits, lending, and manufacturing activity than runs on strong banks. The findings put poor fundamentals at the center of both when runs occur and when they are economically damaging, tempering pure self-fulfilling-panic accounts.", "logical_flow": "The paper's first contribution is measurement: to study bank runs systematically, the authors use large language models to read historical newspapers and assemble a large, bank-level database of runs spanning 1863-1934, far broader than hand-collected samples. Armed with this data, they ask whether runs strike indiscriminately, as pure panic models suggest, or track fundamentals. They find runs concentrate at weak banks but can also hit strong ones, especially after negative news about the real economy or the banking system, indicating an information-driven component. The central distinction they then draw is between a run and a failure, since a run threatens a bank but whether it causes failure depends on fundamentals. Strong banks survive runs through signaling their soundness, cooperation among banks, and temporary suspension of convertibility, whereas weak banks fail. The paper then links runs to the real economy, showing that runs on weak banks cause much larger local declines in deposits, lending, and manufacturing activity than runs on strong banks. Taken together, the evidence places poor fundamentals at the center of both when runs occur and when they do damage, tempering models in which small shocks trigger discontinuous jumps to bad equilibria and favoring accounts in which fundamentals discipline both the incidence and consequences of runs.", "research_design": "An empirical study built on a newly constructed dataset. Using large language models to read historical newspapers, the authors assemble information on 3,984 bank runs (1863-1934). They then relate the incidence of runs to bank fundamentals and to news about the economy and banking system, separate runs that caused failure from those that did not, and identify the mechanisms (signaling, interbank cooperation, suspension) that let strong banks survive. A local analysis compares deposits, lending, and manufacturing activity around runs on weak versus strong banks. The units of analysis are the bank and its local economy.", "categories": ["Banking History", "Financial Crises", "Text-as-Data / LLMs"], "shock": null, "missing_notes": null, "file_path": "", "datasets": ["Correia, Luck & Verner (this paper) — Historical bank-run database", "Library of Congress — Chronicling America", "OCC — National bank call reports (Annual Report to Congress)"]}, {"std_name": "Working Paper - 2026 - Bornstein and Castillo-Martinez - Firm Exit and Financial Frictions", "journal": null, "year": 2026, "title": "Firm Exit and Financial Frictions", "authors": ["Bornstein", "Castillo-Martinez"], "summary": "This paper examines whether financial frictions cause too many firms to fail, motivating government interventions that prevent closures during crises. The authors build a firm-dynamics model with incomplete financial markets and show that frictions generate excessive firm exit, with a key sufficient statistic being the marginal propensity to exit with debt. Using confidential U.S. Census data, they estimate the debt–exit relationship and use it to discipline the model. The calibrated model implies that eliminating financial frictions would cut firm exit from 9.3% to 5.0% and deliver welfare gains of 3.6% in consumption-equivalent terms, with costs that spike during financial crises but not during ordinary productivity recessions. Comparing government-guaranteed loans and grants, the paper quantifies the trade-off between fiscal cost and effectiveness in preventing excessive exit.", "logical_flow": "Policymakers routinely intervene to prevent firm closures during crises on the presumption that financial frictions push otherwise-viable firms out of business, but whether exit is actually inefficient is theoretically ambiguous, and the paper sets out to answer it. It builds a firm-dynamics model with incomplete financial markets in which frictions can distort the exit margin, and it identifies the marginal propensity to exit with respect to debt as the sufficient statistic that governs whether exit is excessive. The intuition is that if firms carrying more debt are disproportionately likely to exit, the frictions are inducing closures that would not occur in a frictionless world. To make this operational, the authors estimate the debt-exit relationship directly in confidential firm-level data and use it to discipline the model's key parameter. They then use the calibrated model to compute how much frictions inflate the exit rate and the associated welfare loss, and to show that this loss is state-dependent, spiking during financial crises but not during ordinary productivity recessions, precisely because crises tighten the financial channel. Finally, the paper compares policy instruments, government-guaranteed loans versus grants, evaluating each on the trade-off between fiscal cost and effectiveness at curbing excessive exit.", "research_design": "A quantitative firm-dynamics model with incomplete markets, disciplined by one reduced-form estimate. The theoretical contribution is to show that the marginal propensity to exit with respect to debt is a sufficient statistic for whether financial frictions make exit excessive. The authors estimate that debt-exit relationship in confidential Census microdata covering all employers, use it to pin down the model's key parameter, and then use the model to compute how much frictions inflate exit and reduce welfare, and how that cost differs between financial crises and ordinary recessions. Finally they compare guaranteed loans against grants as interventions.", "categories": ["Firm Dynamics", "Financial Frictions", "Macroeconomic Policy"], "shock": null, "missing_notes": null, "file_path": "", "datasets": ["U.S. Census Bureau — Longitudinal Business Database (LBD)", "Bureau van Dijk — Orbis (Italy)"]}, {"std_name": "Working Paper - 2026 - Malenko et al. - Fragmentation of Shareholder Power", "journal": null, "year": 2026, "title": "Fragmentation of Shareholder Power", "authors": ["Malenko", "Malenko", "Tsoy"], "summary": "This paper develops a theoretical framework to evaluate how the asset-management industry's shift toward tailored portfolios, fund proliferation, and decentralized stewardship affects corporate governance. Growing heterogeneity in investor preferences better aligns products with demand but can fragment ownership and weaken managerial oversight. The authors show fund proliferation does not necessarily weaken governance: stronger manager incentives and concentrated portfolios of specialized funds can offset fragmentation, especially when investor preferences are intense. However, intense preferences can also push asset managers to compete by granting investors control—decentralizing stewardship and adopting pass-through voting—without internalizing the resulting governance costs. The paper clarifies when investor-driven customization helps or harms oversight.", "logical_flow": "The asset-management industry has moved toward tailored portfolios, a proliferation of funds, and decentralized stewardship, and the paper asks whether these trends necessarily weaken the corporate oversight that concentrated ownership traditionally provides. It sets up the tension: greater heterogeneity in investor preferences improves the match between products and demand, but it can also fragment ownership and dilute any single manager's incentive to monitor. The authors build a model in which asset managers choose how concentrated their portfolios are, how much monitoring effort to exert, and how much control to pass through to their investors, all given the intensity of investor preferences. Analyzing it, they show that fund proliferation does not mechanically degrade governance, because stronger managerial incentives and the concentrated portfolios of specialized funds can offset fragmentation, and this offset is strongest when investor preferences are intense. However, the same intensity creates a countervailing force, since competition among managers on the 'control' dimension can lead them to hand voting power to investors even when doing so is socially costly, because each manager does not internalize the governance externality. The framework thus delineates conditions under which investor-driven customization helps versus harms oversight, rather than predicting a uniform decline.", "research_design": "A theoretical (mechanism-design) model, with no external data. Asset managers choose how concentrated their portfolios are, how much effort to put into monitoring firms, and how much voting control to hand to their investors, all as functions of how intense investor preferences are. The analysis derives comparative statics showing when fund proliferation is offset by stronger incentives and specialization (so governance holds up) and when competition on the 'control' margin leads managers to decentralize stewardship inefficiently. The key results characterize which force dominates as preference intensity varies.", "categories": ["Corporate Governance", "Asset Management", "Financial Theory"], "shock": null, "missing_notes": "Theoretical paper; no nonstandard datasets identified.", "file_path": "", "datasets": []}, {"std_name": "Working Paper - 2026 - Bardóczy et al. - Monopsony Power and the Transmission of Monetary Policy", "journal": null, "year": 2026, "title": "Monopsony Power and the Transmission of Monetary Policy", "authors": ["Bardóczy", "Bornstein", "Salgado"], "summary": "This paper studies how employer labor-market power changes the way monetary policy transmits to wages and employment. Using administrative U.S. Census data, the authors show that high-monopsony firms—those accounting for over 10 percent of their local wage bill—adjust their wage bill and employment less in response to monetary policy. They rationalize this with a New Keynesian model featuring heterogeneous firms and oligopsonistic labor competition, where wage stickiness combined with labor-market power drives the muted response. The model isolates two channels—partial passthrough and misallocation—through which oligopsony shapes aggregate effects. Calibrated to U.S. labor markets, it implies that the decline in labor-market power since the 1980s raised the output response to monetary policy by about 10 percent and accounts for roughly 15 percent of the flattening of the Phillips curve.", "logical_flow": "The paper starts from the observation that firms with labor-market (monopsony) power set wages strategically rather than taking them as given, so their response to monetary policy need not resemble that of competitive firms. It hypothesizes that when wages are sticky and a firm holds monopsony power, the firm absorbs monetary shocks differently, adjusting its wage bill and employment less, because its wage-setting margin interacts with nominal rigidity. Using administrative data, the authors first document exactly this, showing that high-monopsony firms, those accounting for a large share of their local labor market, react less to monetary-policy shocks. To interpret the fact and quantify aggregate implications, they build a heterogeneous-firm New Keynesian model with oligopsonistic labor markets in which the muted response emerges from the interaction of wage stickiness and market power. The model isolates two channels through which oligopsony shapes aggregate outcomes, incomplete passthrough of shocks to wages and misallocation of labor across firms. Calibrating it to U.S. labor markets lets the authors run counterfactuals, and they find that the secular decline in labor-market power since the 1980s made monetary policy more potent and accounts for a meaningful share of the flattening of the Phillips curve, linking a structural labor-market trend to the changing behavior of monetary policy.", "research_design": "A two-part design combining reduced-form estimates with a calibrated model. Empirically, the authors measure how individual firms' wage bills and employment respond to surprise (high-frequency identified) monetary-policy shocks, and compare firms with more versus less local labor-market power using confidential Census data. They then build and calibrate a heterogeneous-firm New Keynesian model with oligopsonistic labor markets in which the muted response of high-monopsony firms arises naturally, decomposing the aggregate effect into passthrough and misallocation channels. The calibrated model is used to ask how the decline in monopsony since the 1980s changed monetary transmission and the slope of the Phillips curve.", "categories": ["Monetary Policy", "Labor Market Power", "Macroeconomics"], "shock": {"name": "High-frequency identified monetary policy shocks", "type": "Monetary policy shock", "what": "The surprise component of monetary policy extracted from high-frequency movements in interest-rate futures around FOMC announcements, treated as exogenous shifts in the policy stance."}, "missing_notes": null, "file_path": "", "datasets": ["U.S. Census Bureau — LEHD merged with Longitudinal Business Database (LBD)"]}, {"std_name": "Working Paper - 2026 - Thesmar and Verner - Beliefs and Stock Market Fluctuations New Evidence from the Past Seven Decades", "journal": null, "year": 2026, "title": "Beliefs and Stock Market Fluctuations: New Evidence from the Past Seven Decades", "authors": ["Thesmar", "Verner"], "summary": "This paper builds a new seven-decade series of subjective expected equity returns (1956-2024) from an independent equity-analysis firm and uses it to reassess how beliefs move markets. Unlike the expectations of individual investors and professional forecasters, this measure is strongly positively correlated with the earnings-price ratio, responds negatively to past returns, and positively predicts future returns. Individual and professional-forecaster expectations are only weakly or negatively correlated with the new series, and disagreement between sophisticated and individual investors is associated with higher trading volume. The evidence fits a model of heterogeneous beliefs in which naive investors extrapolate past returns while sophisticated investors are close to rational. The paper offers a rare long-run window on the belief dynamics behind valuations.", "logical_flow": "Testing how beliefs move markets has been hampered by the lack of a long, consistent measure of what sophisticated investors expect returns to be, so the paper's first move is to construct one, hand-collected over nearly seven decades from an independent equity-analysis firm. With this new series in hand, it characterizes the properties any belief-based theory must confront: sophisticated expected returns co-move positively with the earnings-price ratio, respond negatively to recent past returns (they are mean-reverting), and positively predict future returns. It contrasts these with survey measures of individual investors and professional forecasters, which are only weakly or even negatively correlated with the new series, implying different groups hold systematically different beliefs. The paper then notes that disagreement between sophisticated and individual investors lines up with trading volume, consistent with heterogeneous beliefs generating trade. Because no single-agent, single-belief model can match this joint pattern, it argues for a framework with at least two types of investor. It then shows that a model in which naive investors extrapolate past returns while sophisticated investors are close to rational reproduces the co-movement with valuations, the mean reversion, the predictability, and the volume-disagreement link, providing a unified account of the belief dynamics behind valuations over seventy years.", "research_design": "Primarily a measurement and asset-pricing study. Its foundation is a new, hand-collected 1956-2024 series of sophisticated investors' expected returns. Using it, the authors run correlation and predictive regressions, linking expected returns to the earnings-price ratio, to past returns, and to realized future returns, and compare them with survey expectations of individuals and forecasters, while relating disagreement across groups to trading volume. A two-type model (extrapolative naive investors, near-rational sophisticated investors) is then shown to reproduce this whole set of facts. The unit of analysis is the market over time.", "categories": ["Behavioral Finance", "Asset Pricing", "Expectations & Beliefs"], "shock": null, "missing_notes": null, "file_path": "", "datasets": ["Value Line Investment Survey", "Robert Shiller — Investor Confidence Survey", "UBS/Gallup and Livingston Survey"]}, {"std_name": "Working Paper - 2026 - Ahern - Industrial Concentration, Property Values, and Municipal Bond Spreads", "journal": null, "year": 2026, "title": "Industrial Concentration, Property Values, and Municipal Bond Spreads", "authors": ["Ahern"], "summary": "This paper shows that the industrial composition of a city's economy shapes its cost of municipal borrowing. In a panel of 1,177 U.S. cities from 2005 to 2022, greater sectoral concentration raises default risk and municipal bond spreads, especially where dominant industries are associated with low property values. Instrumental variables built from national sector-employment trends and regional house-price variation support a causal reading. A calibrated city-default model implies the estimated spread effect understates the gross risk from concentration, because concentration also brings agglomeration benefits that lower spreads, particularly in high-property-value cities. The paper connects local economic structure to public finance and credit risk.", "logical_flow": "A city whose economy depends on only a few industries bears more concentrated economic risk, which the paper argues should raise the probability of fiscal distress and therefore the yields investors demand on its municipal bonds. The key refinement is that the sign and size of this effect should depend on what kind of industries dominate, because concentration in sectors associated with low property values is more dangerous when the property-tax base that backs municipal debt is weaker. The paper first documents the concentration-spread relationship in a large panel of cities and shows it is stronger where dominant industries imply low property values. Recognizing that industrial structure is not randomly assigned, it constructs instruments from national, city-external variation, namely industry-level employment trends interacted with regional house-price movements, to isolate plausibly exogenous changes in local concentration. It then confronts a subtlety: concentration is not purely bad, since agglomeration can raise productivity and property values and thereby lower spreads, so the reduced-form spread effect nets these opposing forces. To recover the gross risk, the authors calibrate a city-default model, which implies that the true risk contribution of concentration is larger than the estimated net spread effect, especially in high-property-value cities where agglomeration benefits offset it.", "research_design": "A panel regression of municipal bond spreads on city industrial concentration, made causal with an instrumental-variables (shift-share) strategy. Because a city's industry mix is not random, the authors instrument local concentration using national industry-employment trends interacted with the city's initial composition and regional house-price movements, isolating variation unlikely to be driven by the city's own fiscal shocks. The unit of analysis is the city-year, and interactions separate concentration in low- versus high-property-value industries. A calibrated city-default model then shows the gross risk from concentration exceeds the net spread effect once offsetting agglomeration benefits are accounted for.", "categories": ["Municipal Finance", "Credit Risk", "Urban & Regional Economics"], "shock": {"name": "Shift-share instrument for local industrial concentration", "type": "Instrument / quasi-exogenous variation", "what": "National industry-employment trends interacted with each city's initial industry mix and regional house prices, producing changes in local concentration that are plausibly unrelated to the city's own fiscal shocks."}, "missing_notes": null, "file_path": "", "datasets": ["MSRB — Municipal Securities Rulemaking Board trade data", "U.S. Census Bureau — LODES (LEHD Origin-Destination Employment Statistics)", "FHFA — House Price Index"]}, {"std_name": "Working Paper - 2026 - Clayton and Coppola - The Optimal Use of AI in Financial Regulation", "journal": null, "year": 2026, "title": "The Optimal Use of AI in Financial Regulation", "authors": ["Clayton", "Coppola"], "summary": "This paper asks whether modern AI methods applied to granular portfolio-holdings data can improve macroprudential regulation, and how policymakers should use such tools. The authors build a graph-based deep learning model over security-level holdings of financial intermediaries that embeds economic priors and learns latent representations of both assets and investors from the network of positions. Applied to the near-universe of non-bank financial intermediaries (about $40 trillion), the model forecasts intermediary trading far better than existing approaches, including during crises, and has more than ten times the explanatory power for cross-sectional stress-period returns. Its learned embeddings encode economically interpretable information about fire-sale vulnerability, and the architecture is inductive enough to produce estimates even for withheld asset classes or investors. The authors then embed the empirical model in a macroprudential optimal-policy framework, addressing the Lucas critique, to show why these objects matter for welfare.", "logical_flow": "The paper frames systemic-risk measurement as a prediction problem defined over the network of who holds which assets, arguing that the structure of intermediary holdings encodes fire-sale vulnerability that standard, low-dimensional risk metrics miss. It proposes that modern representation-learning methods can extract this information if they are constrained by economic priors rather than applied as black boxes. Concretely, the authors build a graph-based deep-learning model that learns latent embeddings of both assets and investors from the bipartite network of positions, so that assets held by similar investors, and investors holding similar assets, end up close in the learned space. They validate that these learned objects are economically meaningful by showing the model forecasts intermediary trading, including during crises, far better than existing approaches and explains an order of magnitude more of the cross-section of stress-period returns. Because the architecture is inductive, it can generate estimates even for asset classes or investors held out of training, which matters for a regulator facing new or incompletely observed exposures. The paper then asks the normative question of how a regulator should optimally use such predictions, embedding the empirical model inside a macroprudential optimal-policy framework designed to survive the Lucas critique so that the learned vulnerability measures inform welfare-improving policy rather than merely describing risk.", "research_design": "Two connected pieces. The empirical piece is a graph (network) neural network trained on security-level holdings of nearly all non-bank intermediaries; it learns compact representations of assets and investors from the web of who holds what, and is judged out-of-sample against existing risk metrics on two tasks, predicting intermediary trading and explaining returns during stress. The model's inductive design lets it score even assets or investors left out of training. The normative piece plugs these learned vulnerability measures into a macroprudential optimal-policy problem built to withstand the Lucas critique, showing how a regulator should use them.", "categories": ["Machine Learning in Finance", "Financial Regulation", "Systemic Risk"], "shock": null, "missing_notes": null, "file_path": "", "datasets": ["FactSet & Morningstar — Security-level intermediary holdings"]}, {"std_name": "Working Paper - 2026 - Ebsim et al. - Sophisticated Borrowing Constraints and Macroeconomic Dynamics", "journal": null, "year": 2026, "title": "Sophisticated Borrowing Constraints and Macroeconomic Dynamics", "authors": ["Ebsim", "Lian", "Ma", "Ottonello", "Perez"], "summary": "This paper argues that the way debt constraints are modeled fundamentally changes their macroeconomic implications. Traditional models impose hard borrowing limits that force firms to cut borrowing and investment whenever adverse shocks bind, producing financial acceleration. The authors instead model 'sophisticated borrowing constraints' resembling real-world financial covenants, where breaching an earnings-based debt threshold transfers control rights to creditors who then act to maximize their own value rather than mechanically shrinking credit. Calibrated to micro evidence on investment and earnings around covenant violations, the model matches firm-level dynamics while, at the macro level, generating no financial acceleration because violations do not trigger indiscriminate downscaling. The result challenges a workhorse mechanism linking credit conditions to aggregate fluctuations.", "logical_flow": "Standard macro models impose 'hard' borrowing limits under which any binding constraint mechanically forces firms to cut debt and investment, generating financial acceleration that amplifies aggregate shocks. The paper's central claim is that this modeling choice, rather than the existence of debt limits per se, drives the acceleration result. In reality, debt contracts are governed by financial covenants, so breaching an earnings-based threshold does not force proportional deleveraging but instead transfers control rights to creditors, who then choose firm policies to maximize their own claim value. The authors formalize this as a 'sophisticated' constraint in which the consequence of a violation is a state-contingent reallocation of control, not a fixed borrowing rule. They show first that such a model reproduces the microeconomic facts, matching how investment and earnings actually behave around covenant violations, so the mechanism is disciplined by observed firm behavior. They then embed it in general equilibrium and show that, because violations do not trigger indiscriminate, simultaneous downscaling across firms, the economy exhibits little or no financial acceleration. The upshot is that a more institutionally realistic constraint overturns a workhorse channel linking credit conditions to business cycles, implying that credit frictions may transmit very differently than standard models assume.", "research_design": "A quantitative macro-finance model, distinguished by how it treats debt limits. Instead of a hard cap that forces proportional deleveraging when it binds, a covenant violation transfers control to creditors, who then choose the firm's policies. The model is first disciplined at the micro level by matching the observed behavior of investment and earnings around covenant violations, then solved in general equilibrium to ask whether it produces financial acceleration. Identification of the mechanism comes from comparing this covenant-style constraint against the standard hard-constraint benchmark while holding the rest of the model fixed.", "categories": ["Macro-Finance", "Corporate Debt & Covenants", "Firm Investment"], "shock": null, "missing_notes": null, "file_path": "", "datasets": ["Refinitiv LPC — DealScan", "Greg Nini (Nini, Smith & Sufi) — Financial covenant violation data"]}, {"std_name": "Working Paper - 2026 - Dou et al. - The Cost of Intermediary Market Power for Distressed Borrowers", "journal": null, "year": 2026, "title": "The Cost of Intermediary Market Power for Distressed Borrowers", "authors": ["Dou", "Wang", "Wang"], "summary": "This paper measures how much lender market power raises borrowing costs for firms in financial distress, who must raise urgent financing in thin, concentrated credit markets. The authors show that distressed borrowers pay very high loan spreads even after stripping out compensation for credit risk, liquidity risk, and ordinary loan-making costs. To decompose the residual, they build and estimate a dynamic game-theoretic model of distressed lending featuring latent demand heterogeneity, endogenous lender participation, creditor blocking power, and tacit collusion sustained by repeated syndication. Lender market power explains 533 basis points of risk-adjusted spreads in debtor-in-possession (DIP) loans and 300 basis points in highly speculative loans, with roughly 140 basis points from tacit collusion in each. Because this markup reduces survival-critical liquidity by 16–20%, market power emerges as a major, previously underappreciated source of financial-distress costs.", "logical_flow": "Distressed firms must raise financing quickly and in markets served by only a handful of specialized lenders, often from existing creditors who hold contractual blocking power, so the high spreads these borrowers pay may reflect lender market power rather than compensation for risk. The paper first establishes the puzzle empirically, showing that even after removing compensation for credit risk, liquidity risk, and ordinary loan-making costs, debtor-in-possession and highly speculative loans still carry very large spreads. To interpret this residual, the authors build a dynamic game-theoretic model of distressed lending whose ingredients are latent heterogeneity in borrower demand, endogenous lender participation, the blocking power incumbent creditors wield in bankruptcy, and tacit collusion sustained by lenders' repeated interaction in syndication. The model makes the markup identifiable and, importantly, decomposable into a piece from unilateral market power and a piece from collusion. Estimating it lets the authors quantify how much of the spread is a pure markup, and then translate that markup into a real cost, because the markup drains cash from firms that need liquidity to survive and so maps into a measurable reduction in survival-critical funds. The argument thus moves from an unexplained pricing fact, to a structural mechanism, to a welfare-relevant consequence, reframing lender market power as a first-order and previously under-appreciated cost of financial distress.", "research_design": "A structural estimation of a dynamic game of distressed lending. The authors first show, in a reduced-form step, that DIP and highly speculative loan spreads stay large even after subtracting compensation for credit risk, liquidity, and normal lending costs, leaving an unexplained residual. They then build a model in which a few lenders decide whether to lend, exploit the blocking power incumbent creditors hold in bankruptcy, and sustain tacit collusion through repeated syndication; fitting it to loan-level data lets them split the residual spread into unilateral-market-power and collusion components. The estimated model is finally used to express the markup as the reduction in liquidity it imposes on distressed borrowers. The unit of observation is the loan facility.", "categories": ["Financial Distress & Bankruptcy", "Banking & Lending", "Market Power / Industrial Organization"], "shock": null, "missing_notes": null, "file_path": "", "datasets": ["Refinitiv LPC — DealScan", "LPC (Refinitiv) — LSTA/LPC Mark-to-Market Pricing Data", "PACER — Public Access to Court Electronic Records", "Moody's — Default and Recovery Database"]}, {"std_name": "Working Paper - 2026 - He et al. - Homemade Foreign Trading", "journal": null, "year": 2026, "title": "Homemade Foreign Trading", "authors": ["He", "Wang", "Zhu"], "summary": "This paper documents how Chinese mainland insiders disguise domestic trades as foreign investment by round-tripping capital through the Stock Connect program, a practice the authors term 'homemade foreign trading.' Using cross-border holding data from all custodians in Stock Connect, they show that northbound flows predict returns and correlate with insider trading, but that this predictability decays after the 2018 Northbound Investor Identification reform introduced see-through surveillance. The decay is concentrated among less prestigious foreign custodians and cross-operating mainland custodians, precisely where insiders can most easily hide. The reform also reduces price informativeness in stocks most exposed to homemade foreign investors. The paper highlights regulatory cooperation as a key ingredient for the integrity of cross-border capital market integration.", "logical_flow": "Stock Connect lets mainland Chinese capital leave the country and return disguised as 'northbound' foreign investment, which opens a channel for informed mainland insiders to trade on private information while appearing to be offshore investors. The paper reasons that if such round-tripping is quantitatively important, aggregate northbound flows should predict future returns and should co-move with measured insider trading, because the disguised insiders are the ones driving the flow. It then argues that a reform giving regulators the ability to see through to the ultimate investor should break this link: once insiders can be identified, the informational rent they extract through the channel should shrink. The authors therefore treat the 2018 Northbound Investor Identification reform as a shock to surveillance and predict a decline in the return-predictability of northbound flows afterward. Crucially, they sharpen identification with cross-sectional heterogeneity in how easy it is to hide, since the effect should concentrate at less prestigious foreign custodians and at 'cross-operating' mainland custodians, precisely where disguising a domestic trade is cheapest. Because informed trading also contributes to price discovery, the paper predicts that removing the disguised-insider channel should reduce price informativeness for the most exposed stocks, tying the micro mechanism to an aggregate market-quality outcome.", "research_design": "A difference-in-differences design built around the 2018 Northbound Investor Identification reform, treated as a natural experiment. The test is intuitive: if disguised insiders drive northbound flows, those flows should predict stock returns before the reform and predict them less once regulators can see who is trading. Using custodian-level flow data, the authors estimate how strongly northbound flows forecast returns and check whether that predictive power falls after the reform, concentrating the comparison on custodians where hiding was easiest. A complementary test asks whether prices became less informative for the most exposed stocks. The unit of analysis is the stock over time.", "categories": ["International Finance", "Insider Trading", "Market Microstructure"], "shock": {"name": "2018 Northbound Investor Identification reform", "type": "Regulatory reform (surveillance)", "what": "A change to China's Stock Connect requiring a unique investor ID on each northbound order, giving regulators see-through visibility of who is trading and stripping mainland insiders of the ability to disguise domestic trades as foreign investment."}, "missing_notes": null, "file_path": "", "datasets": ["China Securities Depository and Clearing (CSDC) / Stock Connect", "CSMAR — China Stock Market & Accounting Research", "WIND"]}, {"std_name": "American Economic Review - 2025 - Lerche - Direct and Indirect Effects of Investment Tax Incentives", "journal": "American Economic Review", "year": 2025, "title": "Direct and Indirect Effects of Investment Tax Incentives", "authors": ["Lerche"], "summary": "The paper estimates both the direct effects and the local spillover effects of investment tax credits on firms, using a German policy that changed the tax-credit rate differently by firm size. Lerche finds that lowering a firm's investment cost by 7.6 percent raises its capital stock by 17.7 percent and employment by 12.0 percent. Positive local spillovers create roughly one additional manufacturing job for each directly created job; they are strongest between firms linked through input-output relationships and operate within about five kilometers. Firms reliant on local consumer demand also expand employment, while within-industry spillovers are slightly negative. The paper shows that general-equilibrium spillovers substantially amplify the direct effects of investment tax incentives.", "logical_flow": "The paper begins from the long-standing use of investment tax credits to lower the cost of capital and recent firm-level evidence that they raise investment, while stressing that general-equilibrium spillovers determine how firm-level effects translate into aggregate outcomes—agglomeration and local-demand forces may amplify them, while fixed labor supply and product-market competition may offset them through reallocation. To estimate both direct and indirect effects, Lerche exploits an investment tax credit introduced after German reunification whose rate fell more for small firms, creating a differential change in the user cost of capital by firm size. Using administrative matched employer-employee data and firm addresses, he first estimates direct (partial-equilibrium) effects with a difference-in-differences design comparing firms just below and above the 250-employee cutoff (excluding those right at the cutoff). He finds large direct increases in capital and employment. He then combines this with a second difference-in-differences design based on the local (county) exposure to the policy—excluding a firm's own employment—to identify local spillovers. He finds positive local spillovers of about one extra manufacturing job per directly created job, strongest among input-output-linked industries and within five kilometers, plus positive local-demand effects and small negative within-industry spillovers. The paper concludes that investment tax incentives have sizable direct effects that are meaningfully amplified by local general-equilibrium spillovers.", "research_design": "A quasi-experimental study exploiting a post-reunification German investment tax credit whose rate changed differentially by firm size (around a 250-employee cutoff), using administrative matched employer-employee data with firm addresses. Direct effects are estimated with a difference-in-differences design comparing firms below and above the size cutoff; local spillovers are identified by combining this with a second difference-in-differences design based on county-level policy exposure (excluding a firm's own employment). Identification comes from the size-differential rate change and local exposure.", "categories": ["Public Economics", "Labor Economics", "Regional & Urban Economics"], "shock": {"name": "Post-reunification German investment tax credit (size-differential rate change)", "type": "policy natural experiment (difference-in-differences)", "what": "An investment tax credit whose rate changed more for small firms (around a 250-employee cutoff), providing differential variation in the user cost of capital used to identify direct and local spillover effects."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/American Economic Review - 2025 - Lerche - Direct and Indirect Effects of Investment Tax Incentives.pdf", "datasets": ["Institute for Employment Research (IAB, Germany) — administrative matched employer-employee data"]}, {"std_name": "Working Paper - 2025 - Cabral and Dillender - Doctor Discretion in Medical Evaluations", "journal": null, "year": 2025, "title": "Doctor Discretion in Medical Evaluations", "authors": ["Cabral", "Dillender"], "summary": "This paper analyzes how the discretion of doctors conducting independent medical exams affects injured workers' outcomes. Exploiting the quasi-random assignment of claimants to more- or less-generous independent examiners, the authors trace downstream outcomes over three years—duration out of work, cash disability benefits, and subsequent medical care. Reduced-form estimates show that claimants assigned a more generous examiner experience longer durations out of work and receive more benefits and care. The results reveal that examiner discretion has large, persistent effects on disability outcomes. The paper documents the consequences of doctor discretion in a high-stakes evaluation setting.", "logical_flow": "The paper studies independent medical exams, where a doctor's assessment shapes an injured worker's eligibility for disability benefits, and asks how much the specific examiner matters. It exploits the fact that claimants are effectively randomly assigned to examiners who differ in generosity, creating an examiner-leniency design. Because assignment is quasi-random, differences in outcomes across examiners of different generosity can be attributed to the examiner rather than the claimant. The authors follow claimants for three years, measuring duration out of work, cash benefits, and medical care. They find that being assigned a more generous examiner leads to longer time out of work and more benefits and care, though these also depend on later actions by claimants, insurers, and treating doctors. The paper concludes that doctor discretion in evaluations has substantial and lasting effects on disability outcomes.", "research_design": "An examiner-assignment (leniency) design exploiting the quasi-random assignment of injured workers to independent medical examiners who differ in generosity, using administrative data. Reduced-form estimates relate assigned-examiner generosity to downstream outcomes—duration out of work, cash disability benefits, and subsequent medical care—over three years. The unit of analysis is the claimant; identification comes from quasi-random examiner assignment.", "categories": ["Health Economics", "Disability Insurance", "Public Economics"], "shock": {"name": "Quasi-random assignment of independent medical examiners", "type": "Examiner-leniency (random assignment)", "what": "The quasi-random assignment of injured workers to more- or less-generous independent medical examiners, used as an examiner-leniency design to identify the effect of medical evaluations on disability outcomes."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Working Paper - 2025 - Cabral and Dillender - Doctor Discretion in Medical Evaluations.pdf", "datasets": ["Administrative workers' compensation / disability claims"]}, {"std_name": "Econometrica - 2023 - Eeckhout and Veldkamp - Data and Markups A Macro-Finance Perspective", "journal": "Econometrica", "year": 2023, "title": "Data and Markups: A Macro-Finance Perspective", "authors": ["Eeckhout", "Veldkamp"], "summary": "The paper asks how to measure the extent to which data-intensive firms use market power, and argues that markups—the usual proxy—can be misleading. Building a model in which firms price risk in their capital-allocation and production decisions, the authors show data has competing effects on markups, so markups are an unreliable measure of data-derived market power. Instead, they show that comparing markups measured at different levels of aggregation (product, firm, industry) reveals the role of data and distinguishes data from other intangibles. This reconciles seemingly contradictory empirical markup findings across aggregation levels. The paper offers a new way to measure data and its effects on competition.", "logical_flow": "The paper enters the debate over rising market power and whether the dominance of large, data-intensive firms reflects economies of scale in information that reduce competition. It asks how to measure such data-derived market power and questions the standard reliance on markups. The authors build a model drawing on macro theory (data as information that reduces uncertainty), corporate finance (firms price risk), and industrial organization (firms exploit market power), in which economies of scale in data lead a data-rich firm to lower its marginal cost and capture more market share. Working through the model, they show data exerts competing effects on markups, and that the net effect depends on the level of aggregation at which markups are measured, so a single markup number is an unreliable gauge of data-driven power. Crucially, they show the difference between markups measured at the firm versus product level acts as a sufficient statistic for the amount of relevant data. They demonstrate that this framework reconciles existing empirical findings that product-, firm-, and industry-level markups behave differently over the cycle and trend. The paper concludes that examining how markups differ across aggregation levels is the right way to detect and measure the effects of data on markets.", "research_design": "A theoretical macro-finance model in which firms price risk in capital-allocation and production decisions and economies of scale in data lower marginal cost and raise market share. The analysis derives how data affects markups differently across levels of aggregation (product, firm, industry) and shows the firm-versus-product markup gap is a sufficient statistic for data, reconciling existing empirical markup evidence. It is analytical, using existing empirical facts for validation rather than estimating a new dataset.", "categories": ["Macroeconomics", "Industrial Organization", "Expectations & Information"], "shock": null, "missing_notes": "Theoretical paper; no dataset. It reconciles existing empirical markup evidence (product/firm/industry level) rather than analyzing an original dataset. The supplied PDF is the February 2023 manuscript version of the article published in Econometrica (2023).", "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Econometrica - 2023 - Eeckhout and Veldkamp - Data and Markups A Macro-Finance Perspective.pdf", "datasets": []}, {"std_name": "American Law and Economics Review - 2023 - Ohlrogge - Down the Tubes Financial Distress, Bankruptcy, and Industrial Water Pollution", "journal": "American Law and Economics Review", "year": 2023, "title": "Down the Tubes: Financial Distress, Bankruptcy, and Industrial Water Pollution", "authors": ["Ohlrogge"], "summary": "The paper examines how firms' efforts to avoid harming third parties change as they approach, enter, and exit bankruptcy, focusing on industrial water pollution. Studying about 350 US firms regulated under the Clean Water Act that declared bankruptcy, Ohlrogge finds that as firms approach bankruptcy their rate of releasing pollutants beyond permitted limits rises by 50 percent. Once they file, compliance improves dramatically, returning to a baseline from well before filing. He argues the pattern is best explained by a mix of moral-hazard problems and financing frictions affecting thinly capitalized firms. The findings support policy interventions such as changes to bankruptcy claim priority and suggest an underappreciated public benefit of encouraging firms to file early.", "logical_flow": "The paper starts from the recognized idea that financial distress distorts firm behavior—underinvestment from debt overhang and shareholder-creditor conflicts—and asks how distress and bankruptcy affect a firm's efforts to avoid harming third parties, here through water pollution. It assembles a panel of roughly 350 US firms regulated under the Clean Water Act (via NPDES permits) that all eventually declare bankruptcy, and studies their permitted-limit exceedances over time. Using a difference-in-differences-style comparison to similar facilities owned by non-bankrupt firms, Ohlrogge finds that as firms approach bankruptcy their rate of exceeding pollution limits rises by about 50 percent, and that after filing, compliance improves sharply back to a pre-distress baseline. He explores mechanisms and argues the pattern reflects a nexus of moral hazard (thinly capitalized firms have weak incentives to invest in compliance when liabilities can be discharged) and financing frictions that ease once bankruptcy resolves distress; he notes the bankruptcy code's higher administrative priority for post-filing environmental penalties as relevant. He draws policy implications, including changing claim priority to mitigate moral hazard and encouraging early filing. The paper concludes that bankruptcy can reduce public harms from distressed firms, implying benefits to policies that promote timely resolution of distress.", "research_design": "An empirical panel study of about 350 US Clean Water Act (NPDES)-regulated firms that declare bankruptcy, using discharge-monitoring data on permitted-limit exceedances over time. A difference-in-differences-style design compares bankrupt firms' compliance around approach, filing, and exit to similar facilities owned by non-bankrupt firms. Identification comes from the timing of financial distress and bankruptcy filing relative to comparison facilities.", "categories": ["Law & Economics", "Corporate Finance", "Environmental Economics"], "shock": {"name": "Corporate bankruptcy filing", "type": "event study / difference-in-differences", "what": "The approach to, filing of, and exit from bankruptcy by CWA-regulated firms, whose timing is used to identify changes in pollution compliance relative to non-bankrupt comparison facilities."}, "missing_notes": null, "file_path": "/home/run
