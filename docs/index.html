<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Chest</title>
<style>
  :root{
    --paper:#FBFAF7; --ink:#1b1a17; --muted:#6f6a60; --line:#e4ded2;
    --card:#ffffff; --accent:#2f5d50; --accent-soft:#e7efe9; --amber:#9a6a1c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:Georgia,"Iowan Old Style",serif;line-height:1.5}
  .wrap{max-width:1060px;margin:0 auto;padding:28px 22px 80px}
  header{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:6px}
  h1{font-size:30px;margin:0;letter-spacing:.3px}
  .sub{font:12px/1.4 ui-monospace,"SFMono-Regular",Menlo,monospace;
    color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin-top:6px}
  .tabs{display:flex;gap:6px;margin:18px 0 14px}
  .tab{font:12px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;
    padding:9px 14px;border:1px solid var(--line);background:var(--card);cursor:pointer;
    color:var(--muted);border-radius:2px}
  .tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  input[type=search],select{font:15px Georgia,serif;padding:9px 11px;border:1px solid var(--line);
    background:var(--card);border-radius:2px;color:var(--ink)}
  input[type=search]{flex:1;min-width:220px}
  input[type=search]:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .count{font:12px ui-monospace,Menlo,monospace;color:var(--muted);letter-spacing:.06em}
  .card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:3px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .callno{font:11px/1.5 ui-monospace,Menlo,monospace;color:var(--accent);letter-spacing:.04em;
    text-transform:uppercase;margin-bottom:6px;word-break:break-word}
  .ptitle{font-size:19px;font-weight:700;margin:0 0 4px;cursor:pointer}
  .ptitle:hover{color:var(--accent)}
  .meta{font:12px ui-monospace,Menlo,monospace;color:var(--muted);margin-bottom:8px}
  .cats{margin:8px 0 2px}
  .chip{display:inline-block;font:11px ui-monospace,Menlo,monospace;background:var(--accent-soft);
    color:var(--accent);padding:2px 8px;border-radius:20px;margin:0 6px 6px 0;letter-spacing:.03em}
  .chip.data{background:#f3ecdd;color:var(--amber)}
  .field{margin:10px 0}
  .flabel{font:11px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.12em;
    color:var(--muted);margin-bottom:2px}
  details>summary{cursor:pointer;font:12px ui-monospace,Menlo,monospace;color:var(--accent);
    letter-spacing:.06em;list-style:none;margin-top:4px}
  details>summary::-webkit-details-marker{display:none}
  details[open]>summary{margin-bottom:8px}
  .path{font:11px ui-monospace,Menlo,monospace;color:var(--muted);word-break:break-all;margin-top:8px}
  .path a{color:var(--accent)}
  .note{font-style:italic;color:var(--amber);font-size:13px}
  .empty{color:var(--muted);text-align:center;padding:40px;font-style:italic}
  .ds .used{font:12px Georgia,serif;color:var(--muted);margin-top:6px}
  footer{margin-top:34px;border-top:1px solid var(--line);padding-top:12px;
    font:11px ui-monospace,Menlo,monospace;color:var(--muted);letter-spacing:.05em}
  @media (max-width:560px){h1{font-size:24px}}
</style></head>

<script>
const DB = {"papers": [{"std_name": "Working Paper - 2026 - Correia et al. - Bank Runs with and without Bank Failure", "journal": null, "year": 2026, "title": "Bank Runs with and without Bank Failure", "authors": ["Correia", "Luck", "Verner"], "summary": "This paper builds a comprehensive historical database of U.S. bank runs by applying large language models to historical newspapers, yielding information on 3,984 runs on individual banks from 1863 to 1934. The data show runs are far more likely at weak banks but also occur at strong banks, especially following negative news about the real economy or the broader banking system. Crucially, runs typically cause failure only when a bank's fundamentals are poor; strong banks survive through signaling, interbank cooperation, and temporary suspension. Locally, runs on weak banks produce much larger declines in deposits, lending, and manufacturing activity than runs on strong banks. The findings put poor fundamentals at the center of both when runs occur and when they are economically damaging, tempering pure self-fulfilling-panic accounts.", "logical_flow": "The paper's first contribution is measurement: it uses LLMs to read historical newspapers and assemble a large, bank-level database of runs spanning 1863-1934. With this data, it asks whether runs strike indiscriminately or track fundamentals, showing runs concentrate in weak banks yet can hit strong banks after adverse news. It then distinguishes runs from failures, documenting that strong banks survive runs via signaling, cooperation, and suspension, so that failure requires poor fundamentals. Finally it links runs to local real outcomes, showing damage is concentrated where fundamentals are weak, which it interprets as evidence against models where small shocks trigger discontinuous jumps to bad equilibria.", "research_design": "Construction of a novel bank-level historical dataset via large language models applied to newspaper archives, combined with empirical analysis relating runs to bank fundamentals, survival mechanisms, and local real-economy outcomes.", "categories": ["Banking History", "Financial Crises", "Text-as-Data / LLMs"], "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Working Paper - 2026 - Correia et al. - Bank Runs with and without Bank Failure.pdf", "datasets": ["Correia, Luck & Verner (this paper) — Historical bank-run database", "Library of Congress — Chronicling America", "OCC — National bank call reports (Annual Report to Congress)"]}, {"std_name": "Working Paper - 2026 - Bornstein and Castillo-Martinez - Firm Exit and Financial Frictions", "journal": null, "year": 2026, "title": "Firm Exit and Financial Frictions", "authors": ["Bornstein", "Castillo-Martinez"], "summary": "This paper examines whether financial frictions cause too many firms to fail, motivating government interventions that prevent closures during crises. The authors build a firm-dynamics model with incomplete financial markets and show that frictions generate excessive firm exit, with a key sufficient statistic being the marginal propensity to exit with debt. Using confidential U.S. Census data, they estimate the debt–exit relationship and use it to discipline the model. The calibrated model implies that eliminating financial frictions would cut firm exit from 9.3% to 5.0% and deliver welfare gains of 3.6% in consumption-equivalent terms, with costs that spike during financial crises but not during ordinary productivity recessions. Comparing government-guaranteed loans and grants, the paper quantifies the trade-off between fiscal cost and effectiveness in preventing excessive exit.", "logical_flow": "The paper starts from the policy fear that viable-but-constrained firms fail in crises, and asks when firm exit is actually inefficient. It develops a firm-dynamics model with incomplete markets in which financial frictions distort the exit margin, isolating the marginal propensity to exit with debt as the statistic governing dynamic inefficiency. It then estimates the debt–exit relationship in confidential Census data to discipline that statistic and calibrate the model. Using the calibrated model, it quantifies the welfare cost of frictions across crisis and non-crisis states and evaluates guaranteed loans versus grants as interventions.", "research_design": "A quantitative firm-dynamics model with incomplete financial markets, disciplined by a reduced-form debt–exit relationship estimated on confidential U.S. Census microdata, used for welfare analysis and policy (loan-guarantee vs. grant) comparison.", "categories": ["Firm Dynamics", "Financial Frictions", "Macroeconomic Policy"], "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Working Paper - 2026 - Bornstein and Castillo-Martinez - Firm Exit and Financial Frictions.pdf", "datasets": ["U.S. Census Bureau — Longitudinal Business Database (LBD)", "Bureau van Dijk — Orbis (Italy)"]}, {"std_name": "Working Paper - 2026 - Malenko et al. - Fragmentation of Shareholder Power", "journal": null, "year": 2026, "title": "Fragmentation of Shareholder Power", "authors": ["Malenko", "Malenko", "Tsoy"], "summary": "This paper develops a theoretical framework to evaluate how the asset-management industry's shift toward tailored portfolios, fund proliferation, and decentralized stewardship affects corporate governance. Growing heterogeneity in investor preferences better aligns products with demand but can fragment ownership and weaken managerial oversight. The authors show fund proliferation does not necessarily weaken governance: stronger manager incentives and concentrated portfolios of specialized funds can offset fragmentation, especially when investor preferences are intense. However, intense preferences can also push asset managers to compete by granting investors control—decentralizing stewardship and adopting pass-through voting—without internalizing the resulting governance costs. The paper clarifies when investor-driven customization helps or harms oversight.", "logical_flow": "The paper begins from real industry trends—customization, more funds, and decentralized voting—and asks whether they necessarily erode the monitoring that concentrated ownership provides. It builds a model in which asset managers choose portfolio concentration, effort, and how much control to pass through to investors, given heterogeneous investor preferences. Analyzing the model, it shows proliferation can coexist with strong governance when incentives and specialization are strong, particularly under intense preferences. It then identifies a countervailing force: competition on the 'control' margin can lead managers to decentralize stewardship inefficiently, because they do not bear the full governance cost.", "research_design": "Theoretical model (mechanism/contracting framework) of asset-manager portfolio choice, incentives, and stewardship decentralization under heterogeneous investor preferences; no external dataset.", "categories": ["Corporate Governance", "Asset Management", "Financial Theory"], "missing_notes": "Theoretical paper; no nonstandard datasets identified.", "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Working Paper - 2026 - Malenko et al. - Fragmentation of Shareholder Power.pdf", "datasets": []}, {"std_name": "Working Paper - 2026 - Bardóczy et al. - Monopsony Power and the Transmission of Monetary Policy", "journal": null, "year": 2026, "title": "Monopsony Power and the Transmission of Monetary Policy", "authors": ["Bardóczy", "Bornstein", "Salgado"], "summary": "This paper studies how employer labor-market power changes the way monetary policy transmits to wages and employment. Using administrative U.S. Census data, the authors show that high-monopsony firms—those accounting for over 10 percent of their local wage bill—adjust their wage bill and employment less in response to monetary policy. They rationalize this with a New Keynesian model featuring heterogeneous firms and oligopsonistic labor competition, where wage stickiness combined with labor-market power drives the muted response. The model isolates two channels—partial passthrough and misallocation—through which oligopsony shapes aggregate effects. Calibrated to U.S. labor markets, it implies that the decline in labor-market power since the 1980s raised the output response to monetary policy by about 10 percent and accounts for roughly 15 percent of the flattening of the Phillips curve.", "logical_flow": "The paper posits that firms with labor-market power set wages strategically, so their response to monetary policy may differ systematically from competitive firms. Using administrative data, it establishes that high-monopsony firms adjust wage bill and employment less after monetary shocks. To interpret this, it builds a heterogeneous-firm New Keynesian model with oligopsony in which wage stickiness and market power jointly generate the muted response. The model formalizes partial passthrough and misallocation channels, and its calibration links the secular decline in monopsony to changes in the potency of monetary policy and the slope of the Phillips curve.", "research_design": "Empirical estimation of firm-level monetary-policy responses by monopsony intensity using administrative Census data, combined with a calibrated heterogeneous-firm New Keynesian model with oligopsonistic labor markets.", "categories": ["Monetary Policy", "Labor Market Power", "Macroeconomics"], "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Working Paper - 2026 - Bardóczy et al. - Monopsony Power and the Transmission of Monetary Policy.pdf", "datasets": ["U.S. Census Bureau — LEHD merged with Longitudinal Business Database (LBD)"]}, {"std_name": "Working Paper - 2026 - Thesmar and Verner - Beliefs and Stock Market Fluctuations New Evidence from the Past Seven Decades", "journal": null, "year": 2026, "title": "Beliefs and Stock Market Fluctuations: New Evidence from the Past Seven Decades", "authors": ["Thesmar", "Verner"], "summary": "This paper builds a new seven-decade series of subjective expected equity returns (1956-2024) from an independent equity-analysis firm and uses it to reassess how beliefs move markets. Unlike the expectations of individual investors and professional forecasters, this measure is strongly positively correlated with the earnings-price ratio, responds negatively to past returns, and positively predicts future returns. Individual and professional-forecaster expectations are only weakly or negatively correlated with the new series, and disagreement between sophisticated and individual investors is associated with higher trading volume. The evidence fits a model of heterogeneous beliefs in which naive investors extrapolate past returns while sophisticated investors are close to rational. The paper offers a rare long-run window on the belief dynamics behind valuations.", "logical_flow": "The paper motivates the need for a long, consistent measure of sophisticated investors' return expectations, which it constructs by hand from decades of an independent equity-analysis firm's forecasts. It characterizes the new series' properties—co-movement with the earnings-price ratio, mean-reverting response to past returns, and predictive power for future returns—and contrasts them with survey measures of individuals and forecasters. Finding that sophisticated and naive expectations diverge, and that their disagreement tracks trading volume, it argues a single-belief model cannot fit the facts. It then shows a heterogeneous-beliefs model, with extrapolative naive investors and near-rational sophisticated investors, rationalizes the joint patterns.", "research_design": "Construction and analysis of a novel long-run (1956-2024) subjective-expected-return series hand-collected from an independent equity-analysis firm, with predictive and correlation regressions against survey expectations and a heterogeneous-beliefs asset-pricing model.", "categories": ["Behavioral Finance", "Asset Pricing", "Expectations & Beliefs"], "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Working Paper - 2026 - Thesmar and Verner - Beliefs and Stock Market Fluctuations New Evidence from the Past Seven Decades.pdf", "datasets": ["Value Line Investment Survey", "Robert Shiller — Investor Confidence Survey", "UBS/Gallup and Livingston Survey"]}, {"std_name": "Working Paper - 2026 - Ahern - Industrial Concentration, Property Values, and Municipal Bond Spreads", "journal": null, "year": 2026, "title": "Industrial Concentration, Property Values, and Municipal Bond Spreads", "authors": ["Ahern"], "summary": "This paper shows that the industrial composition of a city's economy shapes its cost of municipal borrowing. In a panel of 1,177 U.S. cities from 2005 to 2022, greater sectoral concentration raises default risk and municipal bond spreads, especially where dominant industries are associated with low property values. Instrumental variables built from national sector-employment trends and regional house-price variation support a causal reading. A calibrated city-default model implies the estimated spread effect understates the gross risk from concentration, because concentration also brings agglomeration benefits that lower spreads, particularly in high-property-value cities. The paper connects local economic structure to public finance and credit risk.", "logical_flow": "The paper reasons that a city dependent on few industries faces more concentrated economic risk, which should raise default probability and hence bond spreads, but that the effect may depend on whether those industries support high property values that anchor the tax base. It documents the concentration–spread relationship in a large city panel and shows it is stronger where dominant sectors imply low property values. To move from correlation to causation, it instruments concentration using national sector-employment trends interacted with regional house-price variation. Finally, a calibrated default model reconciles the estimates with offsetting agglomeration benefits, implying the gross risk effect is larger than the net spread effect suggests.", "research_design": "Panel regressions with an instrumental-variables strategy (national sector-employment trends and regional house-price variation) linking industrial concentration to municipal bond spreads, complemented by a calibrated structural model of city default.", "categories": ["Municipal Finance", "Credit Risk", "Urban & Regional Economics"], "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Working Paper - 2026 - Ahern - Industrial Concentration, Property Values, and Municipal Bond Spreads.pdf", "datasets": ["MSRB — Municipal Securities Rulemaking Board trade data", "U.S. Census Bureau — LODES (LEHD Origin-Destination Employment Statistics)", "FHFA — House Price Index"]}, {"std_name": "Working Paper - 2026 - Clayton and Coppola - The Optimal Use of AI in Financial Regulation", "journal": null, "year": 2026, "title": "The Optimal Use of AI in Financial Regulation", "authors": ["Clayton", "Coppola"], "summary": "This paper asks whether modern AI methods applied to granular portfolio-holdings data can improve macroprudential regulation, and how policymakers should use such tools. The authors build a graph-based deep learning model over security-level holdings of financial intermediaries that embeds economic priors and learns latent representations of both assets and investors from the network of positions. Applied to the near-universe of non-bank financial intermediaries (about $40 trillion), the model forecasts intermediary trading far better than existing approaches, including during crises, and has more than ten times the explanatory power for cross-sectional stress-period returns. Its learned embeddings encode economically interpretable information about fire-sale vulnerability, and the architecture is inductive enough to produce estimates even for withheld asset classes or investors. The authors then embed the empirical model in a macroprudential optimal-policy framework, addressing the Lucas critique, to show why these objects matter for welfare.", "logical_flow": "The paper frames systemic risk measurement as a prediction problem over the network of who holds what, arguing that the structure of intermediary holdings encodes fire-sale vulnerability that standard metrics miss. It develops a graph neural network with built-in economic priors that learns asset and investor representations from holdings, then validates the model out-of-sample on trading behavior and stress-period returns against existing benchmarks. Having shown the learned objects are predictive and interpretable, it asks how a regulator should optimally use them. It closes by embedding the empirical model in an equilibrium optimal-policy framework that confronts the Lucas critique, formalizing the welfare rationale for AI-based supervision.", "research_design": "Design and out-of-sample evaluation of a graph-based (network) deep-learning model on security-level intermediary holdings, benchmarked against existing systemic-risk metrics, embedded within a macroprudential optimal-policy framework robust to the Lucas critique.", "categories": ["Machine Learning in Finance", "Financial Regulation", "Systemic Risk"], "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Working Paper - 2026 - Clayton and Coppola - The Optimal Use of AI in Financial Regulation.pdf", "datasets": ["FactSet & Morningstar — Security-level intermediary holdings"]}, {"std_name": "Working Paper - 2026 - Ebsim et al. - Sophisticated Borrowing Constraints and Macroeconomic Dynamics", "journal": null, "year": 2026, "title": "Sophisticated Borrowing Constraints and Macroeconomic Dynamics", "authors": ["Ebsim", "Lian", "Ma", "Ottonello", "Perez"], "summary": "This paper argues that the way debt constraints are modeled fundamentally changes their macroeconomic implications. Traditional models impose hard borrowing limits that force firms to cut borrowing and investment whenever adverse shocks bind, producing financial acceleration. The authors instead model 'sophisticated borrowing constraints' resembling real-world financial covenants, where breaching an earnings-based debt threshold transfers control rights to creditors who then act to maximize their own value rather than mechanically shrinking credit. Calibrated to micro evidence on investment and earnings around covenant violations, the model matches firm-level dynamics while, at the macro level, generating no financial acceleration because violations do not trigger indiscriminate downscaling. The result challenges a workhorse mechanism linking credit conditions to aggregate fluctuations.", "logical_flow": "The paper contrasts textbook hard constraints, under which binding limits mechanically force deleveraging and amplify shocks, with the institutional reality of covenants, which reallocate control rather than dictate fixed borrowing ratios. It models covenant violation as a state-contingent transfer of control to creditors who choose firm policies to maximize creditor value, so tightening need not cause uniform credit cuts. The authors first show the model reproduces the empirical behavior of investment and earnings around violations at the micro level. They then embed the mechanism in a general-equilibrium setting and demonstrate that, unlike hard constraints, sophisticated constraints do not generate financial acceleration.", "research_design": "A quantitative macro-finance model with state-contingent, covenant-like borrowing constraints and creditor control rights, calibrated to firm-level dynamics around covenant violations, then evaluated for its aggregate (financial-acceleration) implications.", "categories": ["Macro-Finance", "Corporate Debt & Covenants", "Firm Investment"], "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Working Paper - 2026 - Ebsim et al. - Sophisticated Borrowing Constraints and Macroeconomic Dynamics.pdf", "datasets": ["Refinitiv LPC — DealScan", "Greg Nini (Nini, Smith & Sufi) — Financial covenant violation data"]}, {"std_name": "Working Paper - 2026 - Dou et al. - The Cost of Intermediary Market Power for Distressed Borrowers", "journal": null, "year": 2026, "title": "The Cost of Intermediary Market Power for Distressed Borrowers", "authors": ["Dou", "Wang", "Wang"], "summary": "This paper measures how much lender market power raises borrowing costs for firms in financial distress, who must raise urgent financing in thin, concentrated credit markets. The authors show that distressed borrowers pay very high loan spreads even after stripping out compensation for credit risk, liquidity risk, and ordinary loan-making costs. To decompose the residual, they build and estimate a dynamic game-theoretic model of distressed lending featuring latent demand heterogeneity, endogenous lender participation, creditor blocking power, and tacit collusion sustained by repeated syndication. Lender market power explains 533 basis points of risk-adjusted spreads in debtor-in-possession (DIP) loans and 300 basis points in highly speculative loans, with roughly 140 basis points from tacit collusion in each. Because this markup reduces survival-critical liquidity by 16–20%, market power emerges as a major, previously underappreciated source of financial-distress costs.", "logical_flow": "The argument begins by noting that distressed firms borrow in markets dominated by a few specialized lenders and by existing creditors who hold blocking power, so observed spreads may reflect market power rather than pure risk. The authors first document that DIP and highly speculative loan spreads remain large after removing risk and cost components, motivating a structural explanation. They then specify a dynamic game in which lenders choose whether to participate, exploit blocking power, and sustain tacit collusion through repeated syndication, allowing the markup to be identified and decomposed. Estimating the model on facility-level loan data, they quantify the market-power markup and trace its consequences for borrower liquidity and asset-value destruction.", "research_design": "Structural estimation of a dynamic game-theoretic model of distressed lending (with endogenous participation, creditor blocking power, and tacit collusion), disciplined by facility-level DIP and highly speculative loan data, used to decompose risk-adjusted spreads into market-power components.", "categories": ["Financial Distress & Bankruptcy", "Banking & Lending", "Market Power / Industrial Organization"], "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Working Paper - 2026 - Dou et al. - The Cost of Intermediary Market Power for Distressed Borrowers.pdf", "datasets": ["Refinitiv LPC — DealScan", "LPC (Refinitiv) — LSTA/LPC Mark-to-Market Pricing Data", "PACER — Public Access to Court Electronic Records", "Moody's — Default and Recovery Database"]}, {"std_name": "Working Paper - 2026 - He et al. - Homemade Foreign Trading", "journal": null, "year": 2026, "title": "Homemade Foreign Trading", "authors": ["He", "Wang", "Zhu"], "summary": "This paper documents how Chinese mainland insiders disguise domestic trades as foreign investment by round-tripping capital through the Stock Connect program, a practice the authors term 'homemade foreign trading.' Using cross-border holding data from all custodians in Stock Connect, they show that northbound flows predict returns and correlate with insider trading, but that this predictability decays after the 2018 Northbound Investor Identification reform introduced see-through surveillance. The decay is concentrated among less prestigious foreign custodians and cross-operating mainland custodians, precisely where insiders can most easily hide. The reform also reduces price informativeness in stocks most exposed to homemade foreign investors. The paper highlights regulatory cooperation as a key ingredient for the integrity of cross-border capital market integration.", "logical_flow": "The paper starts from the observation that Stock Connect lets mainland capital exit and re-enter disguised as foreign 'northbound' flow, giving insiders a channel to trade on private information while appearing to be offshore investors. It argues that if such round-tripping is real, northbound flows should predict returns and track insider activity, and that a reform imposing investor-level identification should break this link by making insiders identifiable. Exploiting the 2018 Northbound Investor Identification reform as a shock to surveillance, the authors trace how return predictability and its correlation with insider trading decay afterward. They then sharpen identification by showing the effect is strongest where hiding is easiest (opaque custodians) and by documenting a decline in price informativeness for the most exposed stocks.", "research_design": "Event-study / difference-in-differences around the 2018 Northbound Investor Identification reform, using custodian-level cross-border holding data and return-predictability regressions, with cross-sectional heterogeneity by custodian type and stock exposure for identification.", "categories": ["International Finance", "Insider Trading", "Market Microstructure"], "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Working Paper - 2026 - He et al. - Homemade Foreign Trading.pdf", "datasets": ["China Securities Depository and Clearing (CSDC) / Stock Connect", "CSMAR — China Stock Market & Accounting Research", "WIND"]}], "datasets": [{"provider": "Bureau van Dijk", "product": "Orbis (Italy)", "aliases": "", "description": "Italian firm-level data used const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const papers = DB.papers, datasets = DB.datasets;

// filter option lists
const cats = [...new Set(papers.flatMap(p=>p.categories))].sort();
const jours = [...new Set(papers.map(p=>p.journal).filter(Boolean))].sort();
const years = [...new Set(papers.map(p=>p.year).filter(Boolean))].sort((a,b)=>b-a);
const fill=(id,arr)=>{const s=document.getElementById(id);arr.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;s.appendChild(o);});};
fill("fcat",cats); fill("fjour",jours); fill("fyear",years);

function paperCard(p){
  const auth = p.authors&&p.authors.length?esc(p.authors.join(", ")):"Unknown";
  const fileLink = p.file_path? `<div class="path">file: <a href="file://${encodeURI(p.file_path)}">${esc(p.file_path)}</a></div>`:"";
  const cats = p.categories.map(c=>`<span class="chip">${esc(c)}</span>`).join("");
  const data = p.datasets.map(d=>`<span class="chip data">${esc(d)}</span>`).join("") || `<span class="note">no non-standard datasets</span>`;
  const note = p.missing_notes? `<div class="field"><span class="note">Note: ${esc(p.missing_notes)}</span></div>`:"";
  return `<div class="card">
    <div class="callno">${esc(p.std_name)}</div>
    <div class="ptitle" onclick="this.parentElement.querySelector('.detail').toggleAttribute('hidden')">${esc(p.title||"Untitled")}</div>
    <div class="meta">${auth} &nbsp;·&nbsp; ${esc(p.journal||"—")} &nbsp;·&nbsp; ${esc(p.year||"n.d.")}</div>
    <div class="cats">${cats}</div>
    <div class="field"><div class="flabel">Summary</div>${esc(p.summary||"")}</div>
    <div class="detail" hidden>
      <div class="field"><div class="flabel">Logical flow</div>${esc(p.logical_flow||"")}</div>
      <div class="field"><div class="flabel">Research design</div>${esc(p.research_design||"")}</div>
      <div class="field"><div class="flabel">Datasets used</div>${data}</div>
      ${note}${fileLink}
    </div>
  </div>`;
}
function haystack(p){return [p.std_name,p.title,p.summary,p.logical_flow,p.research_design,
  (p.authors||[]).join(" "),(p.categories||[]).join(" "),(p.datasets||[]).join(" "),p.journal].join(" ").toLowerCase();}

function renderPapers(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const fc=document.getElementById("fcat").value, fj=document.getElementById("fjour").value, fy=document.getElementById("fyear").value;
  const out=papers.filter(p=>(!q||haystack(p).includes(q))
    &&(!fc||p.categories.includes(fc))&&(!fj||p.journal===fj)&&(!fy||String(p.year)===fy));
  document.getElementById("papers").innerHTML = out.length?out.map(paperCard).join(""):`<div class="empty">No papers match. Try a broader search.</div>`;
  document.getElementById("pcount").textContent = out.length+" / "+papers.length+" papers";
}
function dsCard(d){
  const name = esc(d.provider)+(d.product?` — ${esc(d.product)}`:"");
  const tags = (d.topic_tags||"").split(";").map(t=>t.trim()).filter(Boolean).map(t=>`<span class="chip data">${esc(t)}</span>`).join("");
  const bits = [d.access_type,d.delivery].filter(Boolean).map(esc).join(" · ");
  const compiled = d.sources>1? `<div class="meta">description compiled from ${d.sources} papers</div>`:"";
  const used = d.used_by.length? `<div class="used"><b>${d.used_by.length}</b> paper(s): ${d.used_by.map(esc).join(" · ")}</div>`:"";
  const alias = d.aliases&&d.aliases!=="—"? `<div class="meta">aka ${esc(d.aliases)}</div>`:"";
  return `<div class="card">
    <div class="ptitle" style="cursor:default">${name}</div>
    ${alias}<div class="field">${esc(d.description||"")}</div>
    ${compiled}${bits?`<div class="meta">${bits}</div>`:""}${tags?`<div class="cats">${tags}</div>`:""}${used}
  </div>`;
}
function renderDatasets(){
  const q=document.getElementById("dq").value.trim().toLowerCase();
  const out=datasets.filter(d=>!q||[d.provider,d.product,d.description,d.topic_tags,d.aliases].join(" ").toLowerCase().includes(q));
  document.getElementById("datasets").innerHTML = out.length?out.map(dsCard).join(""):`<div class="empty">No datasets match.</div>`;
  document.getElementById("dcount").textContent = out.length+" / "+datasets.length+" datasets";
}
["q","fcat","fjour","fyear"].forEach(id=>document.getElementById(id).addEventListener("input",renderPapers));
document.getElementById("dq").addEventListener("input",renderDatasets);
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on")); t.classList.add("on");
  const isP=t.dataset.tab==="papers";
  document.getElementById("papers-view").style.display=isP?"":"none";
  document.getElementById("datasets-view").style.display=isP?"none":"";
}));
renderPapers(); renderDatasets();
</script></body></html>
