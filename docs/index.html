he literature on reporting quality from recurring operating choices to crisis-driven restructuring. It links accounting information quality to real productivity outcomes.", "logical_flow": "The paper notes that prior work links reporting quality to routine operating and investing decisions but says little about its role when firms must restructure after an adverse shock. It uses the 1999 Taiwan earthquake as an exogenous disruption to the supply chains of specific U.S. high-technology manufacturers, creating affected and unaffected groups. The authors hypothesize that firms with higher pre-shock reporting quality have better internal information to reallocate resources and adapt, so they should recover or even improve productivity more. Comparing affected to unaffected firms, they find total factor productivity rises for affected firms, and more so where pre-shock reporting quality was higher. This pattern indicates that information quality is especially valuable precisely when firms face large, non-routine disruptions. The paper concludes that reporting quality has real effects that show up in how firms weather shocks.", "research_design": "A difference-in-differences design using the 1999 Taiwan earthquake as an exogenous supply-chain shock, comparing exposed U.S. high-technology manufacturers to unexposed firms and interacting exposure with pre-shock reporting quality. The outcome is firm total factor productivity; the unit of analysis is the firm. Identification comes from the earthquake's disruption of specific supply chains.", "categories": ["Financial Reporting Quality", "Supply Chains", "Firm Productivity"], "shock": {"name": "1999 Taiwan (Chi-Chi) earthquake", "type": "Natural disaster", "what": "The 1999 Taiwan earthquake, which disrupted supply chains for certain U.S. high-technology manufacturers, used as an exogenous adverse shock whose productivity effects vary with firms' pre-shock reporting quality."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Accounting and Economics - 2026 - Berger and Tomy - Supply chain shocks and firm productivity The role of reporting quality.pdf", "datasets": ["Supply-chain relationship data"]}, {"std_name": "Journal of Accounting and Economics - 2026 - Miller et al. - Mandatory disclosure of investors' fossil fuel holdings", "journal": "Journal of Accounting and Economics", "year": 2026, "title": "Mandatory disclosure of investors' fossil fuel holdings", "authors": ["Miller", "Stockbridge", "Williams"], "summary": "This paper examines whether mandatory disclosure of fossil-fuel investments changes investors' portfolios, using a 2016 California mandate that required some U.S. insurers to publicly disclose their fossil-fuel holdings. Disclosing insurers reduced fossil-fuel investments by roughly 20% relative to non-disclosers. The average effect masks substantial heterogeneity across insurers. The results show that requiring firms to reveal environmentally sensitive holdings can shift capital away from those assets. The paper provides causal evidence on how disclosure mandates affect institutional portfolios rather than just disclosure itself.", "logical_flow": "The paper addresses a growing regulatory push to require investors to disclose fossil-fuel holdings, asking whether such disclosure changes behavior or is merely cosmetic. It uses a 2016 California mandate that applied to some U.S. insurers and made their fossil-fuel investments public, creating a treated group subject to disclosure and a comparison group that was not. The authors reason that if public scrutiny raises the cost of holding fossil-fuel assets, disclosing insurers should reduce those holdings relative to non-disclosers. Comparing the two groups around the mandate, they find a roughly 20% reduction in fossil-fuel investments by disclosers. They then explore heterogeneity, showing the response varies across insurers. The paper concludes that mandatory holdings disclosure can meaningfully reallocate institutional capital, with implications for climate-related disclosure policy.", "research_design": "A difference-in-differences design exploiting a 2016 California mandate requiring some U.S. insurers to publicly disclose fossil-fuel investments, comparing disclosing insurers to non-disclosers around the mandate. Outcomes are insurers' fossil-fuel holdings and investment policies; the unit of analysis is the insurer. Identification comes from which insurers were subject to the disclosure requirement.", "categories": ["Sustainable Finance & ESG", "Disclosure Regulation", "Institutional Investors"], "shock": {"name": "2016 California fossil-fuel disclosure mandate", "type": "Disclosure regulation", "what": "A 2016 California requirement that certain U.S. insurers publicly disclose their fossil-fuel investments, applying to a subset of insurers and used as a quasi-exogenous disclosure shock."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Accounting and Economics - 2026 - Miller et al. - Mandatory disclosure of investors' fossil fuel holdings.pdf", "datasets": ["California / NAIC insurer disclosures — Fossil-fuel investment filings"]}, {"std_name": "Journal of Accounting and Economics - 2026 - Leonelli et al. - How do consumers use ESG disclosure Evidence from a randomized field experiment with everyday product purchases", "journal": "Journal of Accounting and Economics", "year": 2026, "title": "How do consumers use ESG disclosure? Evidence from a randomized field experiment with everyday product purchases", "authors": ["Leonelli", "Muhn", "Rauter", "Sran"], "summary": "This paper combines a large-scale field experiment with a customized survey of over 24,000 U.S. households to study how consumers use ESG disclosure. The authors first establish that while consumers moderately prefer ESG-responsible firms, they rarely consult corporate reporting directly and face frictions in learning about firm activities. In the experiment, households are randomly informed about real firm-disclosed activities, and consumers raise their purchase intent when exogenously shown positive ESG signals. The results show that ESG information can move consumer behavior, but only once frictions in accessing it are removed. The paper provides causal, individual-level evidence on the demand-side value of ESG disclosure.", "logical_flow": "The paper starts from the debate over whether ESG disclosure actually matters to the consumers it is often meant to inform. It first documents, via survey, that consumers say they prefer responsible firms but seldom read corporate reports and struggle to learn what firms actually do, implying an information friction rather than an absence of preferences. This motivates an experiment that removes the friction by exogenously delivering real firm-disclosed ESG information to randomly selected households. The authors predict that if the friction is what suppresses ESG-based choice, then providing information should raise purchase intent for firms with positive disclosures. The experiment confirms this, with purchase intent rising when households receive positive ESG signals. The paper concludes that ESG disclosure has demand-side value that is latent until consumers are actually exposed to the information.", "research_design": "A randomized field experiment paired with a customized survey of more than 24,000 U.S. households. The survey establishes baseline preferences and frictions, and the experiment randomly assigns households to information treatments that reveal real firm-disclosed ESG activities, identifying the causal effect on purchase intent. The unit of analysis is the household; identification comes from the random assignment of ESG information.", "categories": ["Sustainable Finance & ESG", "Disclosure", "Consumer Behavior"], "shock": {"name": "Randomized field experiment on ESG information", "type": "Randomized field experiment", "what": "Randomized information treatments delivered to 24,000+ U.S. households that exogenously revealed real firm-disclosed ESG activities, enabling causal estimates of how ESG information affects purchases."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Accounting and Economics - 2026 - Leonelli et al. - How do consumers use ESG disclosure Evidence from a randomized field experiment with ev.pdf", "datasets": ["Authors' field experiment and survey"]}, {"std_name": "Journal of Financial Economics - 2026 - Kaviani et al. - Reaching for influence Do banks use loans to establish political connections", "journal": "Journal of Financial Economics", "year": 2026, "title": "Reaching for influence: Do banks use loans to establish political connections?", "authors": ["Kaviani", "Maleki", "Savor"], "summary": "This paper asks whether U.S. banks lend on favorable terms to firms with political ties in order to buy influence, using close congressional elections for identification. Firms connected to members of Congress receive more favorable loan terms despite no observable improvement in performance or default risk. The effect is strongest among banks facing regulatory challenges—FDIC enforcement actions, misconduct investigations, or low Community Reinvestment Act ratings—which also lend more often to connected firms, suggesting a heightened demand for influence. Politically motivated lending yields tangible benefits for banks, including reduced misconduct penalties and easier M&A approval. The paper documents a channel through which banks convert lending into political capital.", "logical_flow": "The paper starts from the idea that banks, which are heavily regulated, may value political influence and could try to acquire it by lending cheaply to politically connected firms. To identify politically motivated lending, it uses close elections, where whether a firm's favored candidate barely wins or loses is close to random, generating quasi-exogenous variation in a firm's political connections. It first shows that firms newly connected to winning members of Congress receive better loan terms even though their fundamentals do not improve, indicating the favorable terms reflect influence-seeking rather than credit quality. It then asks which banks do this most, finding that banks under regulatory pressure lend more to connected firms, consistent with their greater demand for political protection. Finally, it tests whether this pays off, showing connected lending is followed by reduced penalties and easier merger approvals. The paper concludes that banks strategically use loans to build political connections that yield regulatory benefits.", "research_design": "A regression-discontinuity-style design around close congressional elections, using the narrow victory or defeat of a firm's connected candidate as quasi-random variation in political connections. The authors compare loan terms to connected versus non-connected firms and test heterogeneity by banks' regulatory pressure (FDIC actions, misconduct investigations, CRA ratings), then relate connected lending to later bank outcomes (penalties, M&A approvals). The unit of analysis is the loan/firm-bank; identification comes from the close-election discontinuity.", "categories": ["Banking", "Political Economy & Finance", "Corporate Governance"], "shock": {"name": "Close congressional elections", "type": "Regression discontinuity", "what": "Narrowly decided U.S. congressional elections, where whether a firm's connected candidate barely wins or loses is close to random, used as quasi-exogenous variation in firms' political connections."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Financial Economics - 2026 - Kaviani et al. - Reaching for influence Do banks use loans to establish political connections.pdf", "datasets": ["Refinitiv LPC — DealScan", "Close-election and political-connection data", "Bank regulatory records"]}, {"std_name": "Journal of Financial Economics - 2026 - Lindsey and Stein - Angels, entrepreneurship, and employment dynamics Evidence from investor accreditation rules", "journal": "Journal of Financial Economics", "year": 2026, "title": "Angels, entrepreneurship, and employment dynamics: Evidence from investor accreditation rules", "authors": ["Lindsey", "Stein"], "summary": "This paper examines how a shock to the supply of angel finance affects entrepreneurship, using Dodd-Frank's removal of housing wealth from the definition of an accredited investor. Using U.S. Census data, the authors estimate the state-level fraction of households that lost accreditation and show that larger reductions in the investor pool reduce angel investment, firm entry, and employment at small entrants. Employment rises at small and young incumbents, suggesting competitive effects, and angel finance appears to complement other capital sources despite partial substitution. The paper provides causal evidence on the real effects of angel finance and where it matters most.", "logical_flow": "The paper studies angel investors, an important but hard-to-observe source of early-stage capital, and asks what happens to entrepreneurship when their supply shrinks. It exploits a specific rule change: Dodd-Frank stopped counting housing wealth toward the wealth threshold that defines an accredited (eligible angel) investor, which pushed some households below the threshold. Because house values differ across places, the fraction of households losing accreditation varies by state, generating quasi-exogenous cross-state variation in the angel-investor pool. The authors predict that a larger reduction in potential angels lowers angel investment, firm entry, and employment at small new firms. Using Census data, they confirm these effects, and additionally find employment rising at small and young incumbents, consistent with reduced entry easing competition. Documenting partial substitution toward other capital, they conclude angel finance complements rather than merely substitutes for other funding in the entrepreneurial ecosystem.", "research_design": "A quasi-experimental design exploiting Dodd-Frank's removal of housing wealth from accredited-investor eligibility, which reduced the angel-investor pool differentially across states depending on local house values. Using confidential U.S. Census firm and employment data, the authors relate state-level exposure (the fraction of households losing accreditation) to angel investment, firm entry, and employment at entrants and incumbents. The unit of analysis is the state/firm; identification comes from cross-state variation in exposure to the rule change.", "categories": ["Entrepreneurial Finance", "Firm Dynamics", "Financial Regulation"], "shock": {"name": "Dodd-Frank removal of housing wealth from accredited-investor rules", "type": "Regulatory reform", "what": "A Dodd-Frank change that excluded home equity from the wealth test defining accredited investors, pushing some households below the threshold; because house values differ across states, it reduced the angel-investor pool by varying amounts geographically."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Financial Economics - 2026 - Lindsey and Stein - Angels, entrepreneurship, and employment dynamics Evidence from investor accreditation rul.pdf", "datasets": ["U.S. Census Bureau — Longitudinal Business Database / firm microdata", "Angel investment and accreditation data"]}, {"std_name": "Journal of Financial Economics - 2026 - Woeppel and Yavuz - Measuring firms' capability to absorb external knowledge", "journal": "Journal of Financial Economics", "year": 2026, "title": "Measuring firms' capability to absorb external knowledge", "authors": ["Woeppel", "Yavuz"], "summary": "This paper builds a measure of firms' capability to benefit from external knowledge—'absorption intensity'—from information in their patents. To validate it, the authors exploit the American Inventors Protection Act (AIPA), which exogenously increased the availability of patent information, in a triple-difference design: firms with higher absorption intensity see greater innovation growth when more exposed to the reform. Beyond AIPA, absorption intensity predicts stronger innovation outcomes and firm growth. The measure offers a tool to study how differences in absorptive capability shape the returns to external knowledge. It contributes a patent-based proxy for a concept that was previously hard to measure.", "logical_flow": "The paper argues that as the economy becomes knowledge-based, a firm's ability to absorb and use external knowledge is increasingly important, yet this absorptive capability is hard to measure. The authors propose to infer it from patents, constructing an 'absorption intensity' measure that captures how well a firm draws on outside knowledge. To show the measure is meaningful rather than mechanical, they need a setting where the value of absorptive capability changes exogenously. AIPA, which increased the disclosure of patent information, provides such a shock: firms better able to absorb external knowledge should benefit more when more information becomes available. A triple-difference design comparing high- and low-absorption firms by exposure to AIPA confirms that high-absorption firms experience greater innovation growth. The paper then shows absorption intensity predicts innovation and growth more broadly, establishing it as a useful, validated proxy.", "research_design": "A measurement paper validated with a triple-difference design around the American Inventors Protection Act (AIPA), which exogenously increased patent-information availability. The absorption-intensity measure is built from patent data, and the triple difference compares high- versus low-absorption firms with greater versus lesser exposure to the reform, before versus after. Broader predictive regressions relate the measure to innovation and firm growth; the unit of analysis is the firm-year.", "categories": ["Innovation & Intellectual Property", "Corporate Finance", "Firm Growth"], "shock": {"name": "American Inventors Protection Act (AIPA)", "type": "Legislative reform", "what": "A U.S. reform that required publication of most patent applications 18 months after filing, exogenously increasing the availability of patent information and raising the payoff to absorbing external knowledge."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Financial Economics - 2026 - Woeppel and Yavuz - Measuring firms' capability to absorb external knowledge.pdf", "datasets": ["KPSS patent value database — Kogan, Papanikolaou, Seru & Stoffman (2017)", "USPTO patent data"]}, {"std_name": "Journal of Financial Economics - 2026 - Benguria et al. - Trade credit and relationships", "journal": "Journal of Financial Economics", "year": 2026, "title": "Trade credit and relationships", "authors": ["Benguria", "Garcia-Marin", "Schmidt-Eisenlohr"], "summary": "This paper uses transaction-level international trade data to show that long-term firm-to-firm relationships facilitate the use of trade credit. The strength of this effect varies with firm size, payment delays, and multinational-affiliate status, and depends on the strength of contract enforcement across countries and the complexity of traded products. Because trade credit substitutes for borrowing from the financial sector, long-term relationships can reduce firms' external credit demand. A corollary is that destroying trade relationships—for example through trade conflicts—may raise firms' leverage. The paper connects relationship lending in trade to firms' financing needs.", "logical_flow": "The paper begins from the observation that firms often finance trade through credit extended by their trading partners rather than by banks, and asks what determines the use of such trade credit. It proposes that repeated, long-term relationships between buyers and sellers build the trust and information needed to extend credit, so relationship length should predict trade-credit use. Using detailed transaction-level trade data, it tests whether longer relationships are associated with more trade credit and how this varies with firm characteristics. It then examines institutional moderators, showing the effect is stronger where contract enforcement is weaker and products are more complex, consistent with relationships substituting for formal enforcement. Because trade credit can replace bank borrowing, the paper draws the implication that relationships reduce firms' demand for external finance. It concludes that shocks that sever trade relationships, such as trade conflicts, could push firms back toward bank debt and raise leverage.", "research_design": "A descriptive/reduced-form design using transaction-level (customs) international trade data to relate the length of firm-to-firm trading relationships to the use of trade credit, with heterogeneity by firm size, payment delays, and multinational status. Institutional interactions use cross-country contract-enforcement measures and product-complexity classifications. The unit of analysis is the firm-to-firm trade transaction.", "categories": ["Trade Credit & Financing", "International Finance", "Firm Financing"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Financial Economics - 2026 - Benguria et al. - Trade credit and relationships.pdf", "datasets": ["Transaction-level international trade (customs) data", "Contract-enforcement and product-complexity measures"]}, {"std_name": "Journal of Financial Economics - 2026 - Fisman et al. - Dirty air and green investments The impact of pollution information on portfolio allocations", "journal": "Journal of Financial Economics", "year": 2026, "title": "Dirty air and green investments: The impact of pollution information on portfolio allocations", "authors": ["Fisman", "Ghosh", "Sen"], "summary": "This paper asks whether access to local pollution information causes investors to make greener portfolio choices, exploiting the staggered rollout of air-quality monitoring stations across India. Using a triple-differences design on the trading records of 19 million retail investors, the authors show that holdings in 'brown' (high-pollution) stocks become more negatively related to local pollution once a nearby monitoring station appears. The effect is stronger on 'alert' dates when air quality is reported harmful, among tech-savvy investors likely exposed to real-time data, and among younger investors. The results show that making environmental information salient shifts capital away from polluting firms. The paper links information provision to sustainable investing behavior.", "logical_flow": "The paper starts from the idea that investors may want to avoid polluting firms but lack salient, local information about pollution, so providing it should change behavior. Air-quality monitoring stations, rolled out at different times across Indian locations, make local pollution observable and are used as a source of quasi-exogenous variation in information access. The authors reason that if information drives green investing, retail holdings in brown stocks should become more negatively related to local pollution after a nearby station appears, and especially on days when pollution is reported harmful. A triple-differences design compares brown-stock holdings, across investors near versus far from new stations, before versus after, and on alert versus normal days. Finding the predicted patterns—strongest for tech-savvy and younger investors—they conclude that salient pollution information causally shifts portfolios. The paper interprets this as evidence that information frictions, not just preferences, shape sustainable investment.", "research_design": "A triple-differences design exploiting the staggered rollout of air-quality monitoring stations across India as quasi-exogenous variation in local pollution information, estimated on the trading records of 19 million retail investors. The comparison combines proximity to a new station, timing before/after, and 'alert' versus normal pollution days, with heterogeneity by investor tech-savviness and age. The unit of analysis is the investor-stock-time; identification comes from the station rollout.", "categories": ["Sustainable Finance & ESG", "Household Finance", "Information & Markets"], "shock": {"name": "Rollout of air-quality monitoring stations across India", "type": "Staggered information rollout", "what": "The staggered appearance of local air-quality monitoring stations, which made pollution observable in a location at different times, used as quasi-exogenous variation in access to local pollution information."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Financial Economics - 2026 - Fisman et al. - Dirty air and green investments The impact of pollution information on portfolio allocations.pdf", "datasets": ["Indian retail investor trading records", "Central Pollution Control Board (India) — Air-quality monitoring stations"]}, {"std_name": "Journal of Financial Economics - 2026 - Goldstein et al. - Market feedback Evidence from the horse's mouth", "journal": "Journal of Financial Economics", "year": 2026, "title": "Market feedback: Evidence from the horse's mouth", "authors": ["Goldstein", "Liu", "Yang"], "summary": "This paper uses near-population surveys of Chinese public firms (2019 and 2022, via the CSRC, ~99% response) to provide direct evidence on whether and how the stock market affects firms, focusing on the contested learning channel. Over 90% of firms monitor the market, and the two most common reasons are learning new information relevant to investment and dependence on prices for financing. Firms that report learning have characteristics implying greater benefit and show higher investment-to-price sensitivity. The paper documents which information dimensions firms learn about and links learning to better M&A outcomes and fewer trading suspensions. It offers rare direct evidence on the real effects of markets.", "logical_flow": "The paper situates itself in the debate over the real effects of markets, distinguishing a financing channel from a learning channel whose existence is hard to identify because information sets are unobservable. Rather than infer learning indirectly, the authors ask managers directly through near-population surveys, establishing that monitoring is widespread and that learning and financing dominate. They then open the black box of what information is learned, a dimension prior work largely could not address. To counter the concern that survey answers are noise, they derive and test predictions about which firm characteristics should predict learning. They further test whether reported learning maps into real actions—investment-to-price sensitivity, M&A performance, and trading suspensions. Finding that responses line up with characteristics and behavior, they argue the survey evidence is credible and that learning from prices materially shapes firm decisions.", "research_design": "A survey-based, direct-evidence design using two rounds of near-population firm surveys, validated with cross-sectional Probit models linking responses to firm characteristics and panel investment-to-price sensitivity regressions, plus M&A and trading-suspension tests. The unit of analysis is the firm; credibility comes from tying stated learning to observable characteristics and subsequent actions.", "categories": ["Real Effects of Financial Markets", "Corporate Investment", "Survey Methods in Finance"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Financial Economics - 2026 - Goldstein et al. - Market feedback Evidence from the horse's mouth.pdf", "datasets": ["CSMAR — China Stock Market & Accounting Research", "WIND", "CSRC & Tsinghua PBCSF — Survey of Chinese public firms (2019, 2022)"]}, {"std_name": "Journal of Financial Economics - 2026 - Goyal et al. - Picking partners Manager selection in private markets", "journal": "Journal of Financial Economics", "year": 2026, "title": "Picking partners: Manager selection in private markets", "authors": ["Goyal", "Wahal", "Yavuz"], "summary": "This paper studies how limited partners select private-market managers across more than 61,000 commitments (1995-2019) by constructing feasible 'opportunity sets.' LPs chase past performance but are strikingly willing to back first-time or young GPs: the probability of selecting a first-time GP is about as high as selecting a top-quartile GP, even though first-time funds earn lower expected and realized returns. After ruling out expected performance, lottery preferences, star-fund access, and co-investment, the authors show the main driver is pressure to invest as private-market allocations grow. The paper reframes manager selection around demand and supply rather than skill.", "logical_flow": "The paper frames manager selection as a discrete-choice problem whose central difficulty is that the feasible choice set is unobserved, which it resolves by constructing opportunity sets from institutional detail, interviews, and investment-policy statements. Estimating selection against these sets, it documents robust performance chasing alongside a high propensity to pick first-time and young GPs. It then eliminates candidate explanations, showing first-time GPs do not deliver higher expected or realized returns, greater skewness, privileged access to later star funds, or more co-investment. Having ruled these out, it develops a demand-supply account and constructs a measure of pressure to invest. It shows LPs facing high pressure move down the performance ladder toward first-time GPs. The paper concludes that excess demand for private-market exposure, met by new GP entry, explains the willingness to back unproven managers.", "research_design": "Discrete-choice selection modeling (conditional logit and linear-probability specifications) estimated on curated LP-year opportunity sets with two-way exclusion restrictions ('feasible-set shifters'). Robustness comes from alternative opportunity-set constructions, Heckman selection for missing performance, and expected-performance estimation. The unit of analysis is the LP-fund choice within a feasible set.", "categories": ["Private Equity & Venture Capital", "Institutional Investors & Asset Management", "Manager Selection"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Financial Economics - 2026 - Goyal et al. - Picking partners Manager selection in private markets.pdf", "datasets": ["Preqin", "CEM Benchmarking", "Institute for Private Capital — Failed-fund data", "SEC — Form D filings", "RelSci", "Fundmap"]}, {"std_name": "Journal of Financial Economics - 2026 - Cassella et al. - Constrained by law The impact of fiduciary duties on portfolios and prices in US equity markets", "journal": "Journal of Financial Economics", "year": 2026, "title": "Constrained by law: The impact of fiduciary duties on portfolios and prices in US equity markets", "authors": ["Cassella", "Rizzo", "Spalt", "Zimmerer"], "summary": "This paper studies how a change in trust fiduciary law reshaped institutional portfolios and equity prices. The Uniform Prudent Investor Act (UPIA), adopted by U.S. states in staggered fashion from 1985 to 2006, replaced asset-by-asset prudent-man rules with a portfolio-level prudent-investor standard. The authors show trusts tilted toward 'prudent' stocks before the reform and undid these tilts after adoption, improving trust risk-return. Consistent with inelastic markets, the demand shift moved relative prices, implying demand elasticities between 0.10 and 0.36. The paper documents a decades-long, law-induced investment distortion and adds novel estimates of equity demand elasticity.", "logical_flow": "The paper contrasts the diversification prescriptions of modern portfolio theory with prudent-man laws that forced trustees to justify each holding in isolation, creating a binding tilt toward 'prudent' stocks. A CARA-normal model with trust managers facing a prudence-tilted benchmark yields three predictions: regulatory tilts before UPIA, an unwinding after UPIA, and price changes under inelastic markets. Because UPIA was adopted state-by-state and applies only to trusts, the design compares trusts to other institutions within state and time. The empirical sections move from holdings, to risk-return consequences, to relative prices. Finding that trusts undid their tilts and that prices moved as predicted, the authors back out demand elasticities from the regulation-induced demand shock. The result ties a legal constraint to portfolio behavior and to the inelasticity of equity markets.", "research_design": "Staggered difference-in-differences exploiting state-level UPIA adoption, supported by a CARA-normal inelastic-markets model. The design uses investor and state-by-quarter fixed effects and the Sun-Abraham estimator for heterogeneous treatment effects; Fama-French five-factor tests measure risk-return changes and an instrumented demand system recovers elasticities. The unit of analysis is the institution-stock-quarter; identification comes from the timing of UPIA across states.", "categories": ["Institutional Investors & Asset Management", "Demand-Based Asset Pricing", "Law and Finance"], "shock": {"name": "Uniform Prudent Investor Act (UPIA) adoption", "type": "Staggered state-law reform", "what": "States' staggered 1985-2006 replacement of asset-by-asset 'prudent-man' rules with a portfolio-level prudent-investor standard, which applied only to trusts and relaxed a binding constraint on their holdings."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Financial Economics - 2026 - Cassella et al. - Constrained by law The impact of fiduciary duties on portfolios and prices in US equity mark.pdf", "datasets": ["DeVault, Sias & Starks (2019) — Institutional classification (57 types)", "FDIC / WestLaw — UPIA adoption dates"]}, {"std_name": "Journal of Financial Economics - 2026 - Hvide and Nielsen - Flying below the radar Insider trading by executives below the top", "journal": "Journal of Financial Economics", "year": 2026, "title": "Flying below the radar: Insider trading by executives below the top", "authors": ["Hvide", "Nielsen"], "summary": "This paper studies whether executives just below the reportable-insider threshold trade profitably on material inside information, using Norwegian administrative register data on the population of trades. It finds abnormal returns of roughly 50-100 basis points at the one-month horizon on these executives' own-company purchases, rising over longer horizons. Because the same individuals earn no abnormal returns on non-inside or same-industry purchases, general stock-picking skill and industry knowledge are ruled out. The evidence indicates that a broad group of executives beyond top management trades on material information that escapes mandatory disclosure. It is the first transaction-level test of below-the-top executives trading on inside information.", "logical_flow": "The paper begins from the regulatory design that requires only primary insiders to disclose own-company trades, leaving below-the-top executives unmonitored despite their proximity to inside information. Whether they actually trade on that information is posed as an open question, since they might instead buy own-company stock out of familiarity or loyalty, which would not generate abnormal returns. Using positional codes to isolate below-the-top executives, the authors compare returns on their inside versus non-inside trades. Crucially, they benchmark inside purchases against the same individuals' other trades to net out ability and industry knowledge. Finding abnormal returns only on inside purchases, they conclude these executives trade on material information. The paper extends the analysis to indirect trades and job changes to interpret the source of the returns.", "research_design": "Long-run abnormal-return estimation on administrative (population) register data using a control-firm bootstrap and a calendar-time Carhart four-factor portfolio approach, with individual-specific benchmarks that difference out stock-picking ability. The unit of analysis is the individual trade; identification of information-based trading comes from comparing inside purchases to the same person's non-inside and same-industry purchases.", "categories": ["Insider Trading", "Financial Regulation", "Empirical Asset Pricing"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Financial Economics - 2026 - Hvide and Nielsen - Flying below the radar Insider trading by executives below the top.pdf", "datasets": ["Norwegian Central Securities Depository (VPS)", "Statistics Norway — Employer-employee register (ISCO-88)", "Oslo Stock Exchange", "Norwegian registers (LLC ownership; population)"]}, {"std_name": "Journal of Financial Economics - 2026 - Acikalin et al. - Intellectual property protection lost and competition An examination using large language models", "journal": "Journal of Financial Economics", "year": 2026, "title": "Intellectual property protection lost and competition: An examination using large language models", "authors": ["Acikalin", "Caskurlu", "Hoberg", "Phillips"], "summary": "This paper examines who gains and who loses when intellectual-property protection is broadly weakened, using the 2014 Alice v. CLS Bank Supreme Court decision that invalidated many business-method patents. The authors use a large language model (ModernBERT) to score each firm's pre-Alice patents for their exposure to the decision and build a firm-level treatment. Using difference-in-differences with entropy balancing, they find an unequal impact: large firms gain while small firms lose. Small treated firms face more venture-backed entry, product-market encroachment, more litigation, and lower profits and valuations, and respond by raising R&D and nondisclosure. The paper contributes both an LLM-based method for measuring legal shocks and evidence that patents matter most for small firms.", "logical_flow": "The paper enters the long debate over whether patents help or hinder innovation by treating the Alice decision as a broad, technology-area-wide weakening of IP rather than the loss of a single rival's patent. Because the ex-post fate of any patent is uncertain, the authors argue a language model is needed to gauge each patent's similarity to those invalidated under Alice, yielding a continuous firm-level exposure measure. They hypothesize, following leader-versus-laggard logic, that smaller firms with fewer resources and weaker barriers to entry are hurt more, while larger firms defend their positions. These hypotheses generate predictions about differential effects on patenting, competition, performance, valuation, and litigation. The empirical design then tests each prediction, and the pattern of small-firm losses and large-firm gains supports the view that IP protection disproportionately shields smaller innovators. The paper closes by drawing out the policy implication that uniform changes in patent strength have highly unequal effects across firm size.", "research_design": "A continuous-treatment difference-in-differences design exploiting the Alice Supreme Court decision as a quasi-exogenous shock, with entropy balancing for covariate balance and firm/year fixed effects. The treatment is constructed from a fine-tuned ModernBERT model applied to patent text, validated against USPTO post-grant reviews. Effects on innovation, competition, performance, valuation, and litigation are compared across small and large treated firms; the unit of analysis is the firm-year.", "categories": ["Innovation & Intellectual Property", "Industrial Organization", "Machine Learning in Finance"], "shock": {"name": "Alice v. CLS Bank Supreme Court decision (2014)", "type": "Supreme Court decision", "what": "A 2014 ruling that invalidated many business-method and software patents, broadly and unexpectedly weakening IP protection across affected technology areas, used as a quasi-exogenous shock to firms' patent portfolios."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Financial Economics - 2026 - Acikalin et al. - Intellectual property protection lost and competition An examination using large language mo.pdf", "datasets": ["KPSS patent value database — Kogan, Papanikolaou, Seru & Stoffman (2017)", "USPTO — Patent application office actions", "Hoberg-Phillips — TNIC", "Stanford NPE Litigation Database / PACER", "Unified Patents — Post-grant review data", "Venture Expert (Refinitiv)"]}, {"std_name": "Working Paper - 2026 - Lu and Wu - Banking on Inattention", "journal": null, "year": 2026, "title": "Banking on Inattention", "authors": ["Lu", "Wu"], "summary": "This paper argues that depositor inattention is a source of banks' deposit market power. The authors develop a model in which inattentive depositors adjust their balances sluggishly to changes in deposit rates, allowing banks to pay rates that respond incompletely to the policy rate and to earn rents on deposits. Using transaction-level evidence together with Call Reports and the FDIC Summary of Deposits, they show that more inattentive depositors adjust balances less and that this inattention maps into weaker deposit-rate pass-through. The framework links a behavioral friction—limited attention—to bank funding costs and the transmission of monetary policy. It implies that inattention, not just market concentration, underpins deposit market power.", "logical_flow": "The paper begins from the puzzle that bank deposit rates respond only partially to the policy rate, which is usually attributed to market concentration, and proposes an alternative, behavioral source: depositor inattention. It builds a model in which depositors do not continuously monitor deposit rates and therefore adjust their balances sluggishly, so banks can widen the spread between the policy rate and the deposit rate without losing funds quickly. In this setting, inattention directly generates deposit market power and incomplete pass-through, independent of how concentrated the market is. The authors then bring evidence to bear, using transaction-level data to show that more inattentive depositors move their balances less in response to rate changes, and linking this to aggregate patterns in Call Reports and the FDIC Summary of Deposits. The empirical mapping from inattention to weaker pass-through supports the model's central mechanism. The paper concludes that limited attention is a key micro-foundation for banks' deposit franchise and matters for how monetary policy transmits through deposits.", "research_design": "A theoretical model of depositor inattention generating deposit market power and incomplete deposit-rate pass-through, combined with empirical evidence. The empirical work uses transaction-level data to measure how depositor inattention relates to balance adjustment and pass-through, with U.S. Call Reports and the FDIC Summary of Deposits used for aggregate deposit sizes and branch-level patterns. Identification of the mechanism comes from relating measured inattention to the sensitivity of balances and deposit rates rather than from a single external shock.", "categories": ["Banking", "Monetary Economics", "Household Finance"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Working Paper - 2026 - Lu and Wu - Banking on Inattention.pdf", "datasets": ["FDIC — Summary of Deposits", "Proprietary transaction-level data provider"]}, {"std_name": "Working Paper - 2026 - Argyle et al. - The Dynamics of Retail Deposit Balances", "journal": null, "year": 2026, "title": "The Dynamics of Retail Deposit Balances", "authors": ["Argyle", "Iverson", "Kotter", "Nadauld", "Palmer"], "summary": "This paper uses transaction-level data on retail deposit accounts to study how households manage their deposit balances. The authors document substantial skewness and inertia in balances, with many depositors holding large amounts—including balances above the FDIC insurance limit—and adjusting slowly to interest-rate incentives. They identify notches at product-specific thresholds (such as service or rate tiers) and show how balances bunch and respond around them. These patterns imply that retail deposits are stickier and less rate-sensitive than frictionless models assume, with implications for banks' funding costs and market power. The paper provides granular evidence on the microstructure of household deposit behavior.", "logical_flow": "The paper motivates that retail deposits are a huge and stable source of bank funding, yet how individual households actually manage their balances is not well documented at the transaction level. Using granular account data, the authors first characterize the distribution of balances, finding it highly skewed, with a large share of deposits held by high-balance depositors and substantial amounts above the FDIC insurance limit. They then examine dynamics, showing that balances are inert and adjust slowly to interest-rate incentives, contrary to models in which depositors quickly chase yield. To sharpen the analysis, they exploit product-specific notches—thresholds at which the interest rate or services change—and study how balances bunch and respond around them, which reveals the frictions governing deposit adjustment. These patterns imply that deposits are stickier and less rate-elastic than standard assumptions, giving banks funding stability and pricing power. The paper draws out implications for how deposit inertia shapes banks' funding costs and the transmission of interest rates.", "research_design": "An empirical, descriptive study using proprietary transaction-level retail deposit account data to characterize the distribution and dynamics of household deposit balances. The authors document skewness and inertia and use product-specific notches (thresholds where rates or services change) as a bunching/quasi-experimental design to identify how balances respond to incentives. The unit of analysis is the account over time; regulatory data (Call Reports, FDIC) are used to benchmark aggregate patterns.", "categories": ["Household Finance", "Banking", "Deposits"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Working Paper - 2026 - Argyle et al. - The Dynamics of Retail Deposit Balances.pdf", "datasets": ["Proprietary retail deposit data provider"]}, {"std_name": "Review of Economic Studies - 2026 - Ivanov et al. - Taxes Depress Corporate Borrowing Evidence from Private Firms", "journal": "Review of Economic Studies", "year": 2026, "title": "Taxes Depress Corporate Borrowing: Evidence from Private Firms", "authors": ["Ivanov", "Pettit", "Whited"], "summary": "This paper uses variation in U.S. state corporate income tax rates to re-examine how taxes affect corporate leverage, focusing on small private firms. Contrary to prior research, the authors find that corporate leverage rises after tax cuts for these firms. An estimated dynamic equilibrium model explains why: tax cuts make capital more productive and spur investment financed partly with debt, and they push default thresholds further away, making borrowing safer. The combination overturns the standard prediction that lower taxes reduce the debt tax shield and hence leverage. The paper shows that for financially constrained private firms, the investment and risk channels of taxes dominate the classic tax-shield channel.", "logical_flow": "The paper revisits the textbook relationship between taxes and leverage, where higher tax rates raise the value of the interest tax shield and should therefore increase debt, a prediction that has received mixed empirical support. The authors focus on small private firms, for which financing frictions and investment responses may reshape the tax–leverage link, and exploit changes in state corporate income tax rates as variation in the tax environment. Empirically, they find the opposite of the standard prediction: leverage rises after tax cuts for these firms. To interpret this, they build and estimate a dynamic equilibrium model in which taxes affect not only the debt tax shield but also the productivity of capital and the firm's distance to default. In the model, a tax cut raises the return to investing, and firms fund the extra investment partly with debt, while the improved cash flows move the default threshold further away and make additional borrowing safer. These investment and risk channels dominate the tax-shield channel for constrained private firms, producing the observed rise in leverage after tax cuts and reconciling the evidence with theory.", "research_design": "A reduced-form design exploiting staggered changes in U.S. state corporate income tax rates (and tax-base rules) to estimate their effect on the leverage of small private firms, combined with an estimated dynamic equilibrium (structural) model of firm investment and financing. The reduced-form estimates identify the sign of the tax–leverage relationship from cross-state, over-time tax variation, and the structural model decomposes the response into tax-shield, capital-productivity, and default-risk channels. Confidential bank-reported loan-level data on commercial and industrial loans provide firm borrowing outcomes.", "categories": ["Corporate Finance", "Taxation", "Capital Structure"], "shock": {"name": "State corporate income tax rate changes", "type": "Staggered policy variation", "what": "Changes in U.S. state corporate income tax rates and tax-base rules across states and over time, used as quasi-exogenous variation in the tax incentive to use debt."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Review of Economic Studies - 2026 - Ivanov et al. - Taxes Depress Corporate Borrowing Evidence from Private Firms.pdf", "datasets": ["Federal Reserve — FR Y-14 supervisory data", "State corporate income tax data"]}, {"std_name": "Review of Economic Studies - 2026 - Miranda-Agrippino et al. - Patents, News, and Business Cycles", "journal": "Review of Economic Studies", "year": 2026, "title": "Patents, News, and Business Cycles", "authors": ["Miranda-Agrippino", "Hacıoğlu-Hoke", "Bluwstein"], "summary": "This paper builds a new instrument for technology news shocks—anticipated future improvements in productivity—using information contained in patent applications. The instrument relaxes the identifying assumptions traditionally used to recover news shocks and, by construction, isolates shocks that have no immediate effect on aggregate productivity. Embedding the instrument in a structural VAR, the authors trace how technology news propagates through the economy and drives business-cycle fluctuations. They find news shocks are an important source of aggregate dynamics. The paper contributes a patent-based identification strategy that sidesteps the fragilities of earlier approaches to measuring news shocks.", "logical_flow": "The paper addresses a core difficulty in the news-shock literature: news about future productivity is hard to identify because it does not move current productivity, and existing approaches rely on strong and contestable identifying assumptions. The authors propose that patent applications contain forward-looking information about coming technological improvements, and can therefore be used to build an instrument for technology news. They construct this instrument so that it captures anticipated future productivity gains while having, by design, no contemporaneous effect on aggregate productivity, which is exactly the signature of a news shock. Plugging the instrument into a structural VAR with rich macro aggregates, they identify the dynamic response of the economy to technology news without imposing the traditional restrictions. The estimated responses show that news shocks generate meaningful business-cycle comovement, supporting the view that expectations about future technology matter for fluctuations. The paper thus both provides a cleaner identification tool and reinforces the empirical relevance of news-driven cycles.", "research_design": "An instrumental-variables / structural-VAR design in which an external instrument for technology news shocks is constructed from patent-application data (via the NBER-USPTO historical patent files). The instrument is built to capture anticipated future productivity while having no contemporaneous productivity effect, and is used to identify news shocks in a VAR without the traditional identifying restrictions. The analysis is macro time-series; identification comes from the patent-based instrument's relevance and its exogeneity to current productivity.", "categories": ["Macroeconomics", "Business Cycles", "Innovation"], "shock": {"name": "Patent-based instrument for technology news shocks", "type": "Instrument / news shock", "what": "An instrumental variable built from information in patent applications that isolates anticipated future productivity improvements (technology news) while having no contemporaneous effect on aggregate productivity, relaxing the identifying assumptions used in prior work."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Review of Economic Studies - 2026 - Miranda-Agrippino et al. - Patents, News, and Business Cycles.pdf", "datasets": ["NBER–USPTO — Historical Patent Data Files (Marco et al. 2015)"]}, {"std_name": "Review of Economic Studies - 2026 - Cullen et al. - What's My Employee Worth The Effects of Salary Benchmarking", "journal": "Review of Economic Studies", "year": 2026, "title": "What's My Employee Worth? The Effects of Salary Benchmarking", "authors": ["Cullen", "Li", "Perez-Truglia"], "summary": "This paper studies salary benchmarking—firms using aggregated market-salary data to set pay. Using national payroll data, the authors examine firms that gain access to a tool revealing market benchmarks for each job title, and use a difference-in-differences design around that access. They find the benchmark information reduces within-firm salary dispersion by about 25%, as firms move pay toward the market rate for each role. The results show that widely available wage information meaningfully compresses pay differences rather than simply raising or lowering wages. The paper documents a concrete channel through which information affects wage setting and dispersion.", "logical_flow": "The paper begins with the observation that firms increasingly use aggregated market-salary data—salary benchmarking—to set pay, and asks how access to such information changes wage-setting. It frames the question around a tool that gives firms market benchmarks for each specific job title, so the relevant information is granular and directly usable in pay decisions. Exploiting the timing of when firms gain access to this tool, the authors set up a difference-in-differences comparison between firms that adopt it and otherwise similar firms that have not yet done so. They predict that benchmarking pulls each firm's pay for a given role toward the market rate, which should compress the spread of salaries within the firm rather than uniformly shift them. The data confirm a roughly 25% reduction in salary dispersion following access, consistent with firms anchoring on role-specific benchmarks. The paper interprets this as evidence that market wage information is a powerful force compressing pay differences, with implications for inequality and for debates over the transparency of compensation data.", "research_design": "A difference-in-differences design exploiting the staggered timing with which firms gain access to a salary-benchmarking tool that reveals market pay by job title, estimated on national payroll data. Treated firms (which adopt the tool) are compared to not-yet-treated firms, with outcomes measured as within-firm salary dispersion and pay relative to market benchmarks by O*NET job code. The unit of analysis is the firm (and job title within firm) over time; the identifying variation is the change in information availability at adoption.", "categories": ["Labor Economics", "Personnel Economics", "Wage Inequality"], "shock": {"name": "Rollout of a salary-benchmarking tool", "type": "Staggered access / quasi-experiment", "what": "Firms gaining access to a compensation tool that reveals market salary benchmarks by job title, used in a difference-in-differences design as a quasi-exogenous shock to the wage information available to employers."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Review of Economic Studies - 2026 - Cullen et al. - What's My Employee Worth The Effects of Salary Benchmarking.pdf", "datasets": ["Compensation-software provider (national payroll)"]}, {"std_name": "Review of Economic Studies - 2026 - Dempsey - Capital Requirements with Non-Bank Finance", "journal": "Review of Economic Studies", "year": 2026, "title": "Capital Requirements with Non-Bank Finance", "authors": ["Dempsey"], "summary": "This paper quantitatively analyzes the macroeconomic effects of raising bank capital requirements in a model where heterogeneous firms can choose between intermediated (bank) and direct (bond-market) finance. Banks compete with each other and with the bond market, fund loans with insured deposits and costly equity subject to a minimum capital ratio, and monitor borrowers. Tighter capital requirements reduce costly bank failures but, because firms can substitute toward direct finance, have only small effects on aggregate lending and output. The availability of non-bank finance thus dampens the real costs of higher capital requirements. The paper shows that ignoring the bank–bond substitution margin overstates the output cost of bank regulation.", "logical_flow": "The paper starts from the policy debate over how costly higher bank capital requirements are for the real economy, noting that standard analyses often hold fixed the set of firms that borrow from banks. It builds a quantitative general-equilibrium model in which heterogeneous firms endogenously choose between bank loans and bond-market finance, and in which banks fund themselves with insured deposits and costly equity and must satisfy a capital requirement. Because firms can substitute toward direct finance when bank credit becomes more expensive, the model creates a margin absent from bank-only frameworks. Raising the capital requirement makes bank funding costlier and reduces bank lending, but much of the affected borrowing migrates to the bond market rather than disappearing, so aggregate lending and output fall only modestly. At the same time, higher capital buffers reduce the incidence of costly bank failures, generating a stability benefit. Weighing these forces, the model implies that accounting for non-bank finance substantially lowers the estimated output cost of tighter capital requirements relative to bank-only models.", "research_design": "A quantitative (structurally calibrated) general-equilibrium model with heterogeneous firms that endogenously choose between bank and bond finance and heterogeneous banks subject to capital requirements, deposit funding, and costly equity. The model is calibrated to standard macro-financial targets and used for counterfactual experiments that raise capital requirements and trace the effects on bank failures, the bank–bond financing mix, aggregate lending, and output. There is no external natural experiment; identification of the mechanism comes from the model's structure and the endogenous financing-choice margin.", "categories": ["Banking", "Macro-Finance", "Financial Regulation"], "shock": null, "missing_notes": "Quantitative model calibrated to standard aggregates; no distinctive datasets.", "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Review of Economic Studies - 2026 - Dempsey - Capital Requirements with Non-Bank Finance.pdf", "datasets": []}, {"std_name": "Quarterly Journal of Economics - 2026 - Bostanci and Ordoñez - Business, Liquidity, and Information Cycles", "journal": "Quarterly Journal of Economics", "year": 2026, "title": "Business, Liquidity, and Information Cycles", "authors": ["Bostanci", "Ordoñez"], "summary": "This paper studies the dual role of stock markets as both a source of information about firm fundamentals and a source of liquidity, and shows these roles interact. When stocks are used more intensively for liquidity, their prices reveal less information about fundamentals, worsening resource allocation. The authors structurally estimate stock price informativeness for several countries and document that it declines when alternative liquidity sources contract and stocks are used more for liquidity. They embed this mechanism in a model linking business, liquidity, and information cycles. The framework connects financial-market liquidity conditions to the real economy through the informativeness of prices.", "logical_flow": "The paper begins by noting that stock markets serve two functions economists usually study separately: they aggregate information that guides real investment, and they provide liquid assets that agents can trade when they need cash. The authors argue these functions are in tension, because trading motivated by liquidity needs is uninformed and, when it grows, dilutes the information content of prices. They formalize a setting in which the intensity of liquidity-motivated trading endogenously reduces how much prices reveal about fundamentals, so liquidity and information become linked. To take this to data, they structurally estimate price informativeness across several countries and show it falls precisely when alternative liquidity sources dry up and stocks are used more for liquidity. This co-movement supports the model's central prediction that liquidity and information cycles are connected. The paper concludes that fluctuations in market liquidity feed into the real economy by changing the informativeness of prices and hence the quality of investment decisions.", "research_design": "A theoretical model in which liquidity-motivated trading endogenously lowers stock price informativeness, combined with structural estimation of price informativeness across several countries. The structural estimates are related to measures of alternative liquidity availability to test the model's prediction that informativeness falls when stocks are used more intensively for liquidity. The analysis is cross-country and structural rather than based on a single natural experiment; the unit of analysis is the country (and firm) over time.", "categories": ["Asset Pricing & Information", "Macro-Finance", "International Finance"], "shock": null, "missing_notes": "Uses standard cross-country data (Worldscope and I/B/E/S via WRDS, plus World Bank GDP); no distinctive/nonstandard datasets identified.", "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Quarterly Journal of Economics - 2026 - Bostanci and Ordoñez - Business, Liquidity, and Information Cycles.pdf", "datasets": []}, {"std_name": "Quarterly Journal of Economics - 2026 - Cirera et al. - Technology Sophistication Across Establishments", "journal": "Quarterly Journal of Economics", "year": 2026, "title": "Technology Sophistication Across Establishments", "authors": ["Cirera", "Comin", "Cruz"], "summary": "This paper introduces a new way to measure technology sophistication by separately capturing the most advanced (MAX) and the most widely used (MOST) technologies in key business functions within establishments. Using a survey of over 21,000 establishments across 15 countries, the authors find that firms generally underutilize the most sophisticated technologies they have available. These MAX–MOST gaps are large and persistent and are strongly associated with lower productivity. The paper shows that raising the intensity of use of already-available advanced technologies is an important and underappreciated margin of technology adoption. It reframes the adoption problem as one of use, not just acquisition.", "logical_flow": "The paper argues that standard measures of technology adoption—whether a firm has a technology—miss a crucial distinction between having an advanced technology and actually using it widely. To capture this, the authors design a measurement approach that records, for each key business function, both the most sophisticated technology an establishment can access (MAX) and the technology it uses most intensively (MOST). Applying this to a large multi-country establishment survey, they document that MAX typically exceeds MOST, meaning firms underuse the sophisticated technologies available to them, and that these gaps are widespread across functions and countries. They then show the gaps are persistent rather than transitory and are systematically related to lower productivity, implying the underuse is economically costly. This leads them to argue that the intensity of use of existing technologies is a distinct and important adoption margin, separate from acquiring new technologies. The paper thus shifts the policy question from helping firms obtain technology toward helping them use what they already have.", "research_design": "A measurement-and-descriptive study built on a purpose-designed survey instrument that separately elicits the most advanced (MAX) and most widely used (MOST) technologies in each business function of an establishment. Using the resulting data on 21,000+ establishments across 15 countries, the authors construct MAX–MOST gaps and relate them cross-sectionally to firm characteristics and productivity. The design's novelty is in the measurement approach itself; the analysis documents the size, persistence, and productivity correlates of the gaps rather than exploiting an external shock.", "categories": ["Technology Adoption", "Development Economics", "Firm Productivity"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Quarterly Journal of Economics - 2026 - Cirera et al. - Technology Sophistication Across Establishments.pdf", "datasets": ["World Bank — Firm-level Adoption of Technology (FAT) survey"]}, {"std_name": "Quarterly Journal of Economics - 2026 - Sangani - Complete Pass-Through in Levels", "journal": "Quarterly Journal of Economics", "year": 2026, "title": "Complete Pass-Through in Levels", "authors": ["Sangani"], "summary": "This paper revisits the long-standing finding that cost pass-through to prices is incomplete. Using microdata from gas stations, food products, and manufacturing, the author shows that incomplete pass-through measured in percentages often masks complete pass-through in levels: a one-dollar-per-unit rise in input costs raises downstream prices by about one dollar per unit. The apparent incompleteness arises because percentage measures mix together products with different markups. The paper argues that dollar-for-dollar (level) pass-through is the empirically robust regularity and derives its implications for how cost shocks propagate through supply chains. The result revises a widely used input to models of inflation and market power.", "logical_flow": "The paper starts from the robust empirical finding that pass-through of input costs to prices looks incomplete when measured in percentages, even over long horizons, which has shaped models of markups and inflation. The author points out that percentage pass-through conflates the size of a cost change with the level of a product's price and markup, so a common dollar cost increase can look like different percentage pass-through across products. Re-examining the data in levels rather than percentages, the paper finds that a one-dollar increase in per-unit input costs translates into roughly a one-dollar increase in per-unit prices—complete pass-through in levels. It documents this across very different settings (retail gasoline, packaged food, and manufacturing), suggesting the regularity is general rather than sector-specific. The paper then works through the theoretical implications, showing which demand and cost structures generate level pass-through and how this changes the transmission of cost shocks. The upshot is that the 'incomplete pass-through' puzzle largely dissolves once pass-through is measured in the right units.", "research_design": "An empirical measurement study that recomputes cost pass-through in levels (dollars per unit) rather than percentages, using price and cost microdata from three distinct settings—retail gasoline, packaged food (retail scanner data), and manufacturing (Census production data). The core comparison contrasts level and percentage pass-through estimates to show the former is complete while the latter appears incomplete because it mixes products with different markups. The analysis is descriptive and cross-sectional across products and industries, complemented by a simple model clarifying when level pass-through holds.", "categories": ["Industrial Organization & Prices", "Macroeconomics", "Applied Microeconomics"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Quarterly Journal of Economics - 2026 - Sangani - Complete Pass-Through in Levels.pdf", "datasets": ["NielsenIQ (Nielsen Consumer LLC) — Retail scanner data", "U.S. Census Bureau — Annual Survey of Manufactures / Census of Manufactures", "Retail gasoline price microdata"]}, {"std_name": "Quarterly Journal of Economics - 2026 - Acemoglu and Restrepo - Automation and Rent Dissipation Implications for Wages, Inequality, and Productivity", "journal": "Quarterly Journal of Economics", "year": 2026, "title": "Automation and Rent Dissipation: Implications for Wages, Inequality, and Productivity", "authors": ["Acemoglu", "Restrepo"], "summary": "This paper studies automation in a task-based economy where some jobs pay workers rents—wages above their outside options. The authors show that automation disproportionately targets high-rent tasks, dissipating those rents, amplifying wage losses for exposed workers, and compressing wage dispersion within exposed groups. Because dissipating rents is socially inefficient, this channel partly offsets the productivity gains automation would otherwise deliver. The framework reconciles observed wage declines and falling within-group inequality with modest aggregate productivity effects. It reframes part of automation's distributional cost as the destruction of labor rents rather than pure efficiency-enhancing substitution.", "logical_flow": "The paper begins from the task-based view of production, in which firms can automate individual tasks, and adds the realistic feature that some tasks pay workers rents above their outside options. It argues that firms have a heightened incentive to automate precisely the high-rent tasks, because doing so lets them capture the rent, so automation is not distributionally neutral but concentrated where labor was best paid. This implies that automation dissipates rents, which amplifies wage losses for exposed workers beyond the standard displacement effect and, because the highest-paid exposed workers lose the most, compresses within-group wage dispersion. The authors then show that this rent dissipation is socially inefficient: the resources spent automating to capture rents do not correspond to genuine productivity gains, so measured productivity rises less than a frictionless model would predict. The model thus links three observations—wage declines, falling within-group inequality in exposed groups, and disappointing aggregate productivity—to a single mechanism. It closes by drawing out the welfare implication that some automation is privately profitable but socially wasteful because it merely redistributes rents from workers to firms.", "research_design": "A task-based theoretical model of automation extended so that some tasks earn workers rents, solved to characterize how automation targets high-rent tasks and what that implies for wages, within-group inequality, and productivity. The predictions are illustrated with standard industry and productivity data (for example, BLS multifactor-productivity and capital-share measures) rather than a single natural experiment. The contribution is primarily conceptual: isolating rent dissipation as a distinct channel through which automation lowers wages and inequality while offsetting productivity gains.", "categories": ["Labor Economics", "Automation & Technology", "Macroeconomics"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Quarterly Journal of Economics - 2026 - Acemoglu and Restrepo - Automation and Rent Dissipation Implications for Wages, Inequality, and Productivity.pdf", "datasets": ["Bureau of Labor Statistics — Total Multifactor Productivity Tables"]}, {"std_name": "Working Paper - 2026 - Egan et al. - Who Pays for Payments", "journal": null, "year": 2026, "title": "Who Pays for Payments?", "authors": ["Egan", "Matvos", "Seru", "Wang", "Yao"], "summary": "This paper uses novel data on the composition and cost of payments across U.S. merchants to quantify redistribution in the payment system. Card interchange fees fund consumer rewards, and when merchants raise prices for everyone, users of low-cost methods like cash and debit cross-subsidize high-reward credit-card users at the same merchant. The authors show incidence actually depends on the joint distribution of payment choices across merchants, not the standard assumption that everyone shops at the same stores facing the same fees. Two forces shape redistribution: consumer sorting, where users of different payment methods shop at different merchants, limits cash and debit users' exposure to high interchange fees; and interchange fees vary across merchants, being lower where payment types overlap (e.g., large grocery stores) due to sector discounts and negotiations. Embedding these forces in a sufficient-statistics framework, the paper revises who ultimately bears payment-system costs.", "logical_flow": "The paper reconsiders the common claim that users of low-cost payment methods subsidize high-reward credit-card users, showing this conclusion rests on assumptions that fail in the data. The standard argument is that card interchange fees fund rewards, merchants raise prices for everyone to cover the fees, and so cash and debit users cross-subsidize card users at the same store. The authors point out this implicitly assumes that consumers using different payment methods shop at the same merchants and that merchants face similar fees. Using novel data on payment composition and cost across merchants, they document two forces that overturn the simple incidence. First, consumer sorting, since users of different payment methods often shop at different merchants, which limits cash and debit users' exposure to high-interchange environments. Second, interchange fees vary across merchants, and where payment types overlap, such as large grocery stores, fees are lower due to sector discounts and private negotiations. They embed these forces in a sufficient-statistics framework that makes incidence depend on the joint distribution of payment choices across merchants rather than on a single representative store. The result is a substantially revised picture of who ultimately bears payment-system costs, in which sorting and fee heterogeneity blunt the cross-subsidy the standard view predicts.", "research_design": "A sufficient-statistics incidence design estimated on proprietary merchant-acquirer data (payment composition and cost across merchants) plus consumer payment-diary data. The framework makes who bears payment costs depend on the joint distribution of payment choices across merchants, so the authors estimate the two forces that matter, how consumers using different payment methods sort across merchants and how interchange fees vary across merchants, and feed them into the incidence formulas. Identification of the revised incidence comes from measuring where different payment users actually shop together and the fees they face there; the units are the merchant and the consumer or payment method.", "categories": ["Payments", "Household Finance", "Industrial Organization"], "shock": null, "missing_notes": null, "file_path": "", "datasets": ["Fiserv", "Federal Reserve Bank of Atlanta — Diary of Consumer Payment Choice (DCPC)", "Nilson Report"]}, {"std_name": "Working Paper - 2026 - Drechsler et al. - Credit Crunches and the Great Stagflation", "journal": null, "year": 2026, "title": "Credit Crunches and the Great Stagflation", "authors": ["Drechsler", "Savov", "Schnabl"], "summary": "This paper argues that severe banking-system credit crunches helped cause the Great Stagflation of the 1970s, working through Regulation Q, which capped deposit rates. Under Reg Q, Fed tightening triggered large deposit outflows that forced banks to contract lending, and these credit crunches line up closely with stagflation over time. Adding Reg Q to a standard model where firms finance working capital with bank loans, the authors show binding caps make working capital costlier, leading firms to raise prices and cut output. This yields an augmented Phillips curve in which monetary tightening reduces aggregate supply as well as demand, with effects increasing in credit-crunch severity, external-finance dependence, and working-capital intensity. Cross-industry tests confirm that more exposed manufacturing industries raised prices and cut output relative to others.", "logical_flow": "The paper advances a novel explanation for the 1970s Great Stagflation: severe credit crunches in the banking system, operating through Regulation Q, which capped the interest rates banks could pay on deposits. The mechanism is that when the Fed tightened, market rates rose above the Reg Q ceilings, triggering large deposit outflows that forced banks to contract lending. The authors first show these credit crunches line up closely with stagflation in the time series, motivating a causal role. To explain how a credit crunch produces stagflation, they add Reg Q to a standard model in which firms need bank loans to finance working capital, so that when credit contracts, working capital becomes more expensive, leading firms to raise prices and cut output simultaneously. This yields an augmented Phillips curve in which monetary tightening reduces aggregate supply, not just demand, with the supply effect increasing in the severity of the credit crunch, firms' dependence on external finance, and their working-capital intensity. The paper then tests these three cross-sectional predictions across manufacturing industries and finds that more exposed industries raised prices and cut output relative to others, supporting the claim that under severe financial frictions monetary policy has a supply-side channel that can generate stagflation.", "research_design": "A model paired with cross-industry tests. The authors add Regulation Q deposit-rate ceilings to a working-capital model, deriving an augmented Phillips curve in which credit contractions shift aggregate supply, and generating predictions that grow with cre
