<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Chest</title>
<style>
  :root{
    --paper:#FBFAF7; --ink:#1b1a17; --muted:#6f6a60; --line:#e4ded2;
    --card:#ffffff; --accent:#2f5d50; --accent-soft:#e7efe9; --amber:#9a6a1c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:Georgia,"Iowan Old Style",serif;line-height:1.5}
  .wrap{max-width:1060px;margin:0 auto;padding:28px 22px 80px}
  header{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:6px}
  h1{font-size:30px;margin:0;letter-spacing:.3px}
  .sub{font:12px/1.4 ui-monospace,"SFMono-Regular",Menlo,monospace;
    color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin-top:6px}
  .tabs{display:flex;gap:6px;margin:18px 0 14px}
  .tab{font:12px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;
    padding:9px 14px;border:1px solid var(--line);background:var(--card);cursor:pointer;
    color:var(--muted);border-radius:2px}
  .tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  input[type=search],select{font:15px Georgia,serif;padding:9px 11px;border:1px solid var(--line);
    background:var(--card);border-radius:2px;color:var(--ink)}
  input[type=search]{flex:1;min-width:220px}
  input[type=search]:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .count{font:12px ui-monospace,Menlo,monospace;color:var(--muted);letter-spacing:.06em}
  .card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:3px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .callno{font:11px/1.5 ui-monospace,Menlo,monospace;color:var(--accent);letter-spacing:.04em;
    text-transform:uppercase;margin-bottom:6px;word-break:break-word}
  .ptitle{font-size:19px;font-weight:700;margin:0 0 4px;cursor:pointer}
  .ptitle:hover{color:var(--accent)}
  .meta{font:12px ui-monospace,Menlo,monospace;color:var(--muted);margin-bottom:8px}
  .cats{margin:8px 0 2px}
  .chip{display:inline-block;font:11px ui-monospace,Menlo,monospace;background:var(--accent-soft);
    color:var(--accent);padding:2px 8px;border-radius:20px;margin:0 6px 6px 0;letter-spacing:.03em}
  .chip.data{background:#f3ecdd;color:var(--amber)}
  .fchip{cursor:pointer;display:inline-block;font:11px ui-monospace,Menlo,monospace;
    background:var(--paper);color:var(--accent);border:1px solid var(--line);
    padding:3px 10px;border-radius:20px;margin:0 6px 6px 0;letter-spacing:.03em;user-select:none}
  .fchip:hover{border-color:var(--accent)}
  .fchip.on{background:var(--accent);color:var(--paper);border-color:var(--accent)}
  .fchip .n{opacity:.55;margin-left:6px}
  .themebar,.tagbar{margin:0 0 6px}
  .barlabel{display:inline-block;font:10px ui-monospace,Menlo,monospace;text-transform:uppercase;
    letter-spacing:.12em;color:var(--muted);margin:3px 8px 4px 0;vertical-align:middle}
  .field{margin:10px 0}
  .flabel{font:11px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.12em;
    color:var(--muted);margin-bottom:2px}
  details>summary{cursor:pointer;font:12px ui-monospace,Menlo,monospace;color:var(--accent);
    letter-spacing:.06em;list-style:none;margin-top:4px}
  details>summary::-webkit-details-marker{display:none}
  details[open]>summary{margin-bottom:8px}
  .path{font:11px ui-monospace,Menlo,monospace;color:var(--muted);word-break:break-all;margin-top:8px}
  .path a{color:var(--accent)}
  .note{font-style:italic;color:var(--amber);font-size:13px}
  .empty{color:var(--muted);text-align:center;padding:40px;font-style:italic}
  .ds .used{font:12px Georgia,serif;color:var(--muted);margin-top:6px}
  footer{margin-top:34px;border-top:1px solid var(--line);padding-top:12px;
    font:11px ui-monospace,Menlo,monospace;color:var(--muted);letter-spacing:.05em}
  @media (max-width:560px){h1{font-size:24px}}
</style></head>
<body><div class="wrap">
  <header>
    <h1>Knowledge Chest</h1>
    <div class="sub">A catalogue of what you've read &nbsp;·&nbsp; economics · finance · accounting</div>
  </header>
  <div class="tabs">
    <div class="tab on" data-tab="papers">Papers</div>
    <div class="tab" data-tab="datasets">Dataset Universe</div>
  </div>

  <section id="papers-view">
    <div class="controls">
      <input id="q" type="search" placeholder="Search title, summary, author, design, dataset…" aria-label="Search papers">
      <select id="fcat"><option value="">All categories</option></select>
      <select id="fjour"><option value="">All journals</option></select>
      <select id="fyear"><option value="">All years</option></select>
      <span class="count" id="pcount"></span>
    </div>
    <div id="papers"></div>
  </section>

  <section id="datasets-view" style="display:none">
    <div class="controls">
      <input id="dq" type="search" placeholder="Search provider, description, topic…" aria-label="Search datasets">
      <span class="count" id="dcount"></span>
    </div>
    <div id="dthemes" class="themebar"></div>
    <div id="dtags" class="tagbar"></div>
    <div id="datasets" class="ds"></div>
  </section>

  <footer>Searchable catalogue · click a title to expand its logical flow, research design, and datasets</footer>
</div>
<script>
const DB = {"papers": [{"std_name": "American Economic Review Insights - 2026 - Meyer-ter-Vehn and Board - Breaking Bad News", "journal": "American Economic Review: Insights", "year": 2026, "title": "Breaking Bad News", "authors": ["Meyer-ter-Vehn", "Board"], "summary": "This paper studies how information disclosure shapes social learning about a potentially harmful product. Increased transparency helps early agents avoid harm, but this may undermine learning by later agents who no longer observe harmful outcomes. Despite this conflict of interest, the authors show that full transparency is uniquely optimal for all agents when they learn only by observing neighbors' harm. They then investigate whether full transparency about harm continues to benefit everyone when agents also learn from additional, imperfect signals. The paper clarifies when disclosing bad news helps versus hinders collective learning.", "logical_flow": "The paper considers a setting where agents adopt a product that may be harmful and learn about its danger from others' experiences, so disclosure of harm affects social learning. It identifies a tension: making harm transparent protects early agents but can slow later agents' learning, because avoided harm generates less observable information. The authors ask whether, given this conflict, more transparency is good for everyone. When agents learn only by observing neighbors' harm, they prove full transparency is uniquely optimal for all agents, resolving the tension in favor of disclosure. They then extend the analysis to allow additional imperfect signals and examine whether full transparency about harm still benefits all agents. The paper thus delineates the conditions under which breaking bad news aids collective welfare.", "research_design": "A theoretical model of social learning about a potentially harmful product, analyzing how information disclosure (transparency about harm) affects early versus later agents. The analysis derives conditions—learning only from neighbors' harm versus also from additional imperfect signals—under which full transparency is optimal for all agents. There is no external dataset.", "categories": ["Information Economics", "Social Learning", "Financial Theory"], "shock": null, "missing_notes": "Theoretical model; no datasets.", "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/American Economic Review Insights - 2026 - Meyer-ter-Vehn and Board - Breaking Bad News.pdf", "datasets": []}, {"std_name": "American Economic Review - 2026 - Hankins et al. - Consumer Credit and the Incidence of Tariffs Evidence from the Auto Industry", "journal": "American Economic Review", "year": 2026, "title": "Consumer Credit and the Incidence of Tariffs: Evidence from the Auto Industry", "authors": ["Hankins", "Momeni", "Sovich"], "summary": "This paper examines how tariffs affecting the auto industry pass through to consumers via the credit market. Using tariffs as a shock to vehicle costs, the authors study effects on auto loans and purchases, showing how much of the tariff burden falls on consumers through financing. The setting isolates the incidence of trade policy at the point of consumer borrowing. The results reveal that consumer credit is an important channel through which tariff costs reach households. The paper connects trade policy to household finance in a concrete, high-volume market.", "logical_flow": "The paper asks who ultimately bears the cost of tariffs, focusing on a channel usually overlooked: consumer credit. It uses tariffs affecting the auto industry as a shock that raises the cost of vehicles, and studies how this propagates to auto loans and purchases. Because cars are typically financed, the credit market is where much of the tariff incidence is realized for households. The authors trace how loan terms, borrowing, and purchases respond to the tariff-driven cost increase. Finding meaningful pass-through to consumers through financing, they quantify the household incidence of the tariffs. The paper concludes that consumer credit is a key conduit through which trade-policy costs reach households, enriching the standard analysis of tariff incidence.", "research_design": "A quasi-experimental design using tariffs affecting the auto industry as a shock to vehicle costs, tracing effects on auto loans, borrowing, and purchases to measure the consumer incidence of tariffs through the credit market. The unit of analysis is the loan/consumer; identification comes from the tariff event and cross-sectional exposure.", "categories": ["Trade Policy", "Household & Consumer Credit", "Industrial Organization"], "shock": {"name": "Auto-industry tariffs", "type": "Trade policy shock", "what": "The imposition of tariffs affecting the auto industry, which raised vehicle costs, used as a shock to identify the incidence of tariffs on consumer credit and auto purchases."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/American Economic Review - 2026 - Hankins et al. - Consumer Credit and the Incidence of Tariffs Evidence from the Auto Industry.pdf", "datasets": ["Auto loan / consumer credit data", "Vehicle tariff exposure data"]}, {"std_name": "American Economic Review - 2026 - Gertler et al. - Temporary Layoffs, Loss-of-Recall, and Cyclical Unemployment Dynamics", "journal": "American Economic Review", "year": 2026, "title": "Temporary Layoffs, Loss-of-Recall, and Cyclical Unemployment Dynamics", "authors": ["Gertler", "Huckfeldt", "Trigari"], "summary": "This paper revisits the role of temporary layoffs in the business cycle. While recall hiring from temporary layoff can stabilize employment, the authors quantify an important countervailing, destabilizing force—'loss-of-recall'—whereby workers on temporary layoff end up losing their jobs permanently. They develop a quantitative model with endogenous flows across employment, temporary-layoff unemployment, and jobless unemployment. The model matches both pre- and post-pandemic unemployment dynamics, including the contractionary role of loss-of-recall. The paper shows temporary layoffs are not purely stabilizing and that loss-of-recall shapes cyclical unemployment.", "logical_flow": "The paper starts from the view that temporary layoffs can stabilize the labor market because laid-off workers are often recalled, dampening cyclical swings. It challenges this by highlighting 'loss-of-recall,' where workers expecting recall instead become permanently unemployed, which is destabilizing and countercyclical. To weigh these opposing forces, the authors build a quantitative model with endogenous worker flows among employment, temporary-layoff unemployment, and jobless unemployment. They discipline the model with data on these flows and show it reproduces unemployment dynamics both before and during the pandemic. The model reveals that loss-of-recall plays a contractionary role that offsets the stabilizing effect of recall hiring. The paper concludes that accounting for loss-of-recall is essential for understanding cyclical unemployment.", "research_design": "A quantitative macro-labor model with endogenous flows across employment, temporary-layoff unemployment, and jobless unemployment, calibrated to worker-flow data (e.g., from the Current Population Survey). The model is used to quantify the stabilizing role of recall versus the destabilizing 'loss-of-recall' and to match pre- and post-pandemic unemployment dynamics. The unit of analysis is the aggregate labor market; identification comes from matching flow moments.", "categories": ["Macroeconomics", "Labor Markets", "Business Cycles"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/American Economic Review - 2026 - Gertler et al. - Temporary Layoffs, Loss-of-Recall, and Cyclical Unemployment Dynamics.pdf", "datasets": ["Current Population Survey (CPS)"]}, {"std_name": "Review of Financial Studies - 2026 - Filipović and Wagner - The Intangibles Song in Takeover Announcements Good Tempo, Hollow Tune", "journal": "Review of Financial Studies", "year": 2026, "title": "The Intangibles Song in Takeover Announcements: Good Tempo, Hollow Tune", "authors": ["Filipović", "Wagner"], "summary": "This paper develops a word list of intangibles and applies it to takeover announcements. One standard deviation more intangible-related language ('intangibles talk') lowers the acquirer's announcement return by 0.53 percentage points and predicts worse operating performance. Yet bidder managers appear to believe in these deals, as shown by their insider trades, payment choices, and higher completion probabilities and speed. The authors conclude that takeover-announcement texts reveal important information about hard-to-measure aspects of deal quality. The paper shows that how firms talk about intangibles in deal announcements is informative—often negatively—about deal outcomes.", "logical_flow": "The paper begins from the difficulty of assessing deal quality when much of the rationale for a takeover rests on hard-to-measure intangibles. It proposes measuring 'intangibles talk' by building a word list of intangibles and applying it to the text of takeover announcements. The authors find that more intangibles language is associated with lower acquirer announcement returns and predicts worse subsequent operating performance, suggesting such talk often signals weaker deals. Interestingly, bidder managers seem to genuinely believe in these deals, as revealed by their insider trading, choice of payment, and the higher probability and speed of completion. This gap between market skepticism and managerial conviction is itself informative. The paper concludes that announcement texts, and intangibles language in particular, carry real information about deal quality that markets partly read.", "research_design": "A text-as-data design that builds an intangibles word list and applies it to takeover-announcement texts, relating 'intangibles talk' to acquirer announcement returns and future operating performance. Managerial belief is examined through insider trades, payment choices, and completion probability/speed. The unit of analysis is the deal/acquirer; identification is cross-sectional using textual intensity.", "categories": ["Mergers & Acquisitions", "Text-as-Data", "Intangibles"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Review of Financial Studies - 2026 - Filipović and Wagner - The Intangibles Song in Takeover Announcements Good Tempo, Hollow Tune.pdf", "datasets": ["Takeover announcement texts (intangibles word list)", "Insider trading filings (Form 4)"]}, {"std_name": "Review of Financial Studies - 2026 - Burkart et al. - The Structure of Leveraged Buyouts and the Free-Rider Problem", "journal": "Review of Financial Studies", "year": 2026, "title": "The Structure of Leveraged Buyouts and the Free-Rider Problem", "authors": ["Burkart", "Lee", "Petri"], "summary": "This paper studies the structure of public-firm buyouts in a model featuring both the Berle-Means problem (weak incentives) and the Grossman-Hart problem (shareholder holdout/free-riding). The authors show that bootstrapping, debt in excess of funding needs, and upfront fees to bidders are socially optimal and increase buyout premiums. These elements make LBO financing akin to a 'management contract' arranged by an outside manager who receives cash and incentives to run the firm, funded by excess debt imposed on the target. The model also rationalizes why private-equity firms collect fees from their equity partnerships. The paper offers a unified explanation for common but puzzling LBO financing features.", "logical_flow": "The paper starts from two classic frictions in taking a public firm private: shareholders lack incentives to monitor (Berle-Means) and can hold out to free-ride on a bidder's value creation (Grossman-Hart). It asks whether the peculiar financing structures seen in leveraged buyouts—bootstrapping, debt beyond funding needs, and upfront fees to bidders—can be understood as solutions to these frictions. Building a model of buyouts, it shows these features are socially optimal and raise premiums, because they help overcome holdout and align incentives. The authors reinterpret LBO financing as effectively a management contract, where an outside manager receives cash and incentives to run the firm, funded by excess debt loaded onto the target. The model further explains why PE firms extract fees from their equity partnerships. The paper concludes that seemingly extractive LBO features can be efficiency-enhancing responses to free-riding.", "research_design": "A theoretical model of public-firm leveraged buyouts incorporating the Berle-Means (incentive) and Grossman-Hart (holdout/free-rider) problems, used to show that bootstrapping, excess debt, and upfront bidder fees are socially optimal and raise premiums. There is no external dataset; the analysis is analytical and reinterprets LBO financing as a management contract.", "categories": ["Private Equity & Buyouts", "Corporate Governance", "Financial Theory"], "shock": null, "missing_notes": "Theoretical model; no datasets.", "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Review of Financial Studies - 2026 - Burkart et al. - The Structure of Leveraged Buyouts and the Free-Rider Problem.pdf", "datasets": []}, {"std_name": "Review of Financial Studies - 2026 - Mayordomo et al. - The Impact of Bank Consolidation on Credit Supply and Performance", "journal": "Review of Financial Studies", "year": 2026, "title": "The Impact of Bank Consolidation on Credit Supply and Performance", "authors": ["Mayordomo", "Pavanini", "Tarantino"], "summary": "This paper studies how bank mergers affect credit supply and bank performance, combining quasi-experimental evidence with a structural model. Reduced-form analysis shows merged banks restrict credit supply and set higher interest rates, but also reject fewer applicants and report fewer nonperforming loans. To interpret these offsetting effects, the authors estimate a structural model in which banks set both interest rates and lending standards. They find that despite relaxing lending standards, merged banks' credit performance improved because of a significant drop in screening costs. The paper shows that consolidation can raise prices yet improve screening efficiency.", "logical_flow": "The paper examines a central policy question—whether bank consolidation helps or harms borrowers—that is hard to answer because mergers change both prices and lending standards at once. It first uses a quasi-experimental design around bank mergers to document a mixed pattern: merged banks lend less and charge more, yet reject fewer applicants and have fewer nonperforming loans. Because these facts pull in different directions, a purely reduced-form reading is ambiguous. The authors therefore build a structural model in which banks jointly choose interest rates and lending standards, allowing them to separate pricing from screening. Estimating the model, they find merged banks relaxed standards but nonetheless improved credit performance thanks to lower screening costs. The paper concludes that consolidation's welfare effects hinge on efficiency gains in screening, not just on prices.", "research_design": "A two-part design pairing a quasi-experimental analysis of bank mergers with a structural model of bank credit in which banks set interest rates and lending standards. The reduced form compares merged and non-merged banks on credit supply, rates, rejections, and nonperforming loans; the structural model identifies screening costs and disentangles pricing from standards. The unit of analysis is the bank/loan, using a credit register.", "categories": ["Banking", "Credit Markets", "Industrial Organization"], "shock": {"name": "Bank mergers (consolidation events)", "type": "Quasi-experiment", "what": "Bank merger events used as quasi-experimental variation in local bank consolidation to identify effects on credit supply, pricing, and performance."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Review of Financial Studies - 2026 - Mayordomo et al. - The Impact of Bank Consolidation on Credit Supply and Performance.pdf", "datasets": ["Banco de España — Spanish Credit Register (CIRBE)"]}, {"std_name": "Review of Financial Studies - 2026 - Dávila and Parlatore - Identifying Price Informativeness", "journal": "Review of Financial Studies", "year": 2026, "title": "Identifying Price Informativeness", "authors": ["Dávila", "Parlatore"], "summary": "This paper shows how to identify and estimate price informativeness, a necessary step in testing theories of information aggregation. Starting from a pricing equation and a stochastic process for payoffs, the authors derive how to recover relative price informativeness from regressions of asset-price changes on payoff changes. Applying the method, they estimate stock-specific informativeness measures for U.S. stocks. In the cross-section, large stocks with high turnover, idiosyncratic volatility, institutional ownership, and analyst coverage are more informative. The paper provides a tractable, theory-grounded way to measure how much prices reveal about fundamentals.", "logical_flow": "The paper addresses a gap between theories of information aggregation, which hinge on how informative prices are, and the empirical difficulty of measuring price informativeness. It begins from a general pricing equation and an assumed stochastic process for payoffs, and shows analytically how informativeness maps into the relationship between price changes and payoff changes. This yields an identification result: informativeness can be recovered from regressions of asset-price changes on changes in fundamentals. The authors implement this to estimate a panel of stock-specific informativeness measures for U.S. stocks. They then characterize the cross-section, finding informativeness rises with size, turnover, idiosyncratic volatility, institutional ownership, and analyst coverage. The paper concludes by offering the method as a general tool for measuring and testing price informativeness.", "research_design": "A methodological/econometric contribution deriving identification of price informativeness from a pricing equation and payoff process, then estimating stock-specific informativeness for U.S. stocks via regressions of price changes on payoff changes. The estimates are characterized in the cross-section; the unit of analysis is the stock over time.", "categories": ["Market Efficiency & Information", "Asset Pricing", "Econometric Methods"], "shock": null, "missing_notes": "Estimated from standard U.S. stock price/payoff data; no distinctive datasets.", "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Review of Financial Studies - 2026 - Dávila and Parlatore - Identifying Price Informativeness.pdf", "datasets": []}, {"std_name": "Review of Financial Studies - 2026 - Zhong and Zhou - Dynamic Coordination and Bankruptcy Regulations", "journal": "Review of Financial Studies", "year": 2026, "title": "Dynamic Coordination and Bankruptcy Regulations", "authors": ["Zhong", "Zhou"], "summary": "This paper studies how bankruptcy regulations that restrict creditors' ability to exit a distressed firm affect coordination among creditors. Such ex post restrictions can protect coordination once distress hits, but may harm creditors' ex ante incentives to stay invested, worsening outcomes. The authors build a dynamic coordination model to show how this tension shapes creditor runs, bankruptcy filings, and the design of regulation. A striking result is that filing for bankruptcy early, preserving more assets for latecomers, can prolong firm life, and that regulators' clawbacks on pre-bankruptcy repayments can dominate firms' commitment to early filing. The paper derives implications for automatic stay and avoidance provisions.", "logical_flow": "The paper starts from the classic coordination problem among creditors of a distressed firm, where each creditor may 'run' by exiting, hastening the firm's collapse. It observes that bankruptcy regulations often restrict exit ex post to preserve value, but points out this changes creditors' ex ante incentives to remain invested in the first place. Building a dynamic coordination model, it traces how the anticipation of exit restrictions feeds back into creditor runs and the timing of bankruptcy filings. The model yields the counterintuitive result that filing early, which conserves assets for later creditors, can extend firm life by improving coordination. It further shows that regulators using clawbacks on pre-bankruptcy repayments can achieve better outcomes than relying on firms to commit to early filing. The paper then draws out design implications for automatic stay and avoidance rules.", "research_design": "A dynamic coordination (theoretical) model of creditors deciding whether to remain invested in or exit a distressed firm, used to analyze creditor runs, the timing of bankruptcy filings, and the design of bankruptcy regulations. There is no external dataset; results are analytical, with implications derived for automatic stay, clawbacks, and avoidance provisions.", "categories": ["Bankruptcy & Restructuring", "Coordination & Contract Theory", "Financial Regulation"], "shock": null, "missing_notes": "Theoretical model; no datasets.", "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Review of Financial Studies - 2026 - Zhong and Zhou - Dynamic Coordination and Bankruptcy Regulations.pdf", "datasets": []}, {"std_name": "Working Paper - 2026 - Da et al. - Presidential Cycles in PEAD", "journal": null, "year": 2026, "title": "Presidential Cycles in PEAD", "authors": ["Da", "Wang", "Zeng"], "summary": "This paper documents that post-earnings announcement drift (PEAD) follows presidential cycles: it earns about 4.1% per year during Democratic presidencies but rises to 14.9% during Republican presidencies. Survey evidence indicates greater investor underreaction to earnings news under Republican presidents. The authors argue the tax component of earnings is more volatile during Republican periods, implying larger tax-policy uncertainty that amplifies information uncertainty and investor underreaction. Consistent with this, firms reference Republican tax laws more frequently in filings. The paper links political cycles and tax-policy uncertainty to a classic asset-pricing anomaly.", "logical_flow": "The paper starts from the well-known PEAD anomaly—prices drift in the direction of earnings surprises—and asks whether its strength varies with the political cycle. Documenting that PEAD is much larger under Republican than Democratic presidents, it seeks a mechanism rather than treating the pattern as coincidence. It proposes that tax-policy uncertainty, which affects the tax component of earnings, is greater during Republican periods, making earnings news harder to interpret and amplifying underreaction. Survey evidence of stronger underreaction under Republican presidents supports the behavioral channel. Showing that the tax component of earnings is more volatile and that firms reference Republican tax laws more often reinforces the tax-uncertainty explanation. The paper concludes that political cycles, operating through tax-policy uncertainty, systematically shape the magnitude of PEAD.", "research_design": "An empirical asset-pricing design documenting variation in post-earnings announcement drift across presidential (Republican vs. Democratic) periods, combined with survey evidence on underreaction and tests of the tax-policy-uncertainty mechanism (volatility of the tax component of earnings, references to tax laws in filings). The unit of analysis is the firm-earnings announcement over time; identification is associational across political regimes.", "categories": ["Market Anomalies", "Behavioral Finance", "Political Economy & Finance"], "shock": null, "missing_notes": "Uses standard earnings and analyst (I/B/E/S) data plus survey-based expectations; no distinctive datasets identified.", "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Working Paper - 2026 - Da et al. - Presidential Cycles in PEAD.pdf", "datasets": []}, {"std_name": "Working Paper - 2026 - Ormazabal and Shi - Industry (Re)Classifications and Corporate Governance", "journal": null, "year": 2026, "title": "Industry (Re)Classifications and Corporate Governance", "authors": ["Ormazabal", "Shi"], "summary": "This paper examines whether industry classifications affect how firms select peers for executive-compensation benchmarking, using Global Industry Classification Standard (GICS) reclassifications for identification. Firms become significantly more likely to include peers whose GICS codes converge with their own and to drop peers whose codes diverge, with stronger effects when proxy advisors and passive investors provide greater oversight. The authors find no evidence of strategic peer selection. The results show that formal industry classifications shape compensation benchmarking and are disciplined by governance. The paper links classification systems to executive-pay peer selection.", "logical_flow": "The paper asks whether the industry classification a firm is assigned influences which peers it chooses for executive-pay benchmarking. Because classifications and peer choices could be jointly determined, it needs exogenous variation, which it finds in GICS reclassifications that reassign firms to different industry codes for reasons outside their compensation decisions. The authors predict that after a reclassification, firms will add peers whose codes now converge with theirs and drop peers whose codes diverge. They confirm this and show the effect is stronger where proxy advisors and passive investors exert more oversight, indicating governance disciplines the process. Finding no evidence of strategic selection, they interpret the peer changes as governance-driven rather than opportunistic. The paper concludes that formal industry classifications causally shape compensation peer selection.", "research_design": "A quasi-experimental design exploiting GICS industry reclassifications as exogenous changes in firms' industry membership, examining how firms adjust their executive-compensation peer groups (adding converging, dropping diverging peers). Heterogeneity by proxy-advisor and passive-investor oversight tests the governance channel. The unit of analysis is the firm (and peer pair); identification comes from reclassification events.", "categories": ["Executive Compensation", "Corporate Governance", "Industry Classification"], "shock": {"name": "GICS industry reclassifications", "type": "Classification change", "what": "Reassignments of firms' Global Industry Classification Standard codes, occurring for reasons outside firms' compensation decisions, used as exogenous variation in industry membership."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Working Paper - 2026 - Ormazabal and Shi - Industry (Re)Classifications and Corporate Governance.pdf", "datasets": ["GICS reclassification data (MSCI/S&P)", "Compensation peer-group disclosures"]}, {"std_name": "Working Paper - 2026 - Bernstein - The Value of Ratings Evidence from Their Introduction in Securities Markets", "journal": null, "year": 2026, "title": "The Value of Ratings: Evidence from Their Introduction in Securities Markets", "authors": ["Bernstein"], "summary": "This paper studies the first-ever ratings for corporate securities, using John Moody's 1909 publication that assigned letter grades to most listed railroad bonds. These ratings had no regulatory implications and were largely explainable from public information, isolating their pure information role. The author finds that bonds rated lower than the market implied saw rising secondary-market yields, and that rated bonds experienced a substantial decline in bid-ask spreads, consistent with reduced information asymmetry and improved liquidity. The results show ratings can improve information transmission even without regulatory force. The paper provides clean historical evidence on the value of ratings.", "logical_flow": "The paper addresses the difficulty of isolating the informational value of credit ratings, since modern ratings are entangled with regulation. It turns to a historical natural experiment: John Moody's 1909 introduction of the first letter ratings for railroad bonds, which carried no regulatory implications and drew on public information. Because the ratings had no mechanical regulatory effect, any market reaction reflects their information content. The author examines how bond yields and liquidity responded to being rated and to receiving ratings below market-implied levels. Finding that lower-than-expected ratings raised yields and that rated bonds saw narrower bid-ask spreads, the paper attributes these to reduced information asymmetry. It concludes that ratings can improve information transmission and liquidity on their own informational merits.", "research_design": "A historical natural-experiment design using John Moody's 1909 introduction of the first-ever corporate (railroad) bond ratings, which had no regulatory implications, to isolate the information value of ratings. The author compares secondary-market yields and bid-ask spreads for rated versus unrated bonds and for bonds rated below market-implied levels. The unit of analysis is the bond; identification comes from the rating introduction.", "categories": ["Credit Ratings", "Liquidity & Microstructure", "Financial History"], "shock": {"name": "1909 introduction of Moody's bond ratings", "type": "Historical natural experiment", "what": "John Moody's 1909 publication of the first-ever letter ratings for railroad bonds, which had no regulatory implications, used as a natural experiment isolating the information value of ratings."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Working Paper - 2026 - Bernstein - The Value of Ratings Evidence from Their Introduction in Securities Markets.pdf", "datasets": ["Moody's (1909) — First-ever railroad bond ratings", "Historical railroad bond prices/yields"]}, {"std_name": "Journal of Accounting Research - 2026 - Billings et al. - Incidence, Risk, and Disclosure of Corporate Litigation Insights from Federal Court Filings", "journal": "Journal of Accounting Research", "year": 2026, "title": "Incidence, Risk, and Disclosure of Corporate Litigation: Insights from Federal Court Filings", "authors": ["Billings", "Holthausen", "Petrovits", "Wang"], "summary": "This paper assembles and describes a comprehensive sample of 174,782 lawsuits filed against 218,437 public-company defendants in U.S. federal district court from 2006 to 2021. The suits span product liability, civil-rights discrimination, contract breaches, labor practices, antitrust, corruption, securities violations, pollution, and IP infringement. The sample shows rich variation across firms, industries, time, suit types, plaintiffs, and outcomes. The authors use it to characterize the incidence, risk, and disclosure of corporate litigation. The paper provides a broad, systematic picture of public firms' exposure to federal litigation.", "logical_flow": "The paper is motivated by the fact that research on corporate litigation often focuses narrowly on securities class actions, missing the full breadth of lawsuits firms face. To address this, the authors build a large sample of federal district court filings against public companies over 2006-2021, covering many allegation types. They document the sample's rich variation across firms, industries, suit types, plaintiffs, and outcomes, establishing basic facts about corporate litigation. They then examine the incidence and risk of litigation across firms and how firms disclose it. The descriptive breadth allows comparisons that narrower samples cannot support. The paper concludes by providing a systematic, comprehensive characterization of public firms' federal-litigation exposure and its disclosure.", "research_design": "A descriptive, data-construction study assembling 174,782 federal district court lawsuits against 218,437 public-company defendants (2006-2021) and characterizing the incidence, risk, and disclosure of corporate litigation across firms, industries, suit types, and outcomes. The unit of analysis is the lawsuit/firm; the contribution is comprehensive measurement rather than a single identification strategy.", "categories": ["Corporate Litigation", "Disclosure", "Law and Finance"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Accounting Research - 2026 - Billings et al. - Incidence, Risk, and Disclosure of Corporate Litigation Insights from Federal Court Filings.pdf", "datasets": ["U.S. federal district court filings (PACER)"]}, {"std_name": "Journal of Accounting Research - 2026 - Armstrong et al. - The Assignment of Intellectual Property Rights and Innovation", "journal": "Journal of Accounting Research", "year": 2026, "title": "The Assignment of Intellectual Property Rights and Innovation", "authors": ["Armstrong", "Glaeser", "Park"], "summary": "This paper studies how the assignment of intellectual-property rights between inventors and their employers affects innovation. Incomplete-contracting theory predicts that stronger employer property rights reduce the threat that employee inventors hold up their employers, affecting inventor and invention outcomes. The authors test this using a U.S. appellate court ruling that shifted the assignment of patent rights from inventors to employers. Within-employer-year analyses show affected inventors are less likely to retain patent rights or assign patents to new employers. The paper provides causal evidence on how IP-rights allocation shapes innovation.", "logical_flow": "The paper draws on incomplete-contracting theory, which holds that who owns the rights to an invention affects bargaining and hold-up between inventors and employers, and thus innovation. It predicts that strengthening employer property rights reduces inventors' ability to hold up employers, changing inventor mobility and invention outcomes. To test this causally, the authors exploit a U.S. appellate court ruling that shifted the default assignment of patent rights from inventors toward employers, providing an exogenous change in property rights. Using within-employer-year comparisons, they examine how affected inventors' retention and reassignment of patents change. Finding affected inventors less able to retain or move patents, they confirm the theory's predictions. The paper concludes that the legal allocation of IP rights materially shapes inventor behavior and innovation.", "research_design": "A natural-experiment design exploiting a U.S. appellate court ruling that shifted the default assignment of patent rights from employee inventors to employers, with within-employer-year comparisons of affected versus unaffected inventors. Outcomes include inventors' retention of patent rights and reassignment to new employers. The unit of analysis is the inventor (within employer-year); identification comes from the court ruling.", "categories": ["Intellectual Property", "Innovation", "Law and Finance"], "shock": {"name": "U.S. appellate court ruling on IP-rights assignment", "type": "Court decision", "what": "An appellate court ruling that shifted the default assignment of patent rights from employee inventors to their employers, used as a natural experiment on employer property rights."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Accounting Research - 2026 - Armstrong et al. - The Assignment of Intellectual Property Rights and Innovation.pdf", "datasets": ["USPTO patent and inventor data"]}, {"std_name": "Journal of Accounting Research - 2026 - Liu et al. - Strategic (Inconsistent) Disclosures and Sophisticated Investors Evidence from Hedge Funds", "journal": "Journal of Accounting Research", "year": 2026, "title": "Strategic (Inconsistent) Disclosures and Sophisticated Investors: Evidence from Hedge Funds", "authors": ["Liu", "Madsen", "Zhou"], "summary": "This paper studies strategic, inconsistent disclosures by hedge-fund advisers. The authors find that 40% of these disclosures omit or de-emphasize information about advisers' operational and investment risks relative to other public sources. Funds with such inconsistencies subsequently deliver predictably lower performance, yet do not differ in fund flows, the flow-performance relation, ownership structure, or management. The results suggest even sophisticated investors do not fully penalize inconsistent disclosure. The paper documents strategic disclosure in a setting with ostensibly sophisticated investors.", "logical_flow": "The paper examines whether hedge-fund advisers strategically shade their disclosures, comparing what they tell investors against other public information about their risks. It finds a large share of disclosures omit or downplay operational and investment risks, indicating strategic inconsistency. The authors then ask whether these inconsistencies are informative about outcomes, and find funds with inconsistent disclosures earn predictably lower returns. Strikingly, investors do not appear to react—flows, the flow-performance relation, ownership, and management look similar—suggesting the inconsistency is not fully priced. This is notable because hedge-fund investors are typically considered sophisticated. The paper concludes that strategic disclosure persists and is under-penalized even among sophisticated investors.", "research_design": "An empirical design comparing hedge-fund advisers' disclosures (from regulatory filings) against other public information to flag 'inconsistent' disclosures, then relating inconsistency to future fund performance and to investor responses (flows, flow-performance, ownership). The unit of analysis is the fund/adviser; identification is cross-sectional.", "categories": ["Disclosure & Hedge Funds", "Investor Sophistication", "Financial Reporting"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Accounting Research - 2026 - Liu et al. - Strategic (Inconsistent) Disclosures and Sophisticated Investors Evidence from Hedge Funds.pdf", "datasets": ["SEC Form ADV (hedge-fund adviser filings)"]}, {"std_name": "Journal of Accounting Research - 2026 - Gao and Lu - Aggregated Compensation Peer Group Disclosure and Managerial Labor Market Competition A Network Analysis", "journal": "Journal of Accounting Research", "year": 2026, "title": "Aggregated Compensation Peer Group Disclosure and Managerial Labor Market Competition: A Network Analysis", "authors": ["Gao", "Lu"], "summary": "This paper uses network analysis of firms' disclosed compensation peer groups to study managerial labor-market competition. By aggregating peer-group disclosures across firms, the authors map the network of which firms benchmark against which, and use its structure to characterize competition for executive talent. The analysis links a firm's position in the peer network to compensation and labor-market outcomes. The paper shows that compensation peer-group disclosures, taken together, reveal the structure of the managerial labor market. It provides a network-based lens on executive-pay benchmarking.", "logical_flow": "The paper starts from the fact that firms disclose the peer groups they use to benchmark executive pay, and argues these disclosures, aggregated across firms, form a network revealing labor-market linkages. It constructs this network by connecting firms that name each other (or common peers) in compensation benchmarking. It then uses network structure—centrality, clustering, and connections—to characterize competition for executive talent. Relating network position to pay and outcomes shows that where a firm sits in the network matters for compensation. The authors interpret the network as a map of managerial labor-market competition that individual disclosures cannot reveal in isolation. The paper concludes that aggregated peer-group disclosures are informative about the structure of the executive labor market.", "research_design": "A network-analysis design that aggregates firms' disclosed compensation peer groups into a network and relates network structure and firm position to compensation and labor-market outcomes. The unit of analysis is the firm within the peer network; identification is descriptive/associational from network structure.", "categories": ["Executive Compensation", "Peer Benchmarking", "Networks"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Accounting Research - 2026 - Gao and Lu - Aggregated Compensation Peer Group Disclosure and Managerial Labor Market Competition A Network A.pdf", "datasets": ["Compensation peer-group disclosures (SEC proxy filings)"]}, {"std_name": "Journal of Accounting Research - 2026 - Ferrell et al. - Corporate Litigation, Governance, and the Role of Law Firms", "journal": "Journal of Accounting Research", "year": 2026, "title": "Corporate Litigation, Governance, and the Role of Law Firms", "authors": ["Ferrell", "Manconi", "Neretina", "Powley", "Renneboog"], "summary": "This paper studies plaintiff law firms in corporate litigation, focusing on 'star' firms that dominate settlement outcomes. Star firms are associated with larger settlements, but much of this is predicted by the defendant's litigation-insurance coverage, suggesting assortative matching of stars with lawsuits that have larger expected payoffs. Stars also charge higher fees for a given settlement size. Additional tests suggest visibility and information asymmetry toward less sophisticated plaintiffs sustain the stars' market position. The paper illuminates how the market for plaintiff legal services shapes corporate-litigation outcomes.", "logical_flow": "The paper focuses on plaintiff law firms as key but understudied players in corporate litigation, asking why a few 'star' firms dominate. It first documents that star firms obtain larger settlements, which could reflect skill or selection. To distinguish these, it shows much of the star-settlement relation is explained by the defendant's litigation-insurance coverage, implying stars match with cases that already have larger expected payoffs. This points to assortative matching rather than pure skill. The authors then show stars charge higher fees for a given settlement, indicating market power. Tests on visibility and information asymmetry toward less sophisticated plaintiffs suggest how stars sustain that power. The paper concludes that the structure of the plaintiff-lawyer market, including matching and information frictions, shapes litigation outcomes.", "research_design": "An empirical study of plaintiff law firms in corporate litigation, relating 'star' firm involvement to settlement size, fees, and defendant litigation-insurance coverage to separate skill from assortative matching. Additional tests examine visibility and plaintiff sophistication as sources of star firms' market power. The unit of analysis is the lawsuit/law-firm.", "categories": ["Corporate Litigation", "Governance", "Legal Services"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Accounting Research - 2026 - Ferrell et al. - Corporate Litigation, Governance, and the Role of Law Firms.pdf", "datasets": ["Corporate litigation and settlement data"]}, {"std_name": "Journal of Accounting Research - 2026 - Ferracuti and Lind - Macroeconomic Information Acquisition Around Earnings Clusters", "journal": "Journal of Accounting Research", "year": 2026, "title": "Macroeconomic Information Acquisition Around Earnings Clusters", "authors": ["Ferracuti", "Lind"], "summary": "This paper shows that investors gather more macroeconomic information during earnings clusters—periods when many firms report earnings. This behavior is amplified during negative economic shocks and when macroeconomic announcements occur concurrently. The authors show these information-acquisition patterns have implications for equity valuations. The evidence suggests that clustered earnings news prompts investors to update their macro views, not just firm-specific ones. The paper links the timing of earnings news to macroeconomic learning and asset prices.", "logical_flow": "The paper starts from the idea that earnings announcements convey not only firm-specific but also macroeconomic information, especially when many firms report at once. It hypothesizes that during earnings clusters investors have more incentive to acquire macroeconomic information, because clustered reports are informative about the aggregate economy. Using proxies for information acquisition, the authors show macro information gathering rises during earnings clusters. They further show this rises more during negative economic shocks and alongside macroeconomic announcements, when aggregate uncertainty is higher. They then connect these acquisition patterns to equity valuations, indicating the learning affects prices. The paper concludes that clustered earnings news is a trigger for macroeconomic learning with asset-pricing consequences.", "research_design": "An empirical design relating measures of investor information acquisition (e.g., access to macro-relevant information) to the timing of earnings clusters, with amplification during negative economic shocks and concurrent macroeconomic announcements, and links to equity valuations. The unit of analysis is the time period/firm; identification relies on variation in earnings clustering and macro conditions.", "categories": ["Information Acquisition", "Macroeconomic Information", "Capital Markets"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Accounting Research - 2026 - Ferracuti and Lind - Macroeconomic Information Acquisition Around Earnings Clusters.pdf", "datasets": ["SEC EDGAR log files", "RavenPack"]}, {"std_name": "Journal of Accounting Research - 2026 - Caskey et al. - Amendment Thresholds and Voting Rules in Debt Contracts", "journal": "Journal of Accounting Research", "year": 2026, "title": "Amendment Thresholds and Voting Rules in Debt Contracts", "authors": ["Caskey", "Huang", "Saavedra"], "summary": "This paper studies the optimal voting rule that lets lenders waive a covenant violation. When lenders have heterogeneous preferences, lenient voting rules raise the chance of waivers that permit inefficient investment, while stringent rules can allocate the pivotal vote to lenders who deny waivers after false alarms in order to renegotiate and extract value, incurring deadweight costs. The optimal rule balances these forces to improve contracting efficiency. The authors derive comparative statics on how the optimal voting rule varies with contract and firm characteristics and test them empirically. The paper explains why debt contracts use the amendment thresholds and voting rules they do.", "logical_flow": "The paper begins from the observation that debt contracts specify voting rules governing how lenders can waive covenant violations, and asks what makes a voting rule optimal. It sets up a model with lenders who have heterogeneous preferences over waiving, so the choice of threshold determines whose vote is pivotal. Lenient rules make waivers easy but risk approving inefficient investments; stringent rules can hand the marginal vote to holdout lenders who deny waivers to renegotiate and extract value, which is costly. The optimal rule trades off these two inefficiencies. The authors derive comparative statics predicting how the optimal threshold shifts with contract and firm characteristics. They then test these predictions in data on debt-contract voting provisions, linking theory to observed contract design.", "research_design": "A contract-theory model of lender voting rules for covenant waivers, yielding comparative statics that are then tested empirically on debt-contract provisions. The model characterizes the optimal amendment threshold as a balance between approving inefficient investment and enabling value-extracting renegotiation; the empirical tests relate observed voting rules to firm and contract characteristics. The unit of analysis is the debt contract.", "categories": ["Debt Contracts & Covenants", "Contract Theory", "Corporate Finance"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Accounting Research - 2026 - Caskey et al. - Amendment Thresholds and Voting Rules in Debt Contracts.pdf", "datasets": ["Debt-contract voting/amendment provisions (EDGAR)"]}, {"std_name": "Journal of Accounting Research - 2026 - Boulland et al. - Company Websites A New Measure of Disclosure", "journal": "Journal of Accounting Research", "year": 2026, "title": "Company Websites: A New Measure of Disclosure", "authors": ["Boulland", "Bourveau", "Breuer"], "summary": "This paper proposes a new measure of firms' disclosure based on the content of their company websites, which are widely available and information-rich. Using historical website data for U.S. public firms, the authors construct the measure, validate it against existing disclosure and information-asymmetry proxies, and study its determinants. They then apply it to settings where standard measures are unavailable—U.S. private firms and French firms' compliance with a nonfinancial disclosure mandate. The applications show the website-based measure captures disclosure where other data cannot. The paper offers a broadly applicable, low-cost measure of corporate disclosure.", "logical_flow": "The paper notes that existing disclosure measures rely on filings or databases that are unavailable for many firms, such as private companies, limiting research. It proposes that company websites, which nearly all firms maintain, contain rich disclosure that can be measured from archived web data. The authors build the measure from historical website snapshots and validate it by showing it correlates with established disclosure and information-asymmetry proxies for public firms. Having established credibility, they apply it where standard data are missing—characterizing U.S. private firms' disclosure and testing French firms' compliance with a nonfinancial disclosure mandate. These applications demonstrate the measure's reach. The paper concludes that website content is a practical, general source for measuring disclosure across firm types and jurisdictions.", "research_design": "A measurement paper that constructs a website-based disclosure metric from archived (historical) website data for U.S. public firms, validates it against existing disclosure and information-asymmetry measures, and applies it to U.S. private firms and to French firms subject to a nonfinancial disclosure mandate. The unit of analysis is the firm; validation is cross-sectional, and the French application uses the mandate as a setting.", "categories": ["Disclosure Measurement", "Text & Web Data", "Financial Reporting"], "shock": {"name": "French nonfinancial disclosure mandate", "type": "Disclosure regulation", "what": "A French mandate requiring firms to provide nonfinancial disclosure, used as a setting to validate the website-based measure through firms' compliance."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Accounting Research - 2026 - Boulland et al. - Company Websites A New Measure of Disclosure.pdf", "datasets": ["Internet Archive — Historical website (Wayback) data", "French nonfinancial disclosure filings"]}, {"std_name": "Journal of Accounting and Economics - 2026 - Guay et al. - Internal information quality and performance metric selection", "journal": "Journal of Accounting and Economics", "year": 2026, "title": "Internal information quality and performance metric selection", "authors": ["Guay", "Kim", "Timmermans"], "summary": "This paper examines how firms' internal information quality (IIQ) shapes the design of executive incentive contracts. Higher IIQ is associated with using more performance metrics and with greater dissimilarity from peers' contracts, especially along non-financial dimensions. These relations hold using changes in IIQ likely induced by plausibly exogenous shifts in two financial accounting standards. Incorporating more numerous and more dissimilar non-financial metrics is positively associated with future profitability, but only when IIQ is high. The paper links the quality of firms' internal information to how they structure managerial incentives and to the payoff from doing so.", "logical_flow": "The paper argues that designing executive incentives around multiple, tailored performance metrics requires firms to have high-quality internal information to measure those metrics reliably. It hypothesizes that firms with better internal information quality will use more performance metrics and design contracts that differ more from peers', particularly on harder-to-measure non-financial dimensions. Because IIQ is endogenous, the authors use changes induced by plausibly exogenous shifts in two financial accounting standards to sharpen identification. They then relate IIQ to the number and dissimilarity of performance metrics in executive contracts. They further test whether these design choices pay off, finding that more numerous and dissimilar non-financial metrics are associated with higher future profitability only when IIQ is high. The paper concludes that internal information quality is a key determinant of, and complement to, sophisticated incentive-contract design.", "research_design": "An empirical design relating firms' internal information quality to executive performance-metric choices, using changes in information quality induced by two plausibly exogenous accounting-standard changes for identification. Outcomes include the number and peer-dissimilarity of performance metrics and their association with future profitability; the unit of analysis is the firm. Identification leans on the standard-change-induced shifts in information quality.", "categories": ["Executive Compensation", "Internal Information Quality", "Corporate Governance"], "shock": {"name": "Two financial accounting standard changes", "type": "Accounting-standard changes", "what": "Plausibly exogenous shifts in two financial accounting standards that changed firms' internal information quality, used to identify the effect of information quality on executive performance-metric design."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Accounting and Economics - 2026 - Guay et al. - Internal information quality and performance metric selection.pdf", "datasets": ["ISS Incentive Lab — Executive incentive-plan data"]}, {"std_name": "Journal of Accounting and Economics - 2026 - Liu - Website cookies and voluntary disclosure", "journal": "Journal of Accounting and Economics", "year": 2026, "title": "Website cookies and voluntary disclosure", "authors": ["Liu"], "summary": "This paper uses website cookie information from U.S. firms' websites to measure the consumer data firms collect and examines how such data affect their accounting information environments. Cookies provide granular, real-time consumer data that can improve the quality of firms' internal information for external reporting. Firms with more cookies issue management sales forecasts more frequently and devote more of their 10-K disclosures to customer, marketing, and product topics. The effects are stronger when cookie-collected data are more relevant to the firm. The paper links a novel, technology-based measure of consumer-data collection to firms' disclosure behavior.", "logical_flow": "The paper starts from the idea that firms increasingly collect granular consumer data online, and that such data may improve the internal information managers use for external reporting. It proposes website cookies as a measurable proxy for the intensity of consumer-data collection, since cookies capture real-time behavior of a firm's website visitors. The author reasons that firms with richer cookie-based data have better internal information about demand and customers, which should show up in more frequent and more customer-oriented disclosure. Measuring cookies across U.S. firms' websites, the paper relates cookie intensity to the frequency of management sales forecasts and to the content of 10-K filings. It finds firms with more cookies forecast sales more often and devote more disclosure to customer, marketing, and product topics, with stronger effects where the data are more relevant. The paper concludes that consumer-data collection technology shapes firms' voluntary disclosure and information environment.", "research_design": "An empirical design using website cookie data as a proxy for firms' consumer-data collection, related to disclosure outcomes (management forecast frequency and 10-K content). Cross-sectional and within-firm variation in cookie intensity is linked to disclosure behavior, with heterogeneity by data relevance; the unit of analysis is the firm. The novelty is the cookie-based measure of internal information inputs.", "categories": ["Voluntary Disclosure", "Data & Technology", "Information Environment"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Accounting and Economics - 2026 - Liu - Website cookies and voluntary disclosure.pdf", "datasets": ["Website cookie / web-tracking data"]}, {"std_name": "Journal of Accounting and Economics - 2026 - Huber et al. - Information flows in trading networks", "journal": "Journal of Accounting and Economics", "year": 2026, "title": "Information flows in trading networks", "authors": ["Huber", "Watts", "Zhu"], "summary": "This paper studies the informational value of trading networks in over-the-counter markets using transaction-level corporate bond data. Investors with larger dealer networks make superior trading decisions before changes in credit fundamentals, earning better risk-adjusted performance. The authors trace this outperformance to trading connections where dealers are most likely to have access to novel credit-relevant information, supporting an interpretation of private information flowing through networks. The results show that whom an investor trades with, not just what they trade, carries information. The paper provides evidence on how information diffuses through OTC market structure.", "logical_flow": "The paper begins from the feature of OTC markets that trades occur through dealers, so an investor's set of dealer relationships forms a network through which information can travel. It asks whether investors with more or better-connected dealer networks obtain an informational advantage. Using detailed transaction-level bond data that reveal who trades with whom, the authors measure investors' dealer networks and their trading performance around changes in credit fundamentals. They hypothesize that investors with larger networks—especially connections to dealers likely to see novel credit information—should trade profitably ahead of fundamental changes. The data show these investors do make superior, better-risk-adjusted trades before credit news, and the advantage is concentrated in information-rich connections. The paper concludes that trading networks are conduits for private information in OTC markets.", "research_design": "An empirical network design using transaction-level corporate bond data (with dealer identities) to construct investors' dealer networks and relate network size/position to trading performance around credit-fundamental changes. The analysis links network characteristics to risk-adjusted returns and isolates information-rich connections; the unit of analysis is the investor (and trade). Identification of information flows comes from performance concentrated in connections where dealers likely hold novel information.", "categories": ["Market Microstructure", "Information & Networks", "Fixed Income"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Accounting and Economics - 2026 - Huber et al. - Information flows in trading networks.pdf", "datasets": ["FINRA — TRACE (enhanced, with dealer identifiers)"]}, {"std_name": "Journal of Accounting and Economics - 2026 - Hanlon et al. - Taxes and Competition Evidence from the airline industry", "journal": "Journal of Accounting and Economics", "year": 2026, "title": "Taxes and Competition: Evidence from the airline industry", "authors": ["Hanlon", "Shroff", "Yoon"], "summary": "This paper examines whether corporate tax cuts alter product-market competition by differentially affecting firms with high versus low tax burdens. Because tax cuts raise after-tax cash flows for profitable firms but do little for loss-making firms, they can shift competitive positions. Studying the 1986 Tax Reform Act, which cut the top corporate rate by 12 percentage points, and route-level price and quantity data from U.S. airlines, the authors find that profitable airlines cut ticket prices by 4.2% relative to loss-making rivals and gain 3.3 percentage points of market share. The results show taxes affect not only firm value but also competitive dynamics. The paper documents a competition channel of corporate taxation.", "logical_flow": "The paper argues that corporate taxes may reshape competition because a tax cut benefits profitable firms—who owe taxes—far more than loss-making firms, changing the two groups' relative cost positions. It uses the 1986 Tax Reform Act as a large, discrete cut in the top corporate tax rate, generating a differential shock across profitable and loss-making firms. The airline industry provides an ideal testing ground because route-level prices and quantities are observable, allowing precise measurement of competitive responses. The authors predict that after the Act, profitable airlines will use their improved after-tax cash flows to cut prices and gain share relative to loss-making rivals. The data confirm this: profitable airlines lower fares by 4.2% and gain 3.3 percentage points of market share relative to loss makers. The paper concludes that corporate taxation has real competitive consequences beyond its direct effect on firm value.", "research_design": "A difference-in-differences design using the 1986 Tax Reform Act as a differential shock to profitable versus loss-making firms, applied to route-level price and quantity data from the U.S. airline industry. Profitable airlines (which benefit from the rate cut) are compared to loss-making rivals on prices and market share around the reform; the unit of analysis is the airline-route. Identification comes from the differential tax impact across firms.", "categories": ["Taxation", "Industrial Organization", "Competition"], "shock": {"name": "Tax Reform Act of 1986", "type": "Tax reform", "what": "The 1986 Tax Reform Act, which cut the top corporate tax rate by about 12 percentage points, benefiting profitable firms much more than loss-making ones and used to study competition between differentially taxed airlines."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Accounting and Economics - 2026 - Hanlon et al. - Taxes and Competition Evidence from the airline industry.pdf", "datasets": ["U.S. Department of Transportation — DB1B (Airline Origin and Destination Survey)"]}, {"std_name": "Journal of Accounting and Economics - 2026 - Weber et al. - SEC scrutiny and corporate risk-taking", "journal": "Journal of Accounting and Economics", "year": 2026, "title": "SEC scrutiny and corporate risk-taking", "authors": ["Weber", "Xu", "Zhang"], "summary": "This paper examines whether heightened SEC scrutiny of financial reporting affects corporate risk-taking. Tighter oversight could raise risk-taking by strengthening accounting's governance role, or reduce it by constraining managers' ability to shield themselves through earnings management. Using the SEC's 2007 elevation of six district offices to regional status—which expanded their authority and enforcement resources—in a difference-in-differences design, the authors identify the effect on firms in the affected jurisdictions. The results speak to how regulatory monitoring shapes managerial risk choices. The paper connects the geography of SEC enforcement to real corporate decisions.", "logical_flow": "The paper poses a genuinely two-sided question: because managers are risk-averse and can hide poor outcomes through earnings management, stronger SEC oversight might either encourage risk-taking (by improving governance and reducing the payoff to concealment) or discourage it (by limiting managers' ability to manage earnings and thus their willingness to take risks). To adjudicate, it needs exogenous variation in scrutiny, which it finds in the SEC's 2007 reorganization that elevated six district offices to regional level, expanding their enforcement reach. Firms headquartered in the newly elevated offices' jurisdictions become treated, while others serve as controls. The authors compare risk-taking outcomes for treated versus control firms around the reorganization in a difference-in-differences framework. The estimated effect reveals which force dominates in practice. The paper interprets the result as evidence on how the intensity and reach of regulatory monitoring shapes corporate risk-taking.", "research_design": "A difference-in-differences design exploiting the SEC's 2007 elevation of six district offices to regional status, which expanded their authority and enforcement resources, as a shock to local SEC scrutiny. Firms in the elevated offices' jurisdictions are treated and compared to firms elsewhere; outcomes are measures of corporate risk-taking. The unit of analysis is the firm; identification comes from the office reorganization's geographic variation.", "categories": ["Financial Regulation", "Corporate Risk-Taking", "Enforcement"], "shock": {"name": "2007 SEC elevation of six district offices to regional status", "type": "Regulatory reorganization", "what": "A 2007 SEC reorganization that raised six district offices to regional level, expanding their authority and enforcement resources, used as a difference-in-differences shock to local financial-reporting scrutiny."}, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Accounting and Economics - 2026 - Weber et al. - SEC scrutiny and corporate risk-taking.pdf", "datasets": ["SEC — Office jurisdictions / enforcement geography"]}, {"std_name": "Journal of Accounting and Economics - 2026 - Kim and Valentine - Earnings targets, strategic patent sales, and patent trolls", "journal": "Journal of Accounting and Economics", "year": 2026, "title": "Earnings targets, strategic patent sales, and patent trolls", "authors": ["Kim", "Valentine"], "summary": "This paper shows that innovative public firms sell significantly more patents in the last month of their fiscal year than earlier, consistent with reporting incentives driving these sales. Final-month sales are disproportionately internally generated, non-core patents with high potential accounting gains, and are more pronounced among firms with incentives to meet earnings expectations—especially when firms narrowly beat expectations and when executive incentives dominate. Managers also increase insider equity sales following these strategic patent sales. The paper documents earnings-motivated asset sales in the specific context of patents, some of which flow to patent-assertion entities. It links financial-reporting incentives to real decisions about intellectual property.", "logical_flow": "The paper begins from the observation that firms can realize accounting gains by selling assets, and asks whether earnings incentives drive the timing and composition of patent sales. It documents a sharp increase in patent sales in the final month of the fiscal year, a pattern hard to reconcile with pure operating motives but consistent with meeting reporting targets. Examining which patents are sold, it finds they are disproportionately internally generated, non-core, and carry high potential accounting gains—exactly the assets useful for boosting reported earnings. The authors then show these sales concentrate among firms with strong incentives to hit earnings benchmarks, particularly narrow beaters and firms where executive incentives are salient. They further link the sales to subsequent insider equity sales, reinforcing the reporting-and-incentive interpretation. The paper concludes that financial-reporting incentives shape patent divestitures, with some patents ending up in the hands of patent-assertion entities.", "research_design": "An empirical design documenting within-fiscal-year timing of patent sales and relating it to earnings-management incentives, using USPTO patent assignment (reassignment) records linked to firm financials and earnings-expectation data. Tests compare final-month versus earlier sales, characterize the patents sold, and split by benchmark-beating and executive-incentive proxies. The unit of analysis is the firm (and patent sale).", "categories": ["Earnings Management", "Innovation & Intellectual Property", "Financial Reporting"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Accounting and Economics - 2026 - Kim and Valentine - Earnings targets, strategic patent sales, and patent trolls.pdf", "datasets": ["USPTO — Patent assignment (reassignment) records"]}, {"std_name": "Journal of Accounting and Economics - 2026 - Armstrong and Glaeser - Does taxpayer assistance encourage entrepreneurship", "journal": "Journal of Accounting and Economics", "year": 2026, "title": "Does taxpayer assistance encourage entrepreneurship?", "authors": ["Armstrong", "Glaeser"], "summary": "This paper examines whether help with tax filing and compliance affects entrepreneurship, focusing on IRS Taxpayer Assistance Centers that help taxpayers navigate the tax system. The authors find that Taxpayer Assistance Centers are positively associated with local entrepreneur entry and with overall Schedule C business income. They interpret this as evidence that assistance encourages traditional business entrepreneurship by reducing the compliance costs that stem from tax complexity. The paper highlights an underappreciated channel—tax administration and support—through which the tax system affects business formation. It connects the accessibility of tax assistance to real entrepreneurial activity.", "logical_flow": "The paper starts from the idea that tax complexity imposes compliance costs that may deter people from starting businesses, and asks whether reducing those costs through assistance encourages entrepreneurship. It focuses on IRS Taxpayer Assistance Centers, which help taxpayers—including would-be entrepreneurs—file correctly and navigate tax rules. The authors reason that easier access to such help should lower the effective cost of entering self-employment and thus raise local business formation. They relate the presence of Taxpayer Assistance Centers to local entrepreneur entry and to Schedule C business income. Finding positive associations on both margins, they interpret assistance as lowering compliance barriers to entrepreneurship. The paper concludes that the administrative side of the tax system, not just tax rates, shapes business formation.", "research_design": "An empirical design relating the local presence of IRS Taxpayer Assistance Centers to entrepreneurship outcomes, using IRS Statistics of Income Schedule C data and measures of local business entry. The analysis associates access to tax assistance with entrepreneur entry and business income across localities; the unit of analysis is the locality/area. The interpretation is that assistance reduces tax-compliance costs to entry.", "categories": ["Taxation", "Entrepreneurship", "Public Economics"], "shock": null, "missing_notes": null, "file_path": "/home/runner/work/Knowledge-Chest/Knowledge-Chest/Journal of Accounting and Economics - 2026 - Armstrong and Glaeser - Does taxpayer assistance encourage entrepreneurship.pdf", "datasets": ["IRS — Taxpayer Assistance Center locations", "IRS — Statistics of Income (Schedule C)"]}, {"std_name": "Journal of Accounting and Economics - 2026 - Berger and Tomy - Supply chain shocks and firm productivity The role of reporting quality", "journal": "Journal of Accounting and Economics", "year": 2026, "title": "Supply chain shocks and firm productivity: The role of reporting quality", "authors": ["Berger", "Tomy"], "summary": "This paper studies how reporting quality shapes firms' responses to an adverse supply-chain shock, using the 1999 Taiwan earthquake that disrupted supply chains for certain U.S. high-technology manufacturers. Affected firms experience increases in total factor productivity relative to unaffected firms, and this effect is stronger when pre-shock reporting quality is higher. The findings suggest that better information helps firms restructure effectively after shocks, not just in routine decisions. The paper extends t
